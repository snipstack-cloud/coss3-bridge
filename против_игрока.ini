# Настройка партии ЧЕЛОВЕК ПРОТИВ БОТА (1.10, просьба игрока).
#
# Правится руками, читается `против_игрока.py`. Всё, что здесь стоит, уезжает
# в игру командой NEW ДО загрузки карты — иначе игра берёт то, что осталось в
# меню, и партии выходят разными (12.09: 5000 ресурсов вместо 1000).
#
# ПРО СЛОТЫ, чтобы не искать это заново. Офлайн движок сажает локального игрока
# ТОЛЬКО на слот 0: `showcustomgame.inc:556` пишет туда имя профиля, а
# человеческим другой слот становится лишь по сетевому lanid (`:530-537`).
# Поэтому ваш слот всегда 0, а слот бота задаётся ниже — блок делает его
# человеческим и гасит на нём нативный ИИ, чтобы двух хозяев у одной армии не
# было.

[партия]
# Слот бота. 1 и больше; 0 нельзя — это ваш слот.
слот_бота = 1

# Нация обеих сторон, sid. net — Нидерланды, ими сыграны все 213 записанных
# прогонов, поэтому с ними партия сравнима с архивом. Пусто — не трогать выбор
# в меню.
нация = net

# Размер карты: 3 — маленькая (256 единиц), как требуют правила хакатона.
# Клетка сетки это width/16, то есть на маленькой карте 16 единиц.
размер_карты = 3

# Стартовые ресурсы: 0 — 1000, 1 — 4000, 2 — 5000 (initmapgen.inc:167).
ресурсы = 0

# Мирное время, индекс. 0 — ноль минут (_misc_GetPeaceTime, misc.script:4264).
мир = 0

# Воздушный шар: 2 — выдан ВСЕМ, и тумана войны нет ни у кого. На этом стоит
# право моста честно называть модели числа врага: на открытой карте человек
# видит их тоже.
шар = 2

# Пушки: 1 — без пушек, башен и стен НИ У КОГО (player.script:2703).
# ВНИМАНИЕ: с 1 частокол тоже под запретом, а просьба мака П7 просит его
# проверить. Для партии с частоколом ставьте 0.
пушки = 0

# Захват: 3 — только артиллерией. Это защита меры: по умолчанию крестьянина
# можно ЗАХВАТИТЬ вместо убийства, и из вражеского счёта он уходит так же.
захват = 3

# Рынок и дипломатия: 2 — рынка нет ни у кого.
рынок = 2

# Переход в 18 век: 1 — разрешён. Нужен, если собираетесь выходить в 18 век
# (просьба П8: столбец n18 и характеристики ненулевыми видно только так).
век18 = 1

# Скорость игры: 0, 1 или 2. Для живой партии против человека нужна обычная.
скорость = 0

[бот]
# Модель и как часто она решает.
модель = qwen2.5:7b
решение_раз_в = 15

# Горизонт партии в игровых секундах. 900 — пятнадцать минут, как в правилах.
горизонт = 900

# Подсказка. Пусто — без подсказки, как база army_waves_base.
подсказка =

# Что боту запрещено. Рынок и казарма 18 века — как в базе.
запрет = market,ba18

# Ключи, развязывающие запрос с блоком (решение мака 29.09: боту НЕ давать,
# чтобы его сторона мерилась вместе с базой). 0 — выключено.
армия_по_клеткам = 0
числа_18_века = 0

# Куда писать трассу и снимок. Имя идеи для результатов — igrok_<дата>.
каталог = C:\coss3-io-igrok
