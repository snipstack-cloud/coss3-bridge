# Настройка партии ЧЕЛОВЕК ПРОТИВ БОТА (1.10, просьба игрока).
#
# Правится руками, читается `против_игрока.py`. Всё, что здесь стоит, уезжает
# в игру командой NEW ДО загрузки карты — иначе игра берёт то, что осталось в
# меню, и партии выходят разными (12.09: 5000 ресурсов вместо 1000).
#
# ПРО СЛОТЫ, чтобы не искать это заново. Офлайн движок сажает локального игрока
# ТОЛЬКО на слот 0: `showcustomgame.inc:556` пишет туда имя профиля, а
# человеческим другой слот становится лишь по сетевому lanid (`:530-537`).
# Поэтому ваш слот всегда 0, а слот бота задаётся ниже — блок делает его
# человеческим и гасит на нём нативный ИИ, чтобы двух хозяев у одной армии не
# было.

# ЧИСЛА НИЖЕ ВЗЯТЫ ИЗ АРХИВА, а не из головы: `match.dat` прогонов 28.09
# (`coss3-results`, каталог 2026-09-28) несёт
#   nat 13 (Нидерланды), res 0, peace 0, balloon 2, cannons 1, capture 3,
#   market 2, century18 1, mapsize 3, speed 14.
#
# ОТЛИЧИЙ ОТ АРХИВА РОВНО ДВА, и оба названы на месте:
#   * `пушки = 0` вместо 1 — решение игрока 1.10 по совету мака: стены разрешить,
#     иначе просьбу П7 про частокол негде проверить;
#   * `ai1` тут нет и быть не может — нативного ИИ нет ни у кого, квитанция
#     отдаёт ai1 = -1.

[партия]
# Слот бота. 1 и больше; 0 нельзя — это ваш слот.
слот_бота = 1

# Нация. `нация` уезжает ОБОИМ слотам, если `нация_бота` пуста. net —
# Нидерланды, ими сыграны все 213 записанных прогонов, поэтому с ними партия
# сравнима с архивом. Пусто — не трогать выбор в меню.
нация = pol

# НАЦИЯ ВТОРОГО СЛОТА ОТДЕЛЬНО (29.10, ключ `nation2` мака; пусто — как было).
# Против человека слот 0 ваш, слот 1 бота: значит `нация` — ВАША, а
# `нация_бота` — его. Против ИИ наоборот (бот на нуле, ИИ на первом).
#
# ЗАЧЕМ ЭТО ЕСТЬ. Судья §170н «противник другой нации» — вопрос игрока от
# 25.10: «как обороняться, если он выберет Польшу». Поставьте `нация = pol`
# и `нация_бота = net`: вы играете Польшей, бот остаётся на Нидерландах, и
# сравнимость его хозяйства со всеми прежними партиями цела. Польша — sid
# `pol`, cid 6 (`sim/нации.py`); полный список там же.
#
# ВАЖНО, ЧТОБЫ ПАРТИЯ С ПОЛЬШЕЙ СУДИЛА ТО, ЗАЧЕМ ЗАДУМАНА: три ключа §170н
# (`качество_врага`, `стрелки_против_брони`, `конюшня_его`) в живом файле
# стратегии стоят НУЛЁМ, то есть бот будет обороняться, как от Нидерландов.
# Включать их — решение игрока, это меняет его поведение.
нация_бота = net

# Размер карты: 3 — маленькая (256 единиц), как требуют правила хакатона.
# Клетка сетки это width/16, то есть на маленькой карте 16 единиц.
размер_карты = 3

# Стартовые ресурсы: 0 — 1000, 1 — 4000, 2 — 5000 (initmapgen.inc:167).
ресурсы = 0

# Мирное время, индекс. 0 — ноль минут (_misc_GetPeaceTime, misc.script:4264).
мир = 0

# Воздушный шар: 2 — выдан ВСЕМ, и тумана войны нет ни у кого. На этом стоит
# право моста честно называть модели числа врага: на открытой карте человек
# видит их тоже.
шар = 2

# Пушки: 1 — без пушек, башен и СТЕН ни у кого (player.script:2703); 0 — всё
# разрешено.
#
# ЗДЕСЬ СТОИТ 0, И ЭТО РЕШЕНИЕ ИГРОКА 1.10, принятое по совету мака. Архив играет
# cannons = 1 (`match.dat` всех прогонов 28.09), и первая партия с игроком тоже
# игралась так — из-за чего `ewalls` вышло пустым, а просьба мака П7 про частокол
# осталась непроверенной: с запретом её негде проверить.
#
# Почему сравнимость тут не теряется. Партии ПРОТИВ ИГРОКА и так не сравниваются
# ни с архивом, ни с фермой: противник другого рода — человек, а не родной ИИ, и
# признак этого лежит в снимке (`p<n>_human`/`p<n>_ai`). Значит cannons = 1 в них
# не покупал сравнимости, а стоил частокола. В СЕРИЯХ ФЕРМЫ условия архива не
# трогать — там 1 остаётся.
пушки = 0

# Захват: 3 — только артиллерией. Это защита меры: по умолчанию крестьянина
# можно ЗАХВАТИТЬ вместо убийства, и из вражеского счёта он уходит так же.
захват = 3

# Рынок и дипломатия: 2 — рынка нет ни у кого.
рынок = 2

# Переход в 18 век: 1 — разрешён. Нужен, если собираетесь выходить в 18 век
# (просьба П8: столбец n18 и характеристики ненулевыми видно только так).
век18 = 1

# Скорость игры, ИНДЕКС: 0 -> множитель 7, 1 -> 10, 2 -> 14
# (`gc_settings_gamespeed_*`, dmscript.global:1027-1029). Архив играет 14, то
# есть индекс 2 — `match.dat` всех прогонов 28.09 несёт speed = 14.
#
# Чем это оборачивается для ЖИВОЙ партии: такт в 15 игровых секунд это около
# ОДНОЙ реальной, и облачная модель (ответ 2-5 с, а на медленном такте доходило
# до 41 с) будет опаздывать — в партии 1.10 на скорости 7 уже встречалось
# «решение готовилось 41 с при бюджете такта 11 с, применяется на 58 игровых
# секунд позже». Если хотите, чтобы бот успевал думать, ставьте 0 и помните, что
# с архивом партия тогда сравнима по всему, кроме скорости.
скорость = 2

[бот]
# МОДЕЛЬ ОСНОВНОГО ТАКТА. Это облачный пресет OpenRouter — тот самый, которым
# сыграны все 213 записанных прогонов (`docker/entrypoint.sh:53`,
# `COSS3_MODEL=@preset/coss3-bot`).
#
# ПОЧЕМУ НЕ ЛОКАЛЬНАЯ. Живая проверка 1.10: qwen2.5:7b родным путём со схемой
# отвечает годным JSON за 5-6 с, но в ПАРТИИ пять ходов подряд дала НОЛЬ команд
# — она пишет советы игроку в поля схемы вместо приказов. Это не настройка и не
# мост: мост отработал, ответ разобрался, трасса писалась. Основной такт на
# локальной модели в этом проекте не играл НИКОГДА — локальную держали на канале
# событий, и там она хороша.
модель = @preset/coss3-bot
решение_раз_в = 15

# АДРЕС основного такта. ПУСТО — OpenRouter из окружения (OPENROUTER_BASE_URL,
# а по умолчанию https://openrouter.ai/api/v1), ключ из OPENROUTER_API_KEY.
# Остаток счёта смотреть заранее: на 1.10 было 6,27 $, партии хватает с лихвой.
адрес =

# Горизонт партии в игровых секундах. 900 — пятнадцать минут, как в правилах.
горизонт = 900

# Подсказка. Пусто — без подсказки, как база army_waves_base.
подсказка =

# Что боту запрещено. Рынок и казарма 18 века — как в базе.
запрет = market,ba18

# Ключи, развязывающие запрос с блоком (решение мака 29.09: боту НЕ давать,
# чтобы его сторона мерилась вместе с базой). 0 — выключено.
армия_по_клеткам = 0
числа_18_века = 0

# ЛИШНИЕ КЛЮЧИ llm_policy, через пробел. Здесь стоят ФЛАГИ БАЗЫ СЕРИЙ
# (`docker/experiments.ini`, секция `army_waves_base`) — и ставить их надо, а не
# оставлять пусто. Живая партия 1.10 показала, почему: без них модель поставила
# мельницу и кузницу, заказала БЕСКОНЕЧНЫЙ найм крестьян, проела еду до 28 и к
# 276-й секунде не построила казармы вовсе. Каждый флаг закрывает ровно эту беду:
#
#   --food-floor 800        не тратить, пока еды меньше 800 — от голода
#   --barracks-first 1      казарма ПЕРВОЙ, прежде мельницы и кузницы
#   --no-gather 1           без сбора в кучу перед ударом
#   --hints-extra ...       подсказка про казарму первой
#   --memo                  модель помнит свои выводы между тактами
#   --world world.md        знание о мире (28.09: такой же рычаг, как ключ)
#
# Эти же флаги делают сторону бота СРАВНИМОЙ с базой — то, о чём просил мак.
#
# Локальную модель можно добавить сюда же, но НА КАНАЛ СОБЫТИЙ, где она хороша:
#   --event-model qwen2.5:7b --event-base-url http://10.41.3.52:11434/v1 --event-native
# Мак ездит по DHCP, адрес находит `python найти_ollama.py`.
#
# Если всё-таки захочется вести ТАКТ локальной моделью, без `--native` смысла
# нет вовсе: через /v1 ollama игнорирует response_format, и --schema там не
# действует (замер 1.10, 0 годных из 3 у всех трёх моделей).
ключи = --hints-extra hints_barracks_first.txt --barracks-first 1 --no-gather 1 --food-floor 800 --memo --world world.md

# Куда писать трассу и снимок. Имя идеи для результатов — igrok_<дата>.
каталог = C:\coss3-io-igrok
