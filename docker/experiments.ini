[face_threat]
что = СВЯЗКА 8: АРМИЯ СТОИТ НЕ НА ТОМ НАПРАВЛЕНИИ. Наблюдение игрока 20.09 глазами: «армия должна ставиться по направлению противника, иначе в бой врывается меньшим составом и проигрывает». Проверено счётом и подтвердилось: по 35 тактам боя у своей базы (три живые партии и base21) рядом с местом боя стоит МЕДИАНА 52 процента армии, в 48 процентах тактов меньше половины, и есть такты, где рядом НОЛЬ из 70, 74 и 76 бойцов. По 553 тактам девяти партий: угроза в пяти клетках выпадает в 186 тактах, и в 114 из них (61 процент) армия стоит в двух и более клетках от неё, медиана удаления 2 клетки, максимум 6. Связка даёт готовый STAGE в клетку МЕЖДУ базой и угрозой - у своих зданий, где размен 0,67 против 0,19 в поле, - с числом (сколько клеток и сколько секунд хода) и платой. Есть ПОРОГ ЗНАЧИМОСТИ: отряд от 10 бойцов или от трети наших свободных, иначе связка звала собирать тридцать бойцов против шести (такой такт в данных есть). Ключ --face-threat, по умолчанию выключен; срабатывает в 110 тактах из 553. ОТЛИЧИЕ ОТ base23 РОВНО ОДНО - этот ключ. МЕРЫ, названные ДО прогона (в скобках база): (1) ГЛАВНАЯ - доля армии, стоящей рядом с местом боя в тактах боя у базы (медиана 52 процента, меньше половины в 48 процентах тактов); (2) вехи и ЦЕЛЬ; (3) потери на волну ОТДЕЛЬНО при обороне и вылазке; (4) армия к пику и к концу, просадка армии врага; (5) сколько раз модель взяла STAGE по полям stage/stage_on и куда. ПРИЗНАК ВРЕДА, названный заранее: армия бегает между направлениями и не дерётся нигде - число смен клетки STAGE за партию растёт, армия к концу падает ниже базы, дом остаётся без прикрытия и наши крестьяне гибнут чаще
ref = verified
флаги = --memo --world /io/world.md --critic /io/разбор.md --episodes 2 --face-threat 1
копий = 2
база = base23

[first_soldier]
что = ПЕРВЫЙ БОЕЦ БЕЗ МОДЕЛИ: перебор параметров начала партии одним контейнером, партия за партией, нон-стоп (opening.py). Модель не зовётся вовсе, ключ провайдера не нужен. Цепочка жёсткая: ратуша -> кузница -> казарма -> пикинёр, ресурсов на неё хватает с первой секунды (1000 каждого при MATCH_RES=0), значит крутить можно только КТО и КОГДА строит: потолок строителей на ратуше, кузнице и казарме (3/6/9/12/18/все) и закладывать ли кузницу и казарму РАНО, не дожидаясь готового предшественника (примет ли движок - вопрос к игре). Каждая попытка - новая партия с ОДНИМ сидом карты (12345), первое сочетание играется дважды - проверка, что при равных параметрах время совпадает; если разброс больше 3 с, отчёт говорит об этом первой строкой и мелкую разницу засчитывать нельзя. Ориентир: наша первая казарма 141-170 с, у врага 88 с. МЕРА ОДНА - игровая секунда первого бойца; рядом вехи ратуша/кузница/казарма, когда что заложено и сколько строителей встало на котлован. Результат копится в /io/opening.jsonl и сводится в /io/opening.md после каждой партии, уезжает вместе с результатами. Горизонт попытки 300 игровых секунд, партий без лимита - гасить руками, когда сводка перестала меняться
ref = idea/first-soldier
флаги = --opening-search 1 --opening-seed 12345 --opening-horizon 300 --opening-attempts 0 --opening-repeat 2 --opening-strict 1
копий = 1
база = нет, это не сравнение идей, а поиск

[first_soldier_free]
