флаги = --opening-search 1 --opening-goal 20 --opening-wave 1 --opening-target cell --opening-seed 12345 --opening-horizon 900 --opening-attempts 0 --opening-repeat 3 --opening-strict 1 --opening-eco 1
копий = 1
база = нет, это поиск
