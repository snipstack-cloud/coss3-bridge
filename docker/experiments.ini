[exchange_hint]
что = ОТЛОЖЕНА 18.09, и после итога home_first её посылка «жди дома» опровергнута: враг за 15 минут приходит лишь в 4 партиях из 9, и то на 13-15-й минуте. Дублирует home_first игрока (заведена им тем же часом, на тех же 30 партиях и тех же числах 0,67 против 0,19). Разница только в форме: home_first даёт ПРАВИЛО (до 10:00 не ходить, мушкетёры, потом марш), эта - ФАКТ размена и условие «кулак больше защитников или жди дома». Играть ТОЛЬКО если home_first не сдвинет меры - тогда вопрос «правило или факт» станет осмысленным; два плеча с одной гипотезой подряд - трата фермы. Исходное описание: модели названы измеренные размены по месту: у базы врага его армия за такт не убывает ни разу (0 волн из 117 по parallel_start и base15), волна «в пути» не убивает никого, вся убыль врага случается дома, когда он приходит сам. ОТЛИЧИЕ ОТ base16 РОВНО ОДНО - дописка hints_exchange.txt. Зачем: по замеру поход - худшее из трёх действий, а модель шлёт «в пути» 56 процентов волн и каждый такт пишет «растянулись и гибнут поодиночке»; ей никто не сказал числом, что это не невезение, а правило. Это единственное действие из «главной формулы решения» (argmax U - λ·Risk), которое у нас измеримо: U по трём действиям взято из данных, а не из весов. МЕРА, названа ДО прогона, в скобках base15 на 15 партиях (на base16 пересчитать): 1) ДОЛЯ ВОЛН «В ПУТИ» по outcome_report.py (61 процент) - главное число, должно упасть; 2) доля волн «у врага» (28) - должна вырасти, и это волны крупнее; 3) размер волны, медиана (22); 4) вех (5 из 15); 5) убыль врага дома и у врага по тактам; 6) просадка деревни врага; 7) побед (0). Гипотеза: волн станет меньше, они станут крупнее и чаще будут доходить целыми - вехи вырастут. Чего НЕ ждём: побед и просадки армии врага - на них нужна масса, а не маршрут. Ловушка счёта: модель может уйти в глухую оборону и не слать волн вовсе - тогда доля «в пути» упадёт до нуля при нуле вех; поэтому меры 1 и 4 читать ТОЛЬКО вместе
