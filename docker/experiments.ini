[base27]
что = ТОЧКА ОТСЧЁТА на мосту 23.09, после решения игрока «события всегда локальные». base26 негодна для новых плеч: события в ней шли ОБЛАКОМ, а теперь идут локальной моделью, и у любого плеча против неё была бы вторая разница. ЧТО ОТЛИЧАЕТ ЭТУ БАЗУ ОТ base26, списком. (1) Событийный вопрос уходит qwen3:30b-a3b на мак РОДНЫМ путём ollama (/api/generate), где схема работает ГРАММАТИКОЙ: модель не может выдать токен вне JSON. Через /v1 та же модель думает 700-1400 токенов и отвечает 48-344 с, ни один из шести выключателей думания там не работает; родным путём - 27 токенов и 1,9-2,9 с, ЖДУ 0 из 9, годность 9 из 9 на девяти настоящих запросах из трасс. (2) У события появилось ЗАПАСНОЕ ОБЛАКО: до 23.09 отказ локального сервера означал молча пропавший повод. (3) Адрес событий проверяется до партии. (4) Починен переспрос ask() после мусорного ответа - он терял роль, схему и потолок, то есть событийный переспрос уходил с ролью общего такта. (5) Цена апгрейда читается по upg_avail (a83642d): в base26 функция читала поле, которого в живом состоянии нет, и цена не была названа НИ РАЗУ при 21 заказе. МЕРЫ, НАЗВАННЫЕ ДО ПРОГОНА. Прежние, с числами base26 для сравнения: (1) ВЕХА и времена (3/4, 271/305/337 с), ПОБЕДА отдельно (0/4); (2) доля стрелков к пику - у base26 и base25 ноль во всех восьми партиях, но в local_llama вдруг до 88 в одной, и это ОТКРЫТЫЙ ВОПРОС, а не мера плеча; (3) волн на партию (19,75); (4) TRAIN infantry17 и musk17 за серию (12 и 1); (5) крестьян врага к концу (120/114/154/80); (6) еда ниже 500 (медиана 18 процентов); (7) тактов «УЖЕ ЗАЛОЖЕНО» (19 процентов); (8) урезаний BALANCE (18 процентов); (9) поправок к вердикту ATTACK (9 на 206 тактов) и «ресурсов ХВАТАЕТ» (7). НОВЫЕ, РАДИ КОТОРЫХ БАЗА И СНИМАЕТСЯ: (10) ВРЕМЯ событийного вызова, медиана и МАКСИМУМ - предсказание по повтору и смоуку: медиана 2-3 с, максимум ниже 8 с (у облака в base26 1,7 и 6,5, в buy_wip хвост 17,5); (11) ГОДНОСТЬ событий - rejected пусто и команда ушла, ожидается всё; (12) СКОЛЬКО РАЗ СРАБОТАЛО ЗАПАСНОЕ ОБЛАКО - считать по полю model в трассе, ожидается НОЛЬ; если больше нуля, прогон негоден как локальная база и годен только как рассказ о надёжности мака; (13) ЦЕНА АПГРЕЙДА НАЗВАНА - у base26 0 из 21 по дефекту, ожидается около 20 из 21; это первая проверка починки в серии. КОНТРОЛЬ: первый ход не позже 15 игровой секунды; условия по match.dat - balloon 2, cannons 1, capture 3; модель ПРОГРЕТА до старта (warm_local.py, умолчание qwen3:30b-a3b). ЧЕГО ЖДАТЬ НЕ СЛЕДУЕТ: игра не должна измениться вовсе. События это 4,3 процента вызовов, а повод, на котором канал держится (найм по достройке), обычный такт ДУБЛИРУЕТ - измерено 23.09: после «ЖДУ» армия растёт так же, потому что такт заказывает найм сам, 3-6 команд TRAIN в том же окне. Поэтому сдвиг вехи, волн или стрелков на четырёх партиях - разброс, а не следствие локального канала. Честный ожидаемый итог: «времена событий локальные, запасное облако не понадобилось, игра прежняя»
итог = 4 партии 23.09 на мосту a8067a8, фермой, ВСЕ ДО ГОРИЗОНТА, 251 такт, 10 событий. КОНТРОЛЬ: мост и идея сверены во всех копиях, первый ход на 7-9 игровой секунде, условия balloon 2 cannons 1 capture 3, все четыре копии прошли РОДНЫМ путём (строка «адрес событий — ollama» в каждой). НОВЫЕ МЕРЫ. (10) ВРЕМЯ СОБЫТИЯ: медиана 3,5 с, максимум 6,0 с - предсказание «медиана 2-3, максимум ниже 8» выполнено по максимуму и промахнулось на полсекунды по медиане. У облака в base26 было 1,7 при максимуме 6,5, а в buy_wip хвост 17,5. То есть локальный канал ХУЖЕ ОБЛАКА ПО МЕДИАНЕ почти вдвое и лучше по хвосту; на повторе тех же запросов было 2,7 - в партии медленнее, видимо за счёт холодного контекста и одновременных вызовов четырёх копий. (11) ГОДНОСТЬ 10 из 10, отказов ноль. (12) ЗАПАСНОЕ ОБЛАКО НЕ СРАБОТАЛО НИ РАЗУ - все десять событий ответила qwen3:30b-a3b, ollama за четыре партии подряд не отвалилась. (13) ЦЕНА АПГРЕЙДА НАЗВАНА 40 ИЗ 40 против 0 из 22 у base26 - починка a83642d РАБОТАЕТ, и это её первая проверка в серии. Считать пришлось дважды: первый счёт искал слова «апгрейд» и «еды» и дал ЛОЖНЫЙ НОЛЬ, мост пишет «Его цена по состоянию:». ПРЕЖНИЕ МЕРЫ: цель 0 из 4, как и у base26; ЖДУ ноль; волн 101 против 79; TRAIN infantry17 22 против 12; еда ниже 500 по копиям [32,21,16,21] против [12,28,9,22]; тактов «УЖЕ ЗАЛОЖЕНО» 20 процентов против 19; урезаний BALANCE 25 против 21. ДВА НАБЛЮДЕНИЯ, КОТОРЫЕ НАДО ПРОВЕРИТЬ ОТДЕЛЬНО, А НЕ ЗАПИСЫВАТЬ В РЕЗУЛЬТАТ. Первое: UPGRADE заказано 40 против 22, и у этого есть механизм - модель ВПЕРВЫЕ видит цену апгрейда и знает, что падение еды это плата, а не прокорм; в base26 она шесть раз писала урок про прокорм. Второе: СТРЕЛКИ появились снова (до 67 в первой копии), хотя в base25 и base26 их ноль во всех восьми партиях; в local_llama было до 88. Стрелков заказывает ОБЫЧНЫЙ ТАКТ, то есть облако, и к событийному каналу это отношения не имеет. Ещё: вердиктов «НИКТО НЕ ПОШЁЛ» 11 против 22 и поправок к ним 1 против 9 - доля поправок упала с 41 до 9 процентов, причина неизвестна. ДЕНЬГИ: прогон стоил около 1,7 доллара
