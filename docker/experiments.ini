[open_info]
что = открытая информация о противнике (ветка idea/open-info, block_hstate.inc 1342): ресурсы, апгрейды и очереди врага, куда идёт его армия, сетка его крестьян, блок «наперерез», оценка обстановки по клеткам с прогнозом на минуту; --unfair умолчание. ОТЛИЧИЕ ОТ base17 - эта ветка целиком (python и hstate). МЕРА, названа ДО прогона, в скобках base17 (12 партий): 1) доля волн в клетку с вердиктом «можно»/«шанс» и их исход - главное; 2) падения крестьян врага (2,5) и вех (0); 3) перехватов и ENGAGE; 4) армия к концу (94), враг (180). Гипотеза: модель бьёт по крестьянам без стражи и наперерез волне, падений крестьян врага больше
