[base26]
что = ТОЧКА ОТСЧЁТА на мосту 22.09 ночь. base25 негодна для новых плеч: между ней и текущим master ТРИ правки, и все меняют то, что модель видит каждый такт. (1) Фильтр строящегося в таблице «что купить» - она больше не зовёт покупать то, что уже строится (в base25 звала в 16-23 процентах тактов). (2) Сторож устаревшего снимка - такт, чьё игровое время меньше предыдущего, пропускается: в таком снимке заложенная стройка пропадает из wip, и модель заказывала её второй раз (7 повторов из 9 после отката, p около 0,0007). (3) Три вердикта итога прошлого решения: UPGRADE называет цену из upg_shown (девять падений еды на 2000-4300 за такт были платой за bar.pikeman, а модель шесть раз записала урок «прокорм съедает больше поля»); «НИКТО НЕ ПОШЁЛ» помечен неокончательным и поправляется следующим тактом по wave_sent (7 ложных вердиктов из 26); «дело в ресурсах» говорится только при непокрытой цене (шесть ложных диагнозов про мельницу). Схема события в master тоже есть, но облачных вызовов она НЕ касается, и для этой базы разницы не составляет. СОБЫТИЙНЫЙ КАНАЛ ВЫКЛЮЧЕН везде, где он за ключом; повод «найм по достройке» включён всегда и потому часть базы. ЛОКАЛЬНОЙ МОДЕЛИ ЗДЕСЬ НЕТ НАМЕРЕННО - она плечо, а не база. МЕРЫ, названные ДО прогона. Прежние девять, как в base25, с числами базы для сравнения: (1) ВЕХА - убит крестьянин врага, в пределах 15 минут и за партию, с временами (base25: 4/4, 329-584 с); ПОБЕДА отдельно (0/4); (2) доля стрелков в армии к пику (0 во всех); (3) менял ли враг состав - тактов со стрелками и конницей (1 такт в одной партии из четырёх, конницы 0); (4) событийных вызовов на партию и их медиана (2,2 при медиане 488 с); (5) волн на партию (19,5); (6) TRAIN infantry17 и UPGRADE за партию (4,75 и медиана 8,5); (7) крестьян врага к концу (110/146/127/59); (8) доля тактов с едой ниже 500 (медиана 23 процента); (9) первая секунда заказа шахты (медиана 187 с). НОВЫЕ ШЕСТЬ, ради которых база и снимается - они мерят сегодняшние правки и раньше были неизмеримы: (10) доля тактов с ответом «УЖЕ ЗАЛОЖЕНО» - у base25 31 процент, у buy_wip с одним фильтром 23; если фильтр и сторож вместе дадут заметно меньше, станет видно, сколько стоила каждая причина; (11) сколько раз сработал сторож устаревшего снимка - за три контейнерные партии НИ РАЗУ, и это число надо знать, прежде чем считать его полезным; (12) сколько раз вышла ПОПРАВКА к вердикту ATTACK - по base25 ожидается около 7 на 200 тактов; (13) сколько раз итог назвал цену апгрейда; (14) сколько раз сказано «ресурсов ХВАТАЕТ» вместо ложного «дело в ресурсах»; (15) ЧАСТОТА УРЕЗАНИЯ BALANCE по новому полю «вмешательство» - в base25 она была неизмерима вовсе (счёт по трассе давал ложный ноль при восьми упоминаниях в уроках модели). КОНТРОЛЬ: первый ход не позже 15 игровой секунды; условия по match.dat - balloon 2, cannons 1, capture 3. ЧЕГО ЖДАТЬ НЕ СЛЕДУЕТ: ни одна из трёх правок не добавляет модели ни ресурса, ни команды - они убирают ложь из описания мира. Если веха или волны сдвинутся на четырёх партиях, это шум, а не результат; честный ожидаемый итог - «ложных вердиктов стало меньше, игра прежняя»
