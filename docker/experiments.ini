что = СВЯЗКА 1: ГОТОВЫЙ ПРИКАЗ РЯДОМ СО СТРОКОЙ «ЕГО ОТРЯД В K КЛЕТКАХ». Строка говорится с 19.09 и называет число (сколько их, сколько остальных, перевес против ЭТОГО отряда), но приказа при ней нет. По правилу матрицы это то же, что молчание: замер 20.09 на 51 такте - MOVE упомянут в 75 процентах тактов и отдан НОЛЬ раз, UPGRADE назван в 2 процентах и отдан 56 раз, потому что рядом стоят цена и выигрыш. Связка ставит рядом готовый ATTACK count:"all" в клетку отряда, размен у базы (0,67 против 0,19 в поле, замер 30 партий) и ПЛАТУ (дом без прикрытия, остальные подходят). Ключ --base-hit, по умолчанию выключен. ЕСТЬ ЛИ ШАНС, посчитано ДО прогона пересчётом по 209 состояниям base21: строка «ЕГО ОТРЯД» выпадает в 76 тактах, из них 49 - в 3-5 клетках, где блок «ВРАГ У ТВОЕЙ БАЗЫ» (радиус 2) молчит; в этих 49 тактах модель посылала волну ДВАЖДЫ и лишь ОДИН раз в клетку этого отряда. То есть положение мост распознаёт, а модель его не отрабатывает. ОТСЕЧКА ПО СИЛЕ: приказ даётся только когда свободных хватает на кулак по размену (43 такта из 49); в остальных 6 мост говорит вслух «бить нечем, держи дома» - без неё связка звала бы бить отряд 8 последними десятью бойцами при 130 его рядом, такой такт в base21 есть. ОТЛИЧИЕ ОТ base22 РОВНО ОДНО, и это ДОКАЗАНО, а не заявлено: при выключенном ключе промпт совпал с прежним ДОСЛОВНО на всех 209 состояниях base21 (сверка рендера до и после правки). МЕРЫ, названные ДО прогона (в скобках база): (1) ГЛАВНАЯ - вехи и ЦЕЛЬ (0 из 4 у base21); (2) доля тактов с приказом связки, где модель ДЕЙСТВИТЕЛЬНО послала волну в клетку этого отряда - база 1 такт из 49, считается по полю aim трассы против клетки отряда, пересчитанной из состояния; (3) просадка армии врага (268 за 4 партии base21) и потери на волну ОТДЕЛЬНО при обороне и вылазке; (4) армия к пику и к концу (294/267/200/223 и пехота 285/171/194/218); (5) волн на партию (4,75). ПРИЗНАК ВРЕДА: модель начнёт дробить армию на мелкие вылазки к каждому отряду - волн станет больше, а потери