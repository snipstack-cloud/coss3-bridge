итог = НЕ ЗАПУСКАТЬ, ОТМЕНЕНА 17.09 ПОСЛЕ ДВУХ ПАРТИЙ. Идея стояла на ошибке счёта, и ошибка моя. Долю приказов по крестьянам я считал по ВСЕМ записям с полем цели, а в подавляющем большинстве из них волны не было (attack = 0): цель по умолчанию в питоне - base, и она проставлялась в каждом таком такте. Отсюда и взялись «1652 приказа по базе против 112 по крестьянам». Если считать ТОЛЬКО настоящие волны, картина обратная: base14 - 112 волн на крестьян против 2 на базу (98 процентов), base15 - 57 из 57 (100 процентов). Модель всегда бьёт по крестьянам, и принуждать её не к чему: за две отыгранные партии подмена не сработала НИ РАЗУ, потому что цель и так была верной. Вместе с идеей отменяются два вывода от 17.09: «модель ведёт волну к зданию» и «правда в промпте не подействовала» - менять было нечего. Настоящий вопрос остаётся: волна доходит до базы в 83 процентах партий, бьёт по крестьянам, и всё равно за 30 партий у врага не убыло ни одного бойца. Дело в силе удара, а не в прицеле

[parallel_start]
что = ратуша и мельница закладываются СРАЗУ обе, строители пополам. Подсказка игрока, проверенная замером на живой игре 17.09 двумя заходами с обратным порядком: при постройке по очереди (все 18 на ратушу, мельница после) мельница готова на 204 и 209 секунде; при параллельной закладке с делением строителей 9 и 9 - на 141 и 136, то есть на 63-73 секунды раньше, а ратуша отстаёт всего на 18-20 секунд. Это много, потому что поле сеется при готовой мельнице и зреет ещё около 105 секунд, а пока еда ниже 500, не идёт НИКАКОЙ наём. Абсолютные числа замера медленнее игровых (мой скрипт шлёт команды реже, чем модель), но оба плеча мерены одинаково, и разница между ними и есть ответ. Проверено, что запрета нет: промпт прямо говорит «mill требует: ничего», и в таблице зависимостей мельницы нет. Модель делает так лишь иногда - в одной партии из трёх, - потому что рассуждает как оптимизатор одной стройки: все руки на критический путь. ОТЛИЧИЕ ОТ base15 РОВНО ОДНО - дописка hints_parallel_start.txt. МЕРА, названа ДО прогона, в скобках base15 на 15 партиях: 1) ВРЕМЯ ГОТОВНОСТИ МЕЛЬНИЦЫ (64 с) - главное число; 2) время, когда первый крестьянин встал на еду (170 с); 3) время выхода еды выше 500 (207 с); 4) доля тактов под порогом еды (16 процентов); 5) время готовности ратуши (27 с) - ДОЛЖНО УХУДШИТЬСЯ секунд на двадцать, это цена; 6) армия максимум (80). Гипотеза: мельница встанет секунд на сорок раньше, конец голода сдвинется на столько же, и освободившиеся такты уйдут в наём. Если ратуша опоздает БОЛЬШЕ чем на двадцать секунд или армия упадёт - размен не окупился
