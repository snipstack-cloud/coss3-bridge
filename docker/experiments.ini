[order]
что = ПОРЯДОК ДЕБЮТА, НАЙДЕННЫЙ ПОИСКОМ — замысел игрока 27.09: «победа это решить ряд задач за минимальное время; перемешать комбинации и вывести идеальный набор». Сделано не обучением, а лучевым поиском по порядкам строительства (sim/дебют_поиск.py, луч 10, глубина 7, 8 отложенных партий, цель — армия к 900 с). Предпосылки взяты из кода (country.script:2926-2944). НАЙДЕНО: ратуша 19 с, мельница 34, кузница 49, КАЗАРМА 64, железная шахта 109, склад 119, золотая шахта 134; армия к 900 с — 153. ЧТО ЭТО ЗНАЧИТ ПРОТИВ ЖИВОЙ ИГРЫ (69 записей): у нас ратуша 44 с, мельница 58, кузница 96, казарма 181, железная шахта 138, золотая 234, армия 136. То есть казарма опаздывает почти на две минуты, и это главная потеря. ПОЧЕМУ ПОИСК БЫСТРЕЕ: он не строит до казармы ничего лишнего, ведёт КАЖДУЮ стройку всеми свободными крестьянами и перед каждой добирает ВСЕ ресурсы цены, а не один. ПАРАЛЛЕЛЬ ПРОВЕРЕНА И ОТВЕРГНУТА (замысел «9 на ратушу, 9 на мельницу»): симулятор её умеет — две стройки одним тактом встают к 29 с, — но на КРИТИЧЕСКОМ ПУТИ она вредит, потому что время делится на строителей: цепочка ратуша-кузница-казарма всеми даёт казарму на 59-й секунде, та же цепочка вдвое параллельно — на 159-й, втрое — на 184-й. Параллель безвредна только для зданий ВНЕ пути к казарме (на этой же ошибке сам поиск сначала встал: камень 0 при цене 100, шахта не строилась 164 такта). ЧТО ДЕЛАЕТ ИДЕЯ: подсказка hints_order.txt — порядок, добор всех ресурсов, ничего лишнего до казармы, железо сразу после неё, золота выше 3000 не копить. МЕХАНИЧЕСКАЯ МЕРА: время постройки КАЗАРМЫ — ждём раньше 120 с (в архиве 181, кв1 160). МЕРЫ: (1) армия к 900 с — ждём выше 136; (2) времена ратуши, мельницы, кузницы, железной шахты — ждём каждое раньше архивной медианы; (3) золото в конце — ждём ниже 10 000 (в архиве 14 187); (4) убитые крестьяне — НЕ мера этой идеи, но и не должны упасть ниже базы. ЧЕГО НЕ ЖДАТЬ: перемен в бою — идея только про дебют. ОГОВОРКА: порядок найден в симуляторе, где стройка делится на