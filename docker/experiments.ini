[rear_shooters]
что = РАЗДЕЛЬНОЕ УПРАВЛЕНИЕ КЛЮЧОМ, а не подсказкой — решение игрока 27.09 после двух редакций split_control. ОТКУДА: подсказкой процедура не переносится (счёт 27.09: доехали все три задания про целевое состояние — доля крестьян на еде, академия к минуте, «армию дома не копи»; не доехало ни одно про процедуру — окно 3х3, FORMATION по готовности, мушкетёры в тыл следующим ходом, 0 MOVE из шести копий). Плюс найденный в мосте дефект: обычный путь удара ТЕРЯЛ поле who модели, то есть «бей пикинёрами» молча превращалось в «бей всеми» — починено, и обе редакции split_control мерили не то. ЧТО ДЕЛАЕТ КЛЮЧ --rear-shooters 6: удар модели уходит пикинёрами (если она сама вида не назвала), а мушкетёров мост отводит в такт без удара в клетку за 6 клеток от боя на линии к нашей базе, и переставляет, когда бой ушёл; всё говорится и в лог, и в запрос. ПРОВЕРЕНО СМОУКОМ 27.09: удары «КЕМ: infantry17», отводы 21 и 26 мушкетёров в (2,10) за шесть клеток от боя (1,4). МЕРЫ ДО ПРОГОНА, в скобках база no_gather (bed4de0): (1) МЕХАНИЧЕСКАЯ — снимков с полем «тыл» больше нуля в каждой копии (у базы поля нет вовсе, ключ выключен), иначе идея не доехала; (2) расстояние от тыла до клетки боя — ждём ровно 6, это проверка арифметики на живых числах; (3) размен, его потери на нашу (1,06/0,67/0,55) — ждём выше: в этом весь смысл, мушкетёр из тыла бьёт подходящих, а вплотную он не боец (radiusmin 300 пикселей = 5,6 клетки, unit.script:7898); (4) наши потери (173/232/174) — ждём НИЖЕ; (5) убито крестьян (117/95/5) — не ждём роста, пикинёр убегающего не догоняет; (6) КОНТРОЛЬНАЯ — время первой волны (277/278/276 с), ключ не должен её задерживать; (7) состав: стрелков макс (42/55/19) — ключ состава не касается, подсказка та же, что у базы, и уезжать ему причин нет. ЧЕГО НЕ ЖДАТЬ: что модель сама начнёт водить два вида — она этого не делает, в том и смысл ключа. ПРЕДСКАЗАНИЕ МАКА, НАЗВАННОЕ ДО СЕРИИ (sim/тыл_стрелков.py, 12 отложенных партий, план: две казармы, доля стрелков 0,30, еда 50 %): куча как сейчас — размен 0,23 при наших потерях 232; раздельно с ВЫКЛЮЧЕННЫМ законом тыла — 0,14 при 122; раздельно с ВКЛЮЧЁННЫМ — 1,80 при 122. Ветки расходятся в ТРИНАДЦАТЬ раз, третьего числа быть не может: около 1,8 — закон тыловой стрельбы верен и входит в ядро, около 0,14 — закон отвергнут, стрелки в тылу просто не воюют. РАЗНИЦ ПРОТИВ БАЗЫ ДВЕ, И ЭТО НАРОЧНО (решение игрока 28.09): ключ отвода И принудительный состав — подсказка требует держать оба вида, стрелков около трети, с угольной шахтой и второй казармой, как в плане симулятора. Без мушкетёров мосту некого отводить, и серия проверяла бы пустоту: на составе в no_gather стрелков 42/55/19 при армии 199/127/171, то есть от трети он далеко. Поэтому плечо отвечает на вопрос про ЗАКОН (1,8 против 0,14), а не на вопрос «уедет ли состав» — и сравнивать его с базой по составу нельзя, только по размену и потерям
итог = 3 КОПИИ 27.09 (мост 125b1fb): КЛЮЧ ДОЕХАЛ, ЗАКОН НЕ ПРОВЕРЕН. Механическая мера взята — снимков с полем «тыл» 36 / 119 / 65 против нуля у базы, мост отводил стрелков как задумано. Размен 0,60 / 0,09 / 0,21 (в окне тыла 0,57 / 0,09 / 0,19) при предсказании мака 1,80 за верный закон и 0,14 за отвергнутый: медиана 0,21 и хуже кучи, причём ХУЖЕ ВСЕХ та копия, где стрелков было 47 процентов армии. ПРИЧИНА НЕ В ЗАКОНЕ, А В ГЕОМЕТРИИ: перепроверил дальность по коду — у мушкетёра radiusmin 400 пикселей и radiusmax 800 (lib/unit.script:774), делённые на gc_pixels_to_tile 53,3333 это 7,5 и 15,0 ЕДИНИЦЫ, а клетка сетки 16 единиц. То есть мушкетёр стреляет от половины клетки до одной, а мы отводили его на ШЕСТЬ клеток = 96 единиц, в 6,4 раза дальше предельного выстрела: он физически не мог стрелять, и чем больше его доля, тем хуже размен. Ошибка была в world.md со слов игрока 27.09 («radiusmin 300 пикселей это 5,6 клетки»): 300 — у другого варианта мушкетёра, а деление даёт единицы, не клетки; запись поправлена. СЛЕДСТВИЕ: закон тыловой стрельбы на масштабе КЛЕТОК невыразим (предел 15 единиц меньше клетки в 16), его масштаб — поле «между» внутри клетки; а «стрелять из-за пики» движок делает сам, если стрелки посланы ВМЕСТЕ с пикой, и база именно так и играет: 1,06 / 0,67 / 0,55 против 0,09-0,60 у раздельного управления. В ключ поставлен предохранитель: при значении больше 1 мост говорит вслух, что стрелки уйдут за предел выстрела. Разбор - разборы/REAR_SHOOTERS_ПРОТИВ_NO_GATHER.md
