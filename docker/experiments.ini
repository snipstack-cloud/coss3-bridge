что = ПРОСТОЙ КРЕСТЬЯН: повод «руки» с порогом ДВА свободных. Болезнь не двигалась с 13.09 и ни одна из 90 идей её не называла. На base27 свободные крестьяне есть в 66-75 процентах тактов по копиям, медиана простоя 2 человека при максимуме 19, тактов вовсе без простоя 27 из 251. Повод «руки» в базах ВЫКЛЮЧЕН, поэтому отличие от base27 ровно одно - ключ --free-hands 2. Повод не новый: он заведён 21.09 и срабатывает ДВУМЯ способами - переход on_build в ноль и накопленный долг простоя (600 крестьяно-секунд), плюс пауза между вопросами. ПРЕДСКАЗАНИЕ, ПОСЧИТАННОЕ ПО ТРАССАМ base27 ДО ПРОГОНА: при пороге 2 событий выходит 8,8 на партию (при пороге 4 - 6,8, при 6 - 6,0), то есть порог почти всегда выполнен и настоящий ограничитель - долг и пауза, а не он. ВОПРОС УХОДИТ ЛОКАЛЬНОЙ МОДЕЛИ, как и все события с 23.09: qwen3:30b-a3b родным путём ollama. На живой игре 23.09 семь событий «руки» из тринадцати ответила именно она за 1,8-4,1 с, и мост принял ответы. ПОВОД ЛЕЧИТ НАБЛЮДЕНИЕ ИГРОКА: в живой партии БЕЗ повода на 500 с на еде было 20 человек, на 519 с - трое при 13 свободных, еда упала 1598 -> 496, то есть под порог 500, и бесконечный найм встал; С поводом свободных держалось 0-2 при 24-27 на еде. МЕРЫ, НАЗВАННЫЕ ДО ПРОГОНА: (1) ГЛАВНАЯ - доля тактов со свободными 2 и больше (base27: 66-75 процентов по копиям) и медиана свободных в такте (base27: 2); (2) событий «руки» за партию и время каждого - ожидается около 9 и 2-4 с; (3) годность событий и сколько раз сработало запасное облако (ожидается ноль); (4) доля тактов с едой ниже 500 - у base27 медиана 21 процент: если руки возвращаются на еду, она должна упасть; (5) КОНТРОЛЬ игры: веха и её время, цель, волн на партию, крестьян врага к концу, TRAIN infantry17. ЧЕГО ЖДАТЬ НЕ СЛЕДУЕТ: ОДНА ПАРТИЯ - ЭТО ПРОБА, А НЕ ИЗМЕРЕНИЕ (решение игрока: денег в обрез). Сдвиг вехи или цели на одной партии не значит ничего; смотреть надо на простой и на то, что отвечает модель. Для счёта нужны четыре копии
итог = ПРОБА ОСТАНОВЛЕНА ИГРОКОМ на 480 игровой секунде (25 тактов), мост 1e36fca, одна копия. КАНАЛ РАБОТАЕТ: три события «руки» за 480 с (предсказание 8,8 на полную партию - сходится по темпу), все ответила qwen3:30b-a3b родным путём за 3,8-6,8 с, мост принял все три, запасное облако не понадобилось. ГЛАВНОЕ, ЧТО ВЫЯСНИЛОСЬ, И ЭТО ПРО МЕНЯ, А НЕ ПРО МОДЕЛЬ: все три раза модель послала людей НА ДЕРЕВО, и я записал это как порок - «кормить не начала». Прочитал запрос целиком: мост сам говорит ей «closed: food=no_mill», то есть послать на еду НЕЛЬЗЯ, мельницы ещё нет, открыты только дерево и камень. Модель выбрала единственное осмысленное. Правило 2 проекта в чистом виде: прежде чем чинить модель - прочитай, что мост ей сказал. ВТОРОЕ ПРО МЕНЯ: МЕРА, НАЗВАННАЯ ДО ПРОГОНА, НЕГОДНА. «Доля тактов со свободными 2 и больше» даёт 68 процентов против 66-75 у базы, но медиана простоя - 3 человека при 38 крестьянах, то есть мера считает крохи и не отличает беду от мелочи. Правильная мера - ДОЛЯ КРЕСТЬЯНО-СЕКУНД В ПРОСТОЕ, та самая, в которой болезнь и была найдена. По ней за первые 480 с: 14,0 процента у пробы против 19,0 / 15,3 / 14,9 / 19,7 по копиям base27 (в среднем 17,2). Это ниже среднего базы, но ВНУТРИ ЕЁ РАЗБРОСА, и посчитано ПОСЛЕ прогона - значит по правилам проекта это не результат этой идеи, а мера для следующей. ЧТО ДЕЛАТЬ: повторить на четырёх копиях, назвав главной мерой крестьяно-секунды (у base27 17,2 процента за первые 480 с и 14,3 за партию целиком), и добавить контроль «сколько раз еда была ЗАКРЫТА в момент вопроса» - если мельницы нет, повод спрашивает впустую, и это отдельная правка: не спрашивать, пока открыто меньше двух направлений. ДЕНЬГИ: проба стоила около 0,2 доллара
