[base13]
что = второе плечо для food_share: флаги base12 БУКВА В БУКВУ, но на том же мосту, что играет food_share. Зачем отдельная база: base12 отыграна 16.09 на мосту 49abf0d, а food_share идёт на 3818d82, и между ними исправлено ложное знание про порог еды - world.md теперь говорит, что 500 гасит ЛЮБОЙ наём, а не только бесконечный, и это видно ОБОИМ плечам. Сравнивать food_share прямо с base12 значило бы мерить две разницы сразу: дописку и исправленное описание мира. base13 их разводит: food_share против base13 отличается ровно одной строкой подсказки, а base13 против base12 показывает отдельно, сколько стоило ложное знание. МЕРА, названа ДО прогона, в скобках base12 на 15 партиях: 1) доля тактов с едой ниже 500 (48 процентов); 2) крестьян на еде, медиана (9 из 29); 3) первая волна (515 с) - контрольная мера для обоих плеч; 4) армия на 10:00 (48) при армии врага (61); 5) доля тактов с заказом бойцов при готовой казарме (43 процента); 6) цель (5 из 15). Гипотеза: числа base13 совпадут с base12 в пределах разброса - тогда исправление описания мира само по себе поведения не изменило, и вся разница с food_share принадлежит подсказке
