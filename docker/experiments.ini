[gather_resets]
что = ПРЕДЕЛ НА СБРОСЫ СРОКА СБОРА: --gather-resets 1. Отличие от базы ОДНО. Зачем: срок 120 с считается заново от последнего подкрепления (правило игрока home_first), а подкрепление идёт почти каждый такт, поэтому зависший поход нельзя ни завершить, ни отменить. Счёт по свежим трассам 24.09 (разборы/ИСТЁК.md): на 12 походов истечение ОДНО, local_llama/4 шёл 870 игровых секунд при 31 сбросе срока, base27/3 — 555 с при 21 сбросе; войско всё это время не воюет и не освобождено. Ключ НЕ приближает удар (этим занят --gather-share) — он возвращает ВЫХОД. МЕРЫ, названные ДО прогона: (1) ГЛАВНАЯ — доля походов, кончившихся хоть чем-нибудь (удар или истечение): сейчас 7 из 12 по свежим прогонам, предсказание при пределе 1 — 12 из 12, при пределе 2-5 — 9 из 12; (2) КОНТРОЛЬ, что не отняли ударов: доля походов с ударом, сейчас 6 из 12, предсказание — те же 6, потому что удар случался раньше, чем предел успевал сработать; (3) длина зависшего похода: сейчас максимум 870 с, ожидается не больше expires плюс такт; (4) игровые меры для контроля, что игра не изменилась: веха, волны на партию, убито крестьян врага. ЧЕГО ЖДАТЬ НЕ СЛЕДУЕТ: роста цели. Освобождённое войско само по себе не убивает — оно лишь перестаёт стоять; выигрыш, если он есть, проявится через переиспользование бойцов в следующем походе, а это уже вторая ступень. ОГОВОРКА О РАЗМЕРЕ: предсказание считано по 12 походам четырёх прогонов, из них половина в плечах с другими правками; как механика видно по одному случаю (870 с, 31 сброс), как доля не измерено.
