[barracks_first]
что = КАЗАРМА ДО ЖЕЛЕЗНОЙ ШАХТЫ — найдено лучевым поиском порядков 27.09 (§15ж спецификации). ОТКУДА: стратегия раннего рейда (§15е, названа игроком) требует армии к 300-й секунде, потому что его запас еды до шестой минуты кормит лишь 5-31 бойца и резня крестьян тогда рушит его производство, а после восьмой минуты запас кормит 400+ и та же резня уже ничего не меняет (замер по 88 записям: его еда 128 на 2-4-й минуте, 785 на 4-6-й, 5810 на 6-8-й, 23 380 к концу). Поиск порядков дал ратуша, мельница, кузница, КАЗАРМА, железная шахта — казарма к 84-й секунде и 33 бойца к 300-й. ЧТО ДЕЛАЮТ ЗАПИСИ: казарма медианно на 181-й секунде, железная шахта на 142-й, и в 65 партиях из 87 шахта раньше казармы; бойцов к 300 с 13 в медиане при максимуме 33. ПОЧЕМУ ШАХТА РАНЬШЕ — ПОТЕРЯ: стартовые ресурсы по 1000 каждого (86 партий), то есть 500 золота на казарму есть сразу, а 1000 железа это 50 пикинёров, и шахта в начале добывает то, что уже в казне, за 100 дерева, 100 камня, пятерых крестьян и 94 секунды. МЕРЫ ДО ПРОГОНА ПЕРЕПИСАНЫ 27.09 ПОД НОВУЮ БАЗУ. БАЗА ТЕПЕРЬ no_gather256 (карта 256, три копии, мост d04a8a8), и все пороги ниже — её: наши потери 221/245/164, его потери 105/119/119, размен 0,48/0,49/0,73, убито крестьян 27/49/62, убито до 6:00 — 8/7/4, бойцов к 300 с — 11/16/1, его еда на 8-й минуте 4502/7156/8552, казарма 225/179/272 с, железная шахта 89/138/438 с (то есть раньше казармы в ДВУХ копиях из трёх), его крестьян к концу 129/34/50, его армия к концу 144/118/89, наша армия к концу 38/69/85, голод НИ В ОДНОЙ. Архивные пороги (убито 117/95/5, потери 173/232/174, размен 1,06/0,67/0,55) — карта 320 и НЕДЕЙСТВИТЕЛЬНЫ. ЖДЁМ: (1) МЕХАНИЧЕСКАЯ — железная шахта ПОСЛЕ казармы во всех трёх копиях (у базы раньше в двух из трёх); (2) МЕХАНИЧЕСКАЯ — казарма не позже 120 с (база 225/179/272); (3) бойцов к 300 с — 20 и больше (база 11/16/1, и это ХУЖЕ архива, где было 13 в медиане: на маленькой карте ранняя армия даётся тяжелее); (4) убито его крестьян до 6:00 — больше 15 (база 8/7/4); (5) ГОЛОД (еда падает 5 окон по минуте подряд после 7:00 И его крестьян меньше 30) — хотя бы в одной копии (у базы НИ В ОДНОЙ); (6) КОНТРОЛЬНАЯ — наша армия к концу (база 38/69/85), роста не ждём: ключ даёт армию РАНЬШЕ, а не больше; (7) размен (база 0,48/0,49/0,73) — не ждём роста, ранний бой идёт малыми силами. База no_gather256
