[local_qwen3]
что = ПОВТОР ПЛЕЧА local_events НА ДУМАЮЩЕЙ МОДЕЛИ. Прошлое плечо (разобрано 23.09, разборы/ПЛЕЧО_LOCAL_EVENTS.md) взяло свою меру и провалило смысл: хвост срезан начисто (максимум 2,7 с против 6,5 у base26 и 17,5 у buy_wip), отказов моста ноль из девяти, НО qwen2.5:7b ответила ЖДУ в 5 событиях из 9, а облако - 0 из 20. Повод заведён на ДОСТРОЙКУ здания, и пока модель ждёт, новая казарма стоит пустой: канал работает, а дело своё не делает. Повадка подтверждена вторым независимым замером - на стенде докупки 22.09 та же модель отказалась в 5 случаях из 8, а qwen3, qwen2.5:14b и llama3.1 - ни разу. ЗДЕСЬ МЕНЯЕТСЯ РОВНО ОДНО ПРОТИВ local_events: событийная модель qwen3:30b-a3b вместо qwen2.5:7b. СВЯЗКА ТА ЖЕ, ЧТО И ТАМ, и названа целиком: локальная модель + схема событийного ответа (она включается ровно тогда, когда событие уходит локальной) + ТЕПЕРЬ ВЫКЛЮЧАТЕЛЬ ДУМАНИЯ. Третье слагаемое новое и без него прогон был бы заведомо негоден: qwen3 думающая, и через /v1 схема думание НЕ выключает - замер 22.09 на одном вопросе найма дал 48 с и ПУСТОЙ ответ (рассуждение съело MAX_TOKENS), без схемы 28,8 с и JSON после 864 токенов рассуждения, а со схемой и reasoning_effort=none - 1,1 с и 19 токенов. Ключ --event-reasoning заведён 23.09, уходит ТОЛЬКО локальному клиенту событий (облачным он чужой), самопроверка selftest_event_reasoning.py, 14 проверок. Обычный такт идёт в облако, как и в базе. МЕРЫ, НАЗВАННЫЕ ДО ПРОГОНА. (1) ГЛАВНАЯ, и ради неё всё: ДОЛЯ СОБЫТИЙ С ОТВЕТОМ ЖДУ - у qwen2.5:7b 5 из 9 (56 процентов), у облака 0 из 20, у qwen3 на стендах 0 из 8 докупки при 11/11 найма и 21/21 рук. Если ЖДУ останется выше трети, локальная событийная модель хоронится как ветка, а не перебирается дальше по списку. (2) ВРЕМЯ событийного вызова, медиана и МАКСИМУМ: у облака в base26 1,5-1,7 при максимуме 6,5, у qwen2.5:7b 2,3 при 2,7. Ожидание - хвоста нет; если максимум перевалит за 10 с, выключатель не сработал, и это видно мерой (5). (3) ГОДНОСТЬ - доля событий, чей ответ мост принял (rejected пусто, команда ушла): у облака 20 из 20, у qwen2.5:7b 9 из 9. (4) КОНТРОЛЬ СВЯЗИ - сколько раз в логе «сервер не принял reasoning_effort» и «сервер не принял СХЕМУ СОБЫТИЯ», сколько вызовов сорвалось вовсе. Ollama на маке 22.09 ДВАЖДЫ переставал слушать порт, и 23.09 утром порт снова не отвечал: если это повторится в партии, прогон НЕГОДЕН, а не медленный. (5) ПУСТЫХ ОТВЕТОВ ДОЛЬШЕ 40 СЕКУНД - ноль. Это подпись невыключенного думания, и в трассе она неотличима от молчания модели, поэтому мера заведена отдельно. (6) ИГРОВЫЕ, для контроля, что игра не изменилась - веха и времена (base26: 3/4, 271/305/337 с), событий на партию (2,2, медиана 474 с), волн на партию, TRAIN и UPGRADE, еда ниже 500 (медиана 18 процентов), тактов с «УЖЕ ЗАЛОЖЕНО» (19 процентов), урезаний BALANCE (18 процентов). (7) КОНТРОЛЬ ПАРТИИ: первый ход не позже 15 игровой секунды, условия по match.dat - balloon 2, cannons 1, capture 3. ЧЕГО ЖДАТЬ НЕ СЛЕДУЕТ: событий выходит 2-3 на партию, то есть 9-12 на четыре, шаг доли около 10 процентов - повадку «ждёт или нанимает» это покажет, числом не станет; игровые меры на четырёх партиях это шум, и сдвиг вехи или волн результатом не считается. Честный ожидаемый итог - «ЖДУ пропало, хвоста нет, годность та же, игра прежняя». АДРЕС МАКА 23.09 СМЕНИЛСЯ с 10.41.3.31 на 10.41.2.77 (DHCP), и это стоило получаса: ping отвечал «host unreachable» ОТ ШЛЮЗА, а Windows считает такой ответ полученным пакетом и пишет «0 процентов потерь» - проверять портом, а не пингом. МОДЕЛЬ ГРЕЮТ ДО СТАРТА (warm_local.py qwen3:30b-a3b): она втрое тяжелее qwen2.5:7b, и загрузка первым событием попала бы прямо в такт
итог = НЕ ЗАПУЩЕНА, и запускать нельзя - проверено 23.09 до траты денег. ДУМАНИЕ У qwen3 ЧЕРЕЗ ЭТОТ СЕРВЕР НЕ ВЫКЛЮЧАЕТСЯ НИЧЕМ. Замер 22.09 (reasoning_effort=none даёт 1,1 с и 19 токенов) 23.09 НЕ ВОСПРОИЗВЁЛСЯ: на ollama 0.34.2 этот ключ думание не гасит, а лишь перестаёт отделять рассуждение - оно льётся в content. Проверены все четыре выключателя на коротком запросе: reasoning_effort=none (14,3 с, 300 токенов, рассуждение в content), reasoning_effort=low (32,8 с), chat_template_kwargs.enable_thinking=false (10,5 с), think=false на РОДНОМ /api/chat (214 с, 1385 токенов, /think в содержимом) - везде рассуждение целиком. Настоящий событийный запрос путём моста (схема, /v1): 120 с и 927 токенов на ответ в 12 слов. Вторая причина, независимая: машина тянет эту модель 6,5 токена в секунду, то есть даже без думания 30B здесь не жилец. Плечо отдано llama3.1:8b, секция local_llama. ДОБАВЛЕНО 23.09 ВЕЧЕРОМ, повтор остановлен на пятом вопросе из девяти (смотреть как наблюдение, не как счёт): ШЕСТОЙ ВЫКЛЮЧАТЕЛЬ /no_think В ТЕКСТЕ ТОЖЕ НЕ РАБОТАЕТ - 31,9 с и полное рассуждение. И ГЛАВНОЕ: НА ПУТИ МОСТА qwen3 ЖДЁТ ТАМ ЖЕ, ГДЕ ЖДАЛА qwen2.5:7b - два ЖДУ из двух при еде 256 и 250, теми же словами «еда ниже порога». Довод плана «qwen3 на стендах не ждал ни разу» оказался свойством СТЕНДА: там мерили другой повод (докупку) и другим путём (/api/generate с грамматикой). Времена на настоящих запросах: 48, 68, 173 и 344 с, один вызов сорвался по таймауту вовсе; ответ на 344 с занял 1190 токенов при потолке MAX_TOKENS 1200 - то есть был на волос от обрезки, а в трассе обрезка неотличима от молчания модели
