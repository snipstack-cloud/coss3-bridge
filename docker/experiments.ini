что = ДОЛЯ КРЕСТЬЯН НА ЕДЕ, НАЗВАННАЯ ЧИСЛОМ — найдено симулятором 27.09 (§13ф спецификации). НЕ ПОВТОР ЗАКРЫТОЙ food_share (16.09, цель 0 из 15 против 5 у base12): та подсказка числа не называла, и доля на еде сдвинулась с 28 до 30 процентов, то есть до диапазона, где эффект виден, серия не дошла. ОТКУДА: перебор распределения крестьян по 12 отложенным партиям одним и тем же планом. Доля наземных крестьян на еде 50/65/75/85 процентов даёт убитых крестьян врага 12,5/30,1/56,4/67,6 и размен 0,18/0,28/0,39/0,41 при АРМИИ 214/212/206/198 — то есть еда не покупается ценой войска. Механизм: 32 апгрейда стоят еды, ступеней защиты берётся 3/4/4/5, а защита и есть размен. Дерево с камнем не голодают: при 85 процентах к концу 3501 дерева и 1898 камня, вторая казарма отстаёт на 84 секунды (624 против 540). ПО ПУТИ ЗАКРЫТО ДВЕ ОШИБКИ ЗАМЕРА: доли золота и железа не влияли ни на что, потому что в шахту входит пять человек и число шахтёров задаётся числом шахт, а не долей; и в ядре не было предела населения (100 за ратушу + 150 за казарму + 25 за дом), теперь есть и сверен с движком на 17 600 тактах. ЧТО ДЕЛАЕТ: подсказка hints_food_share2.txt — пять человек на шахту и не больше, из наземных две трети на еду, апгрейды защиты 2.3 и 2.4 до 10:00. МЕРЫ ДО ПРОГОНА, в скобках no_gather (bed4de0): (1) МЕХАНИЧЕСКАЯ — доля крестьян на еде в приказах BALANCE (39/50/56 процентов), ждём не ниже 70, иначе идея НЕ ДОЕХАЛА и остальные числа не значат ничего; (2) ступеней защиты пикинёра заказано (3/3/3), ждём 4 и больше; (3) убито крестьян (117/95/5); (4) наши потери (173/232/174), ждём НЕ ВЫШЕ; (5) размен, его потери на нашу (1,06/0,67/0,55), ждём выше; (6) КОНТРОЛЬНАЯ — время первой волны (277/278/276 с), уедет вправо значит еду купили темпом и идея проиграла, как проиграла free_peasants. ЧЕГО НЕ ЖДАТЬ: абсолютных чисел симулятора (у его базы закон боя щедрее жизни, §13з) — проверяется ПОРЯДОК: больше людей на еде, больше ступеней защиты, лучше размен. База no_gather, не base28
итог = 3 КОПИИ 27.09 на мосту cd330ce против трёх no_gather (bed4de0). МЕХАНИЧЕСКАЯ МЕРА ВЗЯТА: доля наземных крестьян на еде медиана 76 / 72 / 79 процентов против 61 / 58 / 53 у базы, размахи НЕ ПЕРЕСЕКАЮТСЯ (минимум идеи 72 против максимума базы 61) — впервые за три серии идея доехала до игры целиком. Два звена цепочки симулятора отработали: апгрейдов всего 17 / 10 / 13 против 10 / 7 / 9, из них ступеней ЗАЩИТЫ 13 / 7 / 10 против 6 / 4 / 5; и армия не просела — 162 / 242 / 175 против 218 / 171 / 188, то есть еда действительно не покупается ценой войска. НО ИСХОД ХУЖЕ БАЗЫ ПО ОБЕИМ МЕРАМ: убито крестьян без голода 0 / 9 / 6 против 117 / 95 / 5, размен 0,48 / 0,49 / 0,17 против 1,06 / 0,67 / 0,55 (размахи не пересекаются) — больше ступеней защиты дали ХУДШИЙ размен, и это прямое опровержение звена «защита и есть размен». ЧЕМ ПРОИГРАЛА: стрелков макс 0 / 0 / 129 против 42 / 55 / 19 у базы — в двух копиях их НЕ БЫЛО ВОВСЕ при сохранённом присутствии у его крестьян (37 / 100 / 27 против 90 / 106 / 30), а 25.09 по этой же паре плеч показано, что убийства требуют И присутствия, И стрелков: пикинёр убегающего не догоняет. Третья копия обратная: стрелков 129, присутствия 27, размен худший 0,17 — дралась с армией вместо крестьян. ГИПОТЕЗА, НЕ ИЗМЕРЕНИЕ: подсказка называет числа для еды и апгрейдов, и еда ушла в ступени защиты пикинёра, вытеснив мушкетёров (в no_gather состав был выбором модели). ЧТО БРАТЬ ДАЛЬШЕ: звено «еда → апгрейды» работает, его стоит взять в связке с прямым требованием держать стрелков — это новая идея, а не повтор. ПОБОЧНО: первые живые числа по полю «между» (расстояние между кучами) — при 10+ и малых кучах 93 процента тактов без потерь, но с поправкой «не меньше двадцати с каждой стороны» без потерь остаётся 12-25 процентов, то есть размер куч объясняет больше, чем зазор; самая смертельная полоса 3-5 единиц, а не 0-2. Разбор - разборы/FOOD_SHARE2_ПРОТИВ_NO_GATHER.md
