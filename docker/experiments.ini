[assess_local]
что = формула перевеса чинена 19.09 вечером: подкрепление врага считается ПО КЛЕТКАМ frow, а не комком из центра масс его армии. До починки "встретит" равнялся ВСЕЙ его армии в 1229 случаях из 1229, и "перевес" мерил глобальный перевес вместо местного; заодно была мертва ветка ШАНС - за 422 такта не выпала ни разу. Отличие от base18 ровно одно, в коде: флаги те же. МЕРЫ, названные ДО прогона: (1) сколько раз выпал вердикт ШАНС за партию - на base18 было 0; (2) доля волн с вердиктом можно/шанс и их исход - дошла (mil_far>=180) и убила (веха); (3) распределение "перевес" на новой шкале - медиана и максимум, против 0,49 и 1,85 у старой; (4) "их_успеют" против "их_подкрепление" - какая доля армии врага реально успевает, на старой формуле было 100 процентов всегда; (5) контроль base18: волн, первая волна, армия к концу, просадка армии врага, падений крестьян врага, вех
