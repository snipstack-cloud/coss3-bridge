итог = 2 ПАРТИИ 24.09 на мосту 5156a14 (игрок задал две копии ради денег), обе до горизонта, 112 тактов. ИЗМЕРИТЬ НЕ УДАЛОСЬ, И ВИНОВАТ НЕ КЛЮЧ: за две партии случился ОДИН поход. В первой копии он был и кончился ИСТЕЧЕНИЕМ (то есть ровно так, как обещал ключ: выход вернулся, войско освободилось), во второй марша не было вовсе. У base28 в одной копии маршей ноль, в другой фаза «удар» без предшествующего сбора. Предсказание «12 походов из 12 кончатся хоть чем-то против 7 из 12» проверить НЕ НА ЧЕМ: один поход это не доля. ЧТО ЭТО ЗНАЧИТ - ПОВТОР ВЧЕРАШНЕГО УРОКА: механика сбора включается 0-1 раз за партию (вчера по gather: три марша на четыре партии), а модель просит атаку в сотне тактов. Любое плечо про планку, срок или сбросы упирается в это: чтобы измерить правку, касающуюся трёх событий на серию, нужны не четыре партии, а десятки. СЛЕДУЮЩИЙ ВОПРОС НЕ «КАКОЙ ПРЕДЕЛ», А «ПОЧЕМУ МАРШ ПОЧТИ НЕ ЗАВОДИТСЯ» - он бесплатный, считается по трассам, и без ответа на него деньги на боевые плечи тратить нельзя. Ключ оставляем: он верен по смыслу, самопроверен на 15 случаев и ничего не стоит, пока выключен по умолчанию. ДЕНЬГИ: около 0,9 доллара

[base28]
что = ТОЧКА ОТСЧЁТА ПОСЛЕ ТРЁХ ПРАВОК, А НЕ ОДНОЙ. Поправлено 24.09 на Windows: в первой редакции этой секции была названа только правка вердикта, а между base27 и сегодняшним мостом лежат ТРИ изменения, и все три меняют то, что модель видит или делает каждый такт. Неполный список разниц — это ровно то, чем погибла base24. (1) ВЕРДИКТ: мост перестал говорить «отправлено» там, где игра отказала, и называет направление по имени — прежде роль бралась из сырого поля ответа и выходила пустой, отчего вердикт не попадал ни в одну проверку. (2) ПОТОЛОК СТРОИТЕЛЕЙ ДЕЛИТСЯ между закладками такта (--split-builders, по умолчанию 1): блок применяет одно число к КАЖДОЙ стройке и не снимает людей с недостроя, поэтому первая закладка забирала всех, а вторая получала «nobody to build it». Замер debut4 (4 партии): этот отказ пропал совсем против 1/1/2/0 у base27, мельница встаёт на 68 с против 84, первый человек на еде на 156 против 180. (3) ЗАЛЕЖЬ ВНЕ РАДИУСА ЗАКРЫВАЕТ НАПРАВЛЕНИЕ: игра ищет залежь в 40 единицах (еду вокруг мельницы, дерево и камень вокруг ратуши), а мост считал места по сетке в десяти КЛЕТКАХ и звал ставить людей туда, куда игра их не пошлёт — во всех 58 тактах дебюта восьми партий направления числились открытыми, а BALANCE не двигал никого. Теперь отказ GATHER закрывает своё направление и переводится словами, с подсказкой сеять поле или строить ближе. Живой игрой ни одна из трёх не проверена. Зачем новая база: это правки ПРОМПТА и поведения, а он уходит модели каждый такт, значит base27 для новых плеч больше не эталон. Проба на одной партии: вердиктов с именем 13 против нуля у базы, простой в дебюте 26,3 процента против 44,5 — но одна партия ничего не мерит. МЕРЫ те же, что у base27, плюс две новые: (1) сколько раз сказано «НЕ СРАБОТАЛО, игра отказала» — у пробы ноль, случая не было; (2) ДОЛЯ КРЕСТЬЯНО-СЕКУНД ПРОСТОЯ ПО ОТРЕЗКАМ 0-200 / 200-500 / 500+, у base27 это 44,5 / 6,8 / 6,6. Простой мерить ТОЛЬКО так: доля тактов со свободными — негодная мера, проверено на hands2. ЧЕГО ЖДАТЬ НЕ СЛЕДУЕТ: сдвига цели от самой правки вердикта — она возвращает модели правду о том, ушёл ли приказ, а не меняет решения
итог = 2 ПАРТИИ 24.09 на мосту ba27c0d (игрок задал две копии ради денег), обе до горизонта, 120 тактов. БАЗА СЛАБАЯ И ЭТО НАДО ПОМНИТЬ: по правилу проекта три копии уже наблюдение, а не измерение, две — тем более; разброс дебюта видно прямо здесь, простой первых 200 с вышел 45,9 у одной копии и 28,7 у другой. ПРАВКИ ДОЕХАЛИ, ВСЕ ТРИ ПРОВЕРЕНЫ КОНТРОЛЬНЫМИ ЧИСЛАМИ: вердиктов С ИМЕНЕМ направления 40 и 34 против НУЛЯ у base27; «nobody to build it» НОЛЬ в обеих против 1/1/2/0 у base27 (деление потолка строителей работает и здесь). ПРОСТОЙ ПО ОТРЕЗКАМ: 45,9/6,7/5,0 и 28,7/11,3/8,5 против 44,5/6,8/6,6 у base27 — то есть в тех же пределах, дебют по-прежнему стоит впятеро дороже остальной партии. «ИГРА ОТКАЗАЛА» НОЛЬ РАЗ И ЗДЕСЬ — одиннадцать партий подряд без единого срабатывания. Это уже не «случая не было», а подозрение на мёртвую ветку: вероятно, отказ GATHER приходит СЛЕДУЮЩИМ тактом после команды, а вердикт смотрит на состояние текущего. ПРОВЕРИТЬ СЧЁТОМ ДО СЛЕДУЮЩЕГО ПРОГОНА, это бесплатно. СОБЫТИЯ ЗАМЕДЛИЛИСЬ ВТРОЕ: медиана 8,1 и 9,9 с против 3,5 у base27 при максимуме 6,0. Событий мало (2 и 3), так что число шаткое, но разница велика и её надо объяснить прежде, чем мерить плечи: мак за сутки переехал на 10.41.3.184, и путь до него мог стать длиннее. ИГРА: веха в обеих; убито крестьян врага 6 и 7 против 42/37/7/35 у base27, у врага к концу 113 и 130 против 47/94/115/55. По главному направлению это ХУЖЕ базы, но на двух партиях при таком разбросе выводов не делаю. ДЕНЬГИ: около 0,9 доллара
ДОСНЯТО 24.09 ВЕЧЕРОМ ДО ЧЕТЫРЁХ КОПИЙ (3 и 4 на мосту 4b691da). ОТВЕТ НА ВОПРОС «РАЗБРОС ИЛИ ПРАВКА» = НЕ РАЗБРОС. Убито крестьян врага по копиям 6/7/7/23, медиана 7, среднее 10,8 - против 42/37/7/35 у base27 (медиана 36, среднее 30,2). Три копии из четырёх в единицах там, где у base27 одна из четырёх. Крестьян врага к концу 113/130/127/95 против 47/94/115/55. ЧЕМ ОТЛИЧАЕТСЯ БОЙ (по трассам): атакует base28 не реже (тактов с ATTACK 29/35/14/39 против 13/25/33/30), отказов и вето ноль, бойцов вдали столько же (медианы 35/47/0/50 против 20/42/54/39) - НО пехота к концу 261/126/350/258 против 38/170/317/82 и свои потери 113/261/66/86 против 217/203/92/277. То есть армия у base28 крупнее, выходит так же часто, теряет меньше и убивает меньше: она ХОДИТ, но НЕ БЬЁТ. Механизм не найден: ни одна из трёх правок (вердикт BALANCE, деление потолка строителей, закрытие направления по отказу) не касается атаки, а закрытие направления в base28 не сработало вообще ни разу (отказов GATHER ноль). ПРИЗНАНИЕ ОШИБКИ МЕТОДА, И ОНА МОЯ: копии 1-2 и 3-4 сняты на РАЗНЫХ мостах. Между ними в master лёг вердикт «пустая команда BALANCE» (утро 24.09), то есть база внутри себя неоднородна - ровно то, от чего предостерегает урок base24, и ровно то, что я сам дописывал в описание этой базы днём раньше. Правки промпта нельзя класть в master, пока снимается база; впредь - только за ключом или после базы. debut4 (4 копии, мост между base27 и base28: деление потолка и вердикт есть, закрытия направления нет) убивала 12/40/6/33, медиана 22 - то есть спад идёт ступенями base27 36 -> debut4 22 -> base28 7, и это может быть как накопление правок, так и три независимых разброса. РАЗВЕСТИ можно только прогонами по одной правке за раз, а денег на это нет. Пока: С base28 СРАВНИВАТЬ МОЖНО ТОЛЬКО ПЛЕЧИ НА ТОМ ЖЕ МОСТУ, и помнить, что сама база бьёт слабо. ДЕНЬГИ: ещё около 0,9. Если цель сдвинется, искать причину в другом месте, а не записывать её сюда.
