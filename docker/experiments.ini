[auto_upgrade2]
что = ТОТ ЖЕ КЛЮЧ АПГРЕЙДОВ, НО С ЗАПАСОМ ЕДЫ — и на этот раз против ЧИСТОЙ базы. ОТКУДА: серия auto_upgrade 28.09 (см. её итог) взяла механическую меру — вмешательств 11/16/5, — но провалила главные: крестьян 56/49/30 против 93/33/93, размен 0,36 против 0,61 по медиане. Механизм найден в одной строке ключа: запас вычитался из ЗОЛОТА, а еда тратилась до нуля, тогда как апгрейды стоят едой (bar.musketeernet.1.1 — 2000). В двух копиях из трёх еда кончилась при золоте 7-11 тысяч, в трассе «Еда на нуле, найм стоит», и состав перевернулся: мушкетёров 0 и стрелков 0 против 13 и до 112 у базы. Мушкетёр стоит 40 еды против 25 у пикинёра — при нулевой еде модель берёт дешёвого. ЧТО ИЗМЕНЕНО: ключ теперь не тратит еду ниже запаса (--auto-upgrade-food 800 — двадцать мушкетёров по 40, якорь такой же объяснимый, как казарма 500 у золота), и говорит про оба резерва вслух. Проверка selftest_auto_upgrade.py, 16 проверок, из них 5 про запас еды; проверка 13 доказывает, что исход решает именно он (тот же такт без запаса покупкой проходит, с запасом — нет). И ВТОРОЕ, ЧТО ИСПРАВЛЕНО В ПОСТАНОВКЕ: база переснимается ТЕМ ЖЕ ПРОГОНОМ на этом же мосту. В прошлый раз база играла на c677b26, идея на f9308c3, а между ними в строку fighters, которую ЧИТАЕТ МОДЕЛЬ, добавились члены dinit/dmgs/dmgp — отличий было два вместо одного, и переворот состава на ключ списать было нельзя. МЕХАНИЧЕСКИЕ МЕРЫ, ОБЯЗАНЫ СРАБОТАТЬ: вмешательств «UPGRADE ВЗЯТ МОСТОМ» больше нуля в каждой копии; еда в последнем такте НЕ ноль ни в одной копии (именно это и починено); мушкетёров TRAIN больше нуля хотя бы в одной копии, то есть состав не перевёрнут. ГЛАВНЫЕ МЕРЫ (база — food_floor, переснятая сегодня): наши потери НИЖЕ базы; убито его крестьян ВЫШЕ; размен ВЫШЕ — сравнивать по медиане трёх и смотреть, пересекаются ли размахи. КОНТРОЛЬНЫЕ: бойцов к 300 с и армия к 10:00 не ниже базы (ключ не занимает ход модели и не должен мешать найму); золото к концу НИЖЕ базы (деньги пошли в дело), а еда к концу НЕ НИЖЕ базы (запас работает). ЧЕГО НЕ ЖДАТЬ: скачка по цели — отсечение сети обещает четверть по убитым и шестую часть по потерям, а не победу.
