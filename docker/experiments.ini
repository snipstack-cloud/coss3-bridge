что = не строить вторую казарму, пока первая простаивает. Гипотезу подсказал критик 16.09 («узкое место золото»), но причину он назвал неверно - шахту. Разбор его же партии: золото 5000 -> 1458, из них первая казарма 500 на 141-й секунде и ВТОРАЯ 2500 на 189-й, а весь найм крестьян за партию - около 99. Цена из данных игры: costpercent = 500 (unit.script:2472), каждая следующая казарма впятеро дороже. При этом по base11 и base12 казарма простаивает две трети тактов из-за еды, то есть вторая не добавляет бойцов, а золото вынимает. ОТЛИЧИЕ ОТ base12 РОВНО ОДНО - дописка hints_one_barracks.txt. НЕ ПУТАТЬ с gold_first2 (отыграна 15.09, опровергнута): та двигала ДОБЫЧУ золота раньше, эта трогает РАСХОД. МЕРА, названа ДО прогона, в скобках base12 на 15 партиях: 1) партий со второй казармой - главное число, должно упасть; 2) минимум золота за партию; 3) доля тактов с заказом бойцов при готовой казарме; 4) армия максимум (43); 5) цель (5 из 15). Гипотеза: вторая казарма не влияет на армию вовсе, а сэкономленные 2500 золота видны в апгрейдах и найме
