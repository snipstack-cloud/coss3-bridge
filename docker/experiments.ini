что = ТО ЖЕ, ЧТО debut, НО ЧЕТЫРЬМЯ КОПИЯМИ - измерение вместо пробы. Флаги те же, мост тот же; отдельная секция заведена нарочно, чтобы проба (одна партия, результаты debut/1) не смешалась с замером. ЧТО ПРОВЕРЯЕТСЯ: деление потолка строителей между закладками такта (--split-builders, по умолчанию 1) плюс вчерашняя правка вердикта - разниц против base27 ДВЕ, и это сказано заранее. ПРЕДСКАЗАНИЕ, НАЗВАННОЕ ДО ПРОГОНА ПО ЕДИНСТВЕННОЙ ПРОБЕ (её и проверяем, четыре партии против четырёх): (1) «nobody to build it» - ноль или почти ноль против трёх копий из четырёх у base27; (2) мельница встаёт раньше: у пробы 51 с, у base27 90/57/78/90, то есть медиана должна упасть ниже 78; (3) первый человек на еде раньше: у пробы 147 с, у base27 177/142/189/182; (4) ПРОСТОЙ ПЕРВЫХ 200 СЕКУНД - главная мера: у пробы 23,2 процента, у base27 42,1/41,2/38,1/53,6, и если медиана плеча не опустится ниже 38, правка не работает. ОТДЕЛЬНО ПРОВЕРЯЕТСЯ ОТКРЫТЫЙ ВОПРОС ПРОБЫ: (5) простой ЗА ПАРТИЮ ЦЕЛИКОМ - у пробы 36,4 процента против 6,6-10,2 у base27, потому что с 456-й секунды модель перестала поднимать итоговые числа на ресурсах и к концу простаивала половина деревни. Если это повторится в нескольких копиях - у нас новая болезнь и она дороже вылеченной; если нет - то была одна партия, ушедшая в войну. (6) сколько раз сказано «игра отказала» - вторая половина правки вердикта до сих пор не проверена ни разу. ИГРОВЫЕ, для сверки, НЕ как результат: веха и её время, убито крестьян врага (у пробы 48 при наших потерях 5 бойцов, у base27 42/37/7/35), крестьян врага к концу (у пробы 11, у base27 51/94/115/55), цель. ЧЕГО ЖДАТЬ НЕ СЛЕДУЕТ: проба была одной партией и могла быть удачей; честный исход замера - «цепочка дебюта подтвердилась, игра в пределах разброса»
итог = 4 партии 23.09 на мосту 4651016, все до горизонта. МЕХАНИЧЕСКИЙ ДЕФЕКТ ПОЧИНЕН НАСОВСЕМ: «nobody to build it» НОЛЬ раз во всех четырёх копиях против 1/1/2/0 у base27; потолок делился 2/3/4/4 раза за партию, то есть правка работает и работает часто. ЦЕПОЧКА СДВИНУЛАСЬ: мельница встаёт по медиане на 68 с против 84 (по копиям 85/62/75/43 против 90/57/78/90), первый человек на еде на 156 с против 180 (162/150/146/165 против 177/142/189/182). ОБА ПРЕДСКАЗАНИЯ ВЫПОЛНЕНЫ. НО ГЛАВНАЯ МЕРА НЕ ВЗЯТА: простой первых 200 секунд - медиана 38,6 процента против 41,6 у базы, а порог был назван до прогона («если медиана не опустится ниже 38, правка не работает»). По копиям 40,7/42,5/36,6/26,3 против 42,1/41,2/38,1/53,6 - размахи перекрываются почти целиком. ЗНАЧИТ: мельница и еда приходят раньше, а люди всё равно стоят - узкое место дебюта НЕ в том, что вторая закладка осталась без артели. Правку оставляем (она чинит настоящий дефект и ничего не стоит), но простой она не лечит. ПРОБА БЫЛА УДАЧЕЙ, И ЭТО ГЛАВНЫЙ УРОК ЗАМЕРА: на одной партии простой дебюта вышел 23,2 процента (лучше всех), убито 48 крестьян врага при 11 оставшихся - а на четырёх партиях убито по медиане 22 против 36 у базы, и у врага осталось 117/115/124/55 против 47/94/115/55. То есть по главному направлению плечо СКОРЕЕ ХУЖЕ базы, и блестящая партия была разбросом, а не находкой. ОТКРЫТЫЙ ВОПРОС ПРОБЫ ЗАКРЫТ: простой за партию целиком 7,9/8,7/10,9/12,3 против 10,2/6,6/8,4/8,1 у базы - те же числа, никакой новой болезни нет; 36,4 процента у пробы были одной партией, ушедшей в войну. «ИГРА ОТКАЗАЛА» НОЛЬ РАЗ и здесь: вторая половина правки вердикта не проверена уже в девяти партиях подряд, и это стоит объяснить отдельно - возможно, условие стало недостижимо. ДЕНЬГИ: около 1,7
