что = ОДИН ТАКТ - НЕСКОЛЬКО ДЕЛ. Замысел игрока 23.09 по его наблюдению в живой партии: на 52-й секунде модель отдала одним ходом BUILD мельницы, BUILD склада, BUILDERS 8 и BALANCE по еде, дереву и камню (6/6/6), объяснив это словами «ставлю мельницу, без неё еда не добывается, параллельно начинаю цепочку к армии». Игрок увидел это глазами и попросил, чтобы так было чаще. Идея - ОДНА СТРОКА подсказки (hints_split.txt) поверх постоянных, отличие от base27 ровно в ней; ни ключей, ни правок кода. ЗАЧЕМ ЭТО ДОЛЖНО РАБОТАТЬ: BUILDERS задаёт ПОТОЛОК строителей, а не «всех», и пока модель этого не использует, поставив стройку, она оставляет людей стоять до следующего такта - а он приходит медианно через 21 секунду, 90-й процентиль 46 с. Простой стоит 14-19 процентов всего труда деревни (счёт по base27, крестьяно-секунды). МЕРЫ, НАЗВАННЫЕ ДО ПРОГОНА: (1) ГЛАВНАЯ - ДОЛЯ КРЕСТЬЯНО-СЕКУНД В ПРОСТОЕ за партию; у base27 по копиям 19,0/15,3/14,9/19,7 за первые 480 с, в среднем 17,2 (мера названа правильно с первого раза, в отличие от hands2, где я назвал долю тактов и она оказалась негодной); (2) ДОЛЯ ТАКТОВ, ГДЕ В ОДНОМ ХОДЕ ЕСТЬ И BUILD, И BUILDERS, И ХОТЯ БЫ ДВА BALANCE - это прямая мера того, чему учит строка. ТОЧКА ОТСЧЁТА ПОСЧИТАНА ДО ПРОГОНА: у base27 таких тактов 47 из 251 = 19 процентов, у gather 36 из 241 = 15. То есть модель УЖЕ делает так в каждом пятом такте, и строка должна поднять эту долю заметно выше, иначе она ничему не научила; (3) число BALANCE за партию и число направлений в такте; (4) КОНТРОЛЬ игры: веха и её время, цель, волн на партию, еда ниже 500, крестьян врага к концу. ЧЕГО ЖДАТЬ НЕ СЛЕДУЕТ: строка учит ФОРМЕ хода, а не замыслу, и если простой не упадёт при выросшей доле таких ходов - значит форма ни при чём, и это тоже ответ
