ОПАСНОСТЬ, здесь все оценённые волны в УДАР. 14 волн ушли в клетки ВНЕ оценённых мостом шести - это следующий вопрос. ОСТОРОЖНО: 9 против 6 партий, вехи 2 против 1 - наблюдение, не измерение

[via_rally]
что = клетка сбора (via) при каждом ударе по клетке, НА ПОЧИНЕННОМ УСЛОВИИ СБОРА. ВНИМАНИЕ, отличий от базы ТРИ, и это осознанно: (а) дописка hints_via.txt, (б) починка условия сбора 19.09 (коммит 27852f3) - дошедшие считаются приростом над теми, кто стоял у клетки изначально, сбор закрывается по доле 2/3 посланных или при иссякшем притоке с половиной; (в) сбор, назначенный В САМОЙ ЦЕЛИ, больше не принимается молча (коммит cdd84b6) - мост говорит вслух и идёт обычным ударом без сбора: в первом заходе via_rally такой марш из 59 бойцов дал «дошли 0 из 39» за 120 с при mil_hurt 41, а три марша со сбором в стороне собрались все. Разделять их незачем: на мосту базы via заказан лишь в 5 волнах из 26, и починку не на чем разглядеть - дописка даёт объём маршей, починка делает их осмысленными. Эффекты разделимы при разборе: доля волн со сбором - это дописка, доля маршей, дошедших до удара, и доля кулака в миг удара - это починка. Откуда взялось: в assess_local единственный собравшийся марш привёл кулак ЦЕЛИКОМ (21 из 21, удар через 96 с) и потерял ноль, второй ударил ЧЕТВЕРТЬЮ (40 из 154, сбор засчитан ложно при wave_n=1), два истекли. МЕРЫ, названные ДО прогона (в скобках assess_local, 9 партий): (1) доля волн с клеткой сбора - было 5 из 26; (2) доля маршей, дошедших до фазы «удар» - было 2 из 5, истекли 2; (3) доля кулака в миг удара - было 100 и 26 процентов, ложных сборов быть не должно ВОВСЕ; (4) дошедших волн (mil_far>=180) 1 из 26, вех 2, потерь на волну 4,2; (5) контроль: волн на партию 2,9, цель 0 из 9. ПРИЗНАК ВРЕДА: доля волн со сбором выросла, а доля дошедших до удара упала - значит сбор съедает волны, и порог 2/3 слишком строг
