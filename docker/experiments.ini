что = РАЗДЕЛЬНОЕ УПРАВЛЕНИЕ пикинёрами и стрелками — от игрока 27.09 (§13ч спецификации). ОТКУДА: слова игрока «опытный игрок играет мушкетёрами и пикинёрами раздельно; мушкетёры перестреляют пику на подходе, но если пика доберётся, мушкетёры бесполезны», и код с ними согласен — radiusmin мушкетёра 300 пикселей это 5,6 клетки, ближе он не стреляет, а отходит (unit.script:7898). ЗАМЕР, который делает идею нужной: за 227 партий модель указывала вид бойцов полем who ДЕВЯТЬ раз и всегда пикинёров, стрелками отдельно не ходила ни разу, хотя мост умеет это с 20.09; у базы no_gather таких приказов ноль во всех трёх копиях. ЧТО ДЕЛАЕТ: подсказка hints_split_control.txt — два приказа ATTACK в такте, пикинёрам клетка боя, мушкетёрам клетка в 6-7 клетках позади на линии к нашей базе, и переставлять их, когда бой сместился. ЭТО ЕЩЁ И ЗАПИСЬ ДЛЯ СИМУЛЯТОРА: закон тыловой поддержки стрелков написан и ВЫКЛЮЧЕН, потому что случая «пика в контакте, стрелки в шести клетках позади» в архиве нет ни одного, а замкнутый цикл от закона стал хуже (его потери 83 против 79 при факте 56). МЕРЫ ДО ПРОГОНА, в скобках no_gather (bed4de0): (1) МЕХАНИЧЕСКАЯ — тактов с приказом по виду (0/0/0), ждём больше нуля в каждой копии, иначе идея НЕ ДОЕХАЛА; (2) тактов, где наши стрелки и пикинёры в РАЗНЫХ клетках, ждём больше нуля; (3) размен, его потери на нашу (1,06/0,67/0,55), ждём выше; (4) наши потери (173/232/174), ждём НИЖЕ — это и есть смысл идеи; (5) убито крестьян (117/95/5); (6) КОНТРОЛЬНАЯ — время первой волны (277/278/276 с), раздельные приказы не должны её задерживать. ЧЕГО НЕ ЖДАТЬ: подтверждения закона поддержки этой серией — она даёт ДАННЫЕ для него, а не проверку; закон включится после разбора записи. База no_gather
ОТ WINDOWS (27.09) = в подсказку дописана строка «для второго приказа нужны мушкетёры». Повод — food_share2 того же дня: стрелков там вышло 0 / 0 / 129 на три копии, а приказ who=musk17 при нуле мушкетёров не берёт никого (замер 19.09). Без этой строки механическая мера (1) могла провалиться не от идеи, а от состава. Это не вторая разница против базы, а условие исполнимости самой идеи: раздельно водить некого, если одного из двух видов нет.
