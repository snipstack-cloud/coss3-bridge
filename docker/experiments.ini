[no_gather_noshoot]
что = ТО ЖЕ БЕЗ СБОРА, НО БЕЗ СТРЕЛКОВ - разводит две причины, слипшиеся в no_gather. ОТКУДА: no_gather (25.09, три копии) дала убитых 117/95/5 при медиане 95 против 3 у base28 и 33 у base27, лучшего, что проект видел. Но изменилось ДВА: присутствие выросло (совместная клетка 41/57/14 процентов против максимума базы 25 и максимума base27 20) И армия обзавелась СТРЕЛКАМИ (44/54/19 против НУЛЯ во всех четырёх копиях базы; подсказка о составе не говорит ни слова, это выбор модели). Каждое объяснение по отдельности не сходится: base28/2 дала 25 процентов совместной клетки при нуле стрелков и убила 3; base27/1 имела 67 стрелков, больше любой копии идеи, при 14 процентах присутствия и убила 37, не сто. Сходится только «нужно и то и другое», и это ложится на измеренный факт проекта - крестьянин убегает, пикинёр его не догоняет: присутствие даёт ДОЙТИ, стрелки ПОПАСТЬ. Разбор - разборы/NO_GATHER_ПРОТИВ_BASE28.md. ЧТО ДЕЛАЕТ ЭТА ИДЕЯ: те же флаги no_gather плюс --ban musk17, то есть мушкетёры запрещены роли. МЕРЫ, НАЗВАННЫЕ ДО ПРОГОНА, И ТРИ ИСХОДА НАЗВАНЫ ЗАРАНЕЕ: (1) стрелков максимум - обязан быть НОЛЬ, иначе идея не доехала; (2) доля тактов с совместной клеткой (у no_gather 41/57/14, у base28 0/25/0/12) - обязана остаться высокой, иначе запрет стрелков сломал не то, что проверяем; (3) убито крестьян за вычетом голода: если СТОЛЬКО ЖЕ (около 95) - дело в ПРИСУТСТВИИ, стрелки попутны; если как у base28 (единицы) - дело в СТРЕЛКАХ, а сбор был не при чём; если посередине, тридцатки как у base27 - НУЖНО И ТО И ДРУГОЕ, гипотеза подтверждена; (4) потери - только в связке с (2). ЗАЧЕМ ЭТО ВАЖНО: без развода мы не знаем, какую строку класть в hints_human.txt, а она работает во всех прогонах. ПОПУТНО пересматривает приговор серии shooters (14.09, «перевернула состав и ухудшила цель»): её саму перепроверить НЕЛЬЗЯ - нет coss3_snap.jsonl, частый снимок завели 22.09, и её цель мерилась голодом врага, то есть неверно
