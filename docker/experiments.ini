[drain_cap]
что = ВТОРОЙ ВЫХОД ИЗ СБОРА, ключ --drain-cap 1. «Приток иссяк» считается ЗАСТОЕМ своей колонны (дошло не растёт два такта) и половиной КОЛОННЫ min(послано, живая армия), а не wave_n и не накопленным «послано». ОТКУДА: замер 25.09 по 91 такту сбора в base27/base28/tier1 - выход не сработал НИ РАЗУ, и закрыт был двумя способами сразу. «в_пути <= 2» это wave_n, ВСЕ свои вдали от базы, а не колонна: выполнилось 0 из 91. «дошло*2 >= послано» при накопительном послано 2916 требует 1458 дошедших при армии 100. Разбор - разборы/МАРШ_КОНТРАКТ.md. ПЕРВЫЙ выход, порог сбора, чинит УЖЕ существующий --gather-share, и этот ключ его не касается. МЕРЫ ДО ПРОГОНА: (1) походов, кончившихся УДАРОМ, а не истечением срока - сейчас у base27 0 из 55 тактов, у tier1 фаза «удар» есть в 9 тактах из 27, но через порог, а не через этот выход; (2) ГЛАВНАЯ ИГРОВАЯ - доля тактов с нашими бойцами в одной клетке с его крестьянами (разборы/ПОЧЕМУ_НЕ_БЬЁМ.md, поправка вечером 25.09): у бьющей base27 13 процентов, у tier1 4; (3) убито крестьян врага за вычетом голода. ЧЕСТНОЕ ОЖИДАНИЕ, И ОНО ПЛОХОЕ: по замеру ключ сработал бы 4 такта из 53 у base27 и НОЛЬ у base28 и tier1. Держит не арифметика, а физика - до клетки сбора доходит 29 процентов колонны у tier1 и 8 у base28 (у мака по сетке arow медиана 41, максимум 70), а оба выхода требуют половины и двух третей. ПОЭТОМУ СЕРИЮ НА ЭТОМ КЛЮЧЕ ГОНЯТЬ НЕ СТОИТ, пока не решён ПРИХОД к клетке сбора; секция заведена, чтобы ключ и его замер не потерялись. Если всё же гнать - база tier1 на том же мосту, и ждать разницы почти не в чем
