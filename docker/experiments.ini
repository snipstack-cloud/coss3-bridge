[base12]
что = точка отсчёта на мосту от вечера 16.09, проверенном на живой игре на Windows целиком. От base11 отличий полтора десятка, поэтому сравнивать с ним нельзя. Мост: предел команд за такт 6 стало 7; дотекание - модель больше не шлёт подкрепления в пустоту молча; готовность к удару со слагаемыми (своя сила с ценой, сила врага, пушки свои и вражеские, риск фланга по мини-карте); отсутствие поля больше не выдаётся за измеренный ноль; офицер и барабанщик убраны из таблицы найма, потому что делаются только в академии, а она запрещена ПРАВИЛОМ ХАКАТОНА; команда FORMATION отключена по той же причине; слагаемые готовности доехали до трассы. Контрольные числа: block_hstate 955, block_hcmd 954, progress.inc 2256 - установлено и проверено 16.09 вечером, пульс есть, поля отдают верные числа. МЕРА, названа ДО прогона, в скобках base11 на 15 партиях: 1) цель (3 из 15); 2) время готовности ратуши (27 с) - не должно ухудшиться; 3) первая волна (556 с); 4) армия максимум (42) против армии врага (192, медиана по 15 партиям); 5) партий с застрявшей стройкой (0 из 15); 6) ДОЛЯ ТАКТОВ С ЗАКАЗОМ БОЙЦОВ ПРИ ГОТОВОЙ КАЗАРМЕ - в base11 это 181 такт из 454, то есть две трети времени казарма простаивала, и критик назвал это узким местом в 12 разборах из 15. Это главное новое число прогона
