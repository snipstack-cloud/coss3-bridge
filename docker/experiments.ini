итог = ОТЫГРАНА 17.09 на Windows, 60 эпизодов: 47 НАСТОЯЩИХ и 13 призраков по одному такту с исходом lose - у провайдера кончились деньги (Error code 402), игра не перезапускалась, и мост писал поражение сразу. Отсюда же починка «пустая партия не считается» (34e363f). Порченых партий НЕТ: деньги кончались между партиями, и в каждой зачтённой модель говорила больше чем в половине тактов. МЕХАНИЗМ ПОЧИНЕН ПОЛНОСТЬЮ, в скобках base12 на 15 партиях: тактов с перебором BALANCE 0,6 процента (54,8) - главное число серии; три команды разом 40 (73); скачок on_food между соседними тактами 0 (3); тактов с едой ниже 500 - 15,2 процента (37,9); заказ бойцов при готовой казарме 77 (52); армия на 10:00 - 62 (48); первая волна 414 с (515). Найм втрое больше: 601 заказ пехоты против 186. Партий со второй казармой 4 из 47 против 0 из 15: увидев цену 2500 золота, модель не испугалась, а стала строить чаще там, где может себе позволить. НО ЦЕЛЬ НЕ СДВИНУЛАСЬ: 16 из 47 (34 процента) против 5 из 15 (33), Фишер p = 1,0. Против food_share (0 из 15) разница есть, p = 0,0068, но food_share - сломанное плечо, и мерить им нечего. Разброс копий огромен: копия 5 взяла 6 из 15, копия 4 - ноль из восьми. ВЫВОД: канал команд был сломан и починен, экономика и армия выросли, волна уходит на полторы минуты раньше - и доля взятых целей не изменилась ни на процент. Пятый случай подряд, когда улучшение ДО удара не доходит до самого удара. Следующий вопрос не про экономику: почему волна из шестидесяти не убивает крестьянина при враге в сто девяносто. ПОПРАВКА к прежней записи этой строки, сделанной с мака по неполным данным: живых партий не 17, а 47 - дневные копии 1-3 лежат в каталоге за 16.09, и цель в них 6 из 15

[one_barracks]
что = не строить вторую казарму, пока первая простаивает. Гипотезу подсказал критик 16.09 («узкое место золото»), но причину он назвал неверно - шахту. Разбор его же партии: золото 5000 -> 1458, из них первая казарма 500 на 141-й секунде и ВТОРАЯ 2500 на 189-й, а весь найм крестьян за партию - около 99. Цена из данных игры: costpercent = 500 (unit.script:2472), каждая следующая казарма впятеро дороже. При этом по base11 и base12 казарма простаивает две трети тактов из-за еды, то есть вторая не добавляет бойцов, а золото вынимает. ОТЛИЧИЕ ОТ base12 РОВНО ОДНО - дописка hints_one_barracks.txt. НЕ ПУТАТЬ с gold_first2 (отыграна 15.09, опровергнута): та двигала ДОБЫЧУ золота раньше, эта трогает РАСХОД. МЕРА, названа ДО прогона, в скобках base12 на 15 партиях: 1) партий со второй казармой - главное число, должно упасть; 2) минимум золота за партию; 3) доля тактов с заказом бойцов при готовой казарме; 4) армия максимум (43); 5) цель (5 из 15). Гипотеза: вторая казарма не влияет на армию вовсе, а сэкономленные 2500 золота видны в апгрейдах и найме
