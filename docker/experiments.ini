[scout]
что = СТУПЕНЬ 0 ПРОВЕРКИ БЫСТРОГО СТАРТА - РАЗВЕДКА ОКНА, без модели и без атаки. Скриптовый дебют до одного бойца (с одним бойцом еда живёт до десятой минуты без мельницы), дальше только смотреть врага раз в 10 с до горизонта 600: его армия, крестьяне, кто идёт, клетки его крестьян без бойцов рядом и сколько секунд туда идти нашей пехоте (2 ед./с). Живая партия 19.09 дала одно наблюдение: крестьяне в (12,3) без бойцов с 1:06 до 3:36, стражи с 3:59. Здесь тот же сид 12345, три партии - если окно повторяется, оно известно точно, и ступень 1 (волна N на секунде T) знает, до какой секунды надо прийти. Итог в /io/scout.md
