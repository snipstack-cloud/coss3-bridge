флаги = --hints-extra hints_free_peasants.txt --no-gather 1 --memo --world /io/world.md --critic /io/разбор.md --episodes 1
копий = 3
база = no_gather

[strike_base]
что = ЗАПИСЬ, А НЕ ЗАМЕР — просьба мака 27.09: одна партия на новом мосту, где после 10:00 вся армия с апгрейдами атаки бьёт по ЕГО базе, чтобы в клетках стояли ТОЧНЫЕ числа. ОТКУДА: у его базы симулятор теряет и убивает в полтора раза больше записи при верном размене, и массовый удар по базе в симуляторе ВЫИГРЫВАЕТ, а в игре нет (§13з, 13к). Три попытки закрыть перекос 27.09 не сошлись — множитель атакующему, потолок фронта, снятие порога урона, — и не сошлись потому, что по архиву чисел НЕ ВИДНО: в таком бою клетки с обеих сторон упирались в прежний потолок 36, и «194 против 36» читалось как «+ против +». До закрытия дыры у мака стоят предохранители: train.ПОТОЛОК_СТУПЕНИ = 7 и выключатель combat.ФРОНТ_У_ЕГО_БАЗЫ. ЧТО ИДЕЯ ДЕЛАЕТ: подсказка hints_strike_base.txt — казарма первой, апгрейды атаки пикинёра 1.1-1.2, до 600 с не выходить (дома бить, если он пришёл сам), с 600 с ATTACK target=base всей армией и держать её там без RETREAT, досылая новых. ЧТО ДОЛЖНО БЫТЬ В ЗАПИСИ (признак удачи, мерить нечего): такты, где наши бойцы стоят в клетке с его бойцами У ЕГО БАЗЫ, и в снимке при них поле cells с точными числами. МЕХАНИЧЕСКАЯ ПРОВЕРКА: в coss3_snap.jsonl должны быть строки с непустым cells после 600-й секунды; cells_n упирается в 12 по построению блока (hmcn < 12), и это не «клеток всего», а «клеток записано». ЧЕГО НЕ ЖДАТЬ: убийств крестьян и цели — у его базы их не бывает, размен там худший в архиве (0,41 против 0,63 дома); эта партия не про удар по цели, а про числа. СРАВНИВАТЬ НЕ С ЧЕМ И НЕ НАДО: события пойдут облаком, потому что локальная модель на маке 27.09 не отвечала, и это законно ровно потому, что тут ничего не мерится
