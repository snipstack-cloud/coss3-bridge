[food_share]
что = доля крестьян на еде. 16.09 разбирались, почему казарма молчит больше половины тактов, и нашли: 193 такта из 273 без заказа бойцов - это еда ниже 500. Лазейку проверили замером в контейнере и закрыли: порог держит ЛЮБОЙ заказ, а не только бесконечный (doprogressorders.inc:199 гасит весь блок производства, имя bEnoughResInfinite врёт). Это уже в world.md и видно ОБОИМ плечам. Идея добавляет связь, которой в world.md нет: по 30 партиям base11 и base12, поделённым пополам по числу крестьян на еде, где на еде работала треть деревни - она сидела под порогом 30 процентов времени и вырастала до 62 бойцов; где шестеро из двадцати шести - 72 процента времени под порогом и армия 26. Крайние партии без исключений: 16 из 32 дают 17 процентов под порогом и армию 76, а 4 из 22 - 87 процентов и армию 13. ПРИЧИННОСТЬ НЕ ДОКАЗАНА, и прогон проверяет именно её: может быть, и еда, и армия - два следствия того, что деревня вообще выросла. Строка не называет числа людей и не говорит, когда переставлять - решает модель, как в подтверждённой iron_first. МЕРА, названа ДО прогона, в скобках base12 на 15 партиях: 1) доля тактов с едой ниже 500 (48 процентов) - главное число; 2) крестьян на еде, медиана (9 из 29); 3) армия максимум (59); 4) доля тактов с заказом бойцов при готовой казарме (43 процента); 5) ВРЕМЯ ПЕРВОЙ ВОЛНЫ (515 с) - контрольная мера, поедет вправо значит еду купили темпом и идея проиграла; 6) цель (5 из 15)
