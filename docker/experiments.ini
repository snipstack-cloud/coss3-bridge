# Идеи для проверки на сервере. Одна секция — одна идея.
#
# Смысл фермы: мастер-мост живёт и правится на Windows, а сюда приезжает через
# git уже проверенная там версия. Идея = ветка/коммит моста плюс набор флагов.
# Десять копий дают десять партий одновременно, и мастер при этом не простаивает.
#
# Поля:
#   что     — человеческое описание, попадёт в отчёт
#   ref     — ветка, тег или SHA моста в git. master = то, что уже на мастере
#   флаги   — что дописать к llm_policy.py
#   копий   — сколько контейнеров поднять (можно перебить ключом --copies)
#   база    — id идеи, с которой сравнивать в отчёте (обычно baseline)

[baseline]
что = как на мастере сейчас: порог волны 20, такт 20 с
ref = master
флаги =
копий = 10

[wave40]
что = порог волны 40 вместо 20 — бить реже, но вдвое большей силой
ref = master
флаги = --wave-min 40
копий = 10
база = baseline

[wave0]
что = порога нет вовсе — проверить, что он вообще что-то даёт
ref = master
флаги = --wave-min 0
копий = 10
база = baseline

[tick10]
что = решение раз в 10 игровых секунд вместо 20 — вдвое больше ходов
ref = master
флаги = --every 10
копий = 10
база = baseline

# Пример идеи, которая живёт в ВЕТКЕ моста, а не во флаге: код правится на
# Windows, ветка пушится, здесь указывается её имя. Пересборка образа не нужна.
# [formations]
# что = построения через _player_SetSquadFormation
# ref = idea/formations
# флаги =
# копий = 10
# база = baseline


[builders_max]
что = пока ратуши нет — всех, кто влезет, на её стройку (идея игрока 13.09: партия начинается с centers=0, а бот ставил ратушу тремя строителями из восемнадцати при котловане на двенадцать)
ref = master
флаги = --builders-first 99
копий = 3
база = baseline

[builders_hint]
что = то же, что builders_max, но БЕЗ подмены команды: модели сказано, что в котлован ратуши влезает до двенадцати строителей, решает она сама
ref = master
флаги = --hints-extra hints_builders.txt
копий = 3
база = baseline

[history15]
что = окно истории 15 прошлых ходов вместо 5: переписки с моделью нет, память ей собирает мост, и пять тактов стояли с начала проекта никем не проверенные
ref = master
флаги = --history 15
копий = 3
база = baseline

[history0]
что = истории нет вовсе: проверить, даёт ли она хоть что-нибудь. Если разницы с базой нет, пять строк в каждом запросе тратятся впустую
ref = master
флаги = --history 0
копий = 3
база = baseline

[historyall]
что = вся история партии в контексте: все такты, а не последние пять. Замер 13.09: добавляет ~1900 токенов к запросу (обстановка 630 -> 2570)
ref = master
флаги = --history 999
копий = 3
база = baseline

[barracks2]
что = сказать модели, что казарма делает юнитов по одному и нужна вторая. За восемь прогонов она дошла до этого сама один раз, а в прогоне на Windows потратила на поиск причины десять тактов из сорока пяти
ref = master
флаги = --hints-extra hints_barracks.txt
копий = 3
база = baseline

[questions]
что = канал вопросов: модель может задать человеку ОДИН вопрос за партию, ответы копятся в world.md и уходят в промпт всем следующим партиям. Первая серия меряется не временем волны, а тем, О ЧЁМ она спрашивает: до сих пор описание мира на человеческом слоте не содержало ни карты, ни залежей, и сказать об этом модели было нечем
ref = master
флаги = --world /io/world.md
копий = 3
база = baseline

[questions5]
что = канал вопросов на коротких партиях: обрыв на 5:00 и сразу новая. За то же время партий втрое больше, а вопрос модель задаёт по одному на партию. Цель не меняется, модели про отрезок сказано прямо. Мера — не время волны, а список вопросов
ref = master
флаги = --world /io/world.md --stop-at 300 --episodes 4
копий = 3
база = baseline

[questions10]
что = канал вопросов на отрезке 10:00 вместо 5:00. Пять минут кончались до первой волны (она уходит 5:49-7:58), и спрашивать про бой было неоткуда; на десяти волна есть всегда, а цель берётся впритык — 5 из 8 прогонов брали её в 9:13-10:59. Знания о мире (порог еды 500, залежи) уже в world.md
ref = master
флаги = --world /io/world.md --stop-at 600 --episodes 3
копий = 3
база = baseline

[memo]
что = дневник партии вместо протокола ходов: вехи построек со временем, неудачи без повторов, исходы волн («ушло 22, наших 22 -> 9, крестьян врага 31 -> 31 — НИ ОДНОГО НЕ УБИЛИ»). Человек помнит структуру, а не сорок пять своих кликов; полная история ходов замером 13.09 оказалась вредна (первая волна 10:01 против 5:49-7:58)
ref = master
флаги = --memo
копий = 3
база = baseline

[fair]
что = честная игра: мост перестаёт подсказывать то, чего человек не видит — точное число крестьян и зданий противника каждый такт и расстояние до него он знает сквозь туман войны, а человек не знает никогда. В трассе и в проверке цели числа остаются, из запроса уходят. Правило игрока 13.09: не давать модели больше, чем есть у человека
ref = master
флаги = --fair
копий = 3
база = baseline

[base_open]
что = новая точка отсчёта: открытая карта (монгольфьер всем), полные 15 минут, без канала вопросов и без дневника. Все прежние прогоны шли с ТУМАНОМ и для сравнения с открытой картой негодны — это другая игра
ref = master
флаги =
копий = 3
база =

[questions12]
что = канал вопросов на отрезке 12:00. Десять минут обрезали цель: первая волна приходит в среднем на 7:22, а до убитого крестьянина от неё ещё около трёх минут — 9 партий из 9 кончились ничем. Двенадцать покрывают цель (у базы она бралась в 9:13-10:59)
ref = master
флаги = --world /io/world.md --stop-at 720 --episodes 3
копий = 3
база = base_open

[tempo]
что = сказать модели, что волна без убитых — потерянные бойцы, и перед новой смотреть итог прошлой. Замер 13.09 на шести копиях: цель взяла та, что послала 41 бойца двумя волнами, а пятеро слили по 200 бойцов шестью-семью и не убили никого. Подсказкой, не подменой команды — решает модель
ref = master
флаги = --hints-extra hints_tempo.txt
копий = 3
база = base_open

[legal_critic]
что = две правки разом: мост говорит, что по карману прямо сейчас (can_now/cant_now из _unit_CanApplyCostByID — раньше модель выясняла это ценой такта), и после партии один вызов критика на дневник — причина исхода, узкое место, одна гипотеза. Сравнивать с base_open3
ref = master
флаги = --memo --critic /io/разбор.md
копий = 3
база = base_open3

[legal_critic_q]
что = всё сегодняшнее разом на полных партиях: can_now/cant_now (что по карману прямо сейчас), дневник партии, разбор критиком после каждого эпизода и канал вопросов. Пять партий по 15 минут на копию — до цели и до боя, а не до экономики. Сравнивать с base_open3
ref = verified
флаги = --memo --world /io/world.md --critic /io/разбор.md --episodes 5
копий = 3
база = base_open3

[iron_first]
что = сказать модели, что шахта железа нужна сразу после кузницы. Замер 14.09 на 15 партиях: армия к концу 0 — семь партий с вырезанной базой (крестьян 2-17), армия больше нуля — восемь партий с целыми крестьянами, без единого исключения. Еда ни при чём: в погибших её оставалось 4597-11311. Подсказкой, решает модель
ref = verified
флаги = --memo --world /io/world.md --critic /io/разбор.md --hints-extra hints_iron.txt --episodes 5
копий = 3
база = legal_critic_q

[base4]
что = четвёртая база, первая без известных дыр: открытая карта, без пушек и захвата, залежи и лес-камень в состоянии, цены при отказе, SEED, предупреждение про ратушу, ранняя шахта железа в постоянных подсказках, критик с устойчивым разбором. Всё, что сравнивается дальше, сравнивается с ней
ref = verified
флаги = --memo --world /io/world.md --critic /io/разбор.md --episodes 3
копий = 3
база =

[attack_check]
что = разобрать, куда уходят волны. 14.09 на девяти партиях: 35 волн, 1139 бойцов отправлено, НОЛЬ убитых крестьян врага, и наши при этом не гибнут (пехота 17->22, 44->48, 78->78). Одна партия на копию, зато с логом моста в результатах: видно, отдан ли приказ ATTACK, на какие координаты и что ответил движок
ref = verified
флаги = --memo --world /io/world.md --critic /io/разбор.md --episodes 1
копий = 3
база = base4

[fighters]
что = сказать модели ЗНАНИЕМ, кого она может нанять в бой: пикинёр 90 жизней и 20 железа, только ближний бой; мушкетёр 65 жизней и 4 железа, бьёт на 400-800 и жжёт боеприпас. Числа из lib/unit.script, человек видит их в казарме. Замер 14.09: за 12 партий армия состояла из одних пикинёров (infantry17 заказан 144 раза, musk17 ни разу), и волны не убили ни одного крестьянина. Проверяется на verified: поля состояния не нужно, правки .inc нет
ref = verified
флаги = --memo --world /io/world.md --critic /io/разбор.md --episodes 3 --hints-extra /opt/bridge/hints_fighters.txt
копий = 3
база = base4

[shooters]
что = проверить механику убегания. Крестьянин отбегает (у него нет bstandground, gc_unit_runawaydist 3.5, unit.script:7367), пикинёр бьёт только вплотную и догнать не может - отсюда 1139 бойцов за 18 партий и ноль убитых. Мушкетёр бьёт на 400-800 против 35-100 у пикинёра. Подсказка говорит про отход и оставляет выбор модели; ставится поверх fighters, то есть отличается от базы ровно одной строкой
ref = verified
флаги = --memo --world /io/world.md --critic /io/разбор.md --episodes 3 --hints-extra /opt/bridge/hints_fighters.txt --hints-extra /opt/bridge/hints_shooters.txt
копий = 3
база = fighters

[gold_coal]
что = чем оплачивается стрелковая армия. Серия shooters перевернула состав (140 заказов musk17 против 7 пикинёров), но цель стала браться реже: 2 из 9 против 5 из 9, в двух партиях армии не собралось вовсе. Модель назвала причину сама - золото в ноль, угольной шахты нет, одна казарма делает по одному. Подсказка даёт цену и боеприпас (8 золота за штуку, 1 железа и 3 угля за выстрел, unit.script:800-803) и оставляет выбор модели
ref = verified
флаги = --memo --world /io/world.md --critic /io/разбор.md --episodes 3 --hints-extra /opt/bridge/hints_fighters.txt --hints-extra /opt/bridge/hints_shooters.txt --hints-extra /opt/bridge/hints_gold_coal.txt
копий = 3
база = shooters

[gold_first]
что = золото - настоящее узкое место, и не ради мушкетёров по 8, а ради казармы за 500 (unit.script:2472; costpercent 500, то есть вторая казарма 2500). Замер 14.09: минимум золота за партию 0-355, в трёх партиях из девяти казармы не было к 15:00. Подсказка по образцу подтверждённой iron_first, уголь из подсказок убран - он не падал ниже 517 за 18 партий
ref = verified
флаги = --memo --world /io/world.md --critic /io/разбор.md --episodes 3 --hints-extra /opt/bridge/hints_fighters.txt --hints-extra /opt/bridge/hints_gold_first.txt
копий = 3
база = base4

[maneuver]
что = у бота появилась команда MOVE - движение без боя (тот же файл приказа, режим move, без поиска врага). Подсказка говорит, что не всех обязательно вести в бой, и честно называет предел: MOVE берёт только свободных, идущего в волне не вернуть. Мера - станет ли модель пользоваться MOVE и доживает ли армия до второй волны
ref = verified
флаги = --memo --world /io/world.md --critic /io/разбор.md --episodes 3 --hints-extra /opt/bridge/hints_fighters.txt --hints-extra /opt/bridge/hints_maneuver.txt
копий = 3
база = fighters

[march]
что = волна не доходит до крестьян - её встречают на подходе. Замер 15.09 (wave_check/1): база врага в 187, волна из 20 пикинёров шла без потерь до mil_far 148, там mil_hurt 18 из 20 и армия 39 -> 23; вторая волна не выше 99, третья и четвёртая не выше 57. Механизм из кода: ATTACK включает _unit_ListSetSearchEnemy и режим атаки (block_hcmd.inc:730), MOVE ставит режим движения и поиск не включает (:719). Подсказка называет наблюдение и разницу двух приказов, порядок и число бойцов оставляет модели. Мера: поднимется ли mil_far выше 170 хоть в одной партии, падение p1_peasants от бегущего максимума, и отдаст ли модель MOVE вообще (в maneuver - ни разу). ВНИМАНИЕ при разборе: на MOVE wave_sent не растёт, поход смотреть по mil_away/mil_far/mil_hurt. ИТОГ 15.09: идея НЕ ПРОВЕРЕНА - за 6 партий (копии 1 и 3, копия 2 не доехала) модель не отдала MOVE ни разу, как и в maneuver. Побочно: mil_far доходит до ближайшего чужого здания в 4 партиях из 6, то есть перехват на 148 из wave_check был свойством одной партии. Сравнение с base4 негодно: world.md вырос с 66 строк 14.09 до 130 строк 15.09, отличий от базы два, а не одно
ref = verified
флаги = --memo --world /io/world.md --critic /io/разбор.md --episodes 3 --hints-extra /opt/bridge/hints_march.txt
копий = 3
база = base4

[base5]
что = честная база на нынешнем мосту и нынешнем world.md. Сравнивать новые идеи с base4 НЕЛЬЗЯ: между 14 и 15.09 файл знаний вырос с 66 строк до 130 (убегающий крестьянин, золото на казарму, пять мест в шахте), а мост починен трижды - wave_sent, судьба волны, раздельный учёт шахт. Флаг --world тот же, файл другой, то есть отличий два, а не одно. Эта секция и есть новая точка отсчёта
ref = verified
флаги = --memo --world /io/world.md --critic /io/разбор.md --episodes 3
копий = 3
база =

[mines2]
что = добыча упирается в ЧИСЛО ШАХТ, а не в людей. Замер на живой игре 15.09: в шахту влезает ровно пять крестьян (cap_gold = cap_iron = 5) и её же строители занимают все места сами, при 13 свободных в деревне. До 15.09 мост наполнял только ПЕРВУЮ шахту вида, то есть вторая не давала ничего - это и держало золото на казарму за 500. Подсказка в одну строку говорит про пять мест и самонабивку, число шахт и порядок оставляет модели. Мера: сколько шахт золота и железа к концу (в march и wave_check было 1-2), минимум золота за партию (в wave_check 368), доля партий с казармой к 10:00, и цель. ИТОГ 15.09 (6 партий против 6): идея СРАБОТАЛА и ПРОИГРАЛА. Шахт 4,3 против 2,0, максимум золота 2530 против 1290 - но цель 1 из 6 против 4 из 6. Причина числами: в шахтах сидят 13 человек против 6, крестьян к концу 28 против 46, армия 18 против 40, первая волна на 532 с против 395 с. Крестьянин в шахте вычеркнут из деревни, и купленное золото оплачено временем первой волны. В hints_human.txt НЕ переносить
ref = verified
флаги = --memo --world /io/world.md --critic /io/разбор.md --episodes 3 --hints-extra /opt/bridge/hints_mines2.txt
копий = 3
база = base5

[base6]
что = точка отсчёта на мосту от вечера 15.09. От base5 отличается тем, что за день мост изменился четырежды и каждая правка меняет то, что ВИДИТ модель: починен wave_sent, добавлена судьба волны, шахты разделены по видам с числом мест, у стройки появились строители и процент готовности. Плюс world.md подрос замерами: пять мест в шахте и самонабивка строителями, цена строителя (восьмеро ускоряют в 5,4 раза, а не в 8; три котлована по одному человеку идут так же быстро, как один). Сравнивать новые идеи с base5 нельзя по той же причине, по которой 15.09 сгорела серия march - отличий было бы два вместо одного. Мера: цель, время первой волны, шахт за партию, минимум золота
ref = verified
флаги = --memo --world /io/world.md --critic /io/разбор.md --episodes 3
копий = 3
база =

[upgrades]
что = за весь день 15.09 бот не отдал ни одной команды UPGRADE, хотя у каждого боевого юнита есть апгрейды атаки и защиты (country.script:876-1010, вид 1 атака, вид 2 защита, пять уровней, требуют кузницы). Цены Нидерландов для пикинёра: атака 900 еды + 150 золота, защита 250 + 150 - то есть первая защита стоит как десять бойцов и достаётся всей армии сразу. Механика и цены лежат в world.md, их видят ОБА плеча; идея добавляет ровно одну строку - сравни апгрейд с лишними бойцами. Мера: отдаст ли UPGRADE хоть раз (в base6 ноль за три партии), доля партий с апгрейдом, доходит ли волна (mil_far против en_near_dist), и цель
ref = verified
