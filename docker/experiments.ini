что = НАКОПЛЕНИЕ ПРЕДЛАГАЕТСЯ ЧИСЛОМ. Строка в такте: "ЕСЛИ КОПИТЬ ЗАРАНЕЕ: клетка сбора (7,13) на полпути к (2,13) сократит твой подход с 80 с до ~40 с" - с готовым приказом STAGE и названной платой (возврат те же 40 с; у базы размен 0,67 против 0,19 в поле). Повод: в base21 STAGE не отдан НИ РАЗУ за 4 партии, и счёт по 51 такту показал, почему - модель действует по числу с целью, а не по наличию команды (MOVE упомянут в 75 процентах тактов и отдан 0 раз; UPGRADE по имени в 2 процентах и отдан 56 раз, потому что рядом цена и выигрыш). Строка выпадает в 36 тактах из 51 на состояниях base21. ВНИМАНИЕ, ОТЛИЧИЙ ОТ base21 ДВА, И ЭТО ОСОЗНАННЫЙ КОМПРОМИСС (решение игрока 20.09, ради вдвое меньшей цены): (а) сама строка в llm_policy; (б) три новые записи в world.md, который уходит модели через /io/world.md (entrypoint.sh:182) - и среди них буквально "STAGE не отдан ни разу" и правило "модель действует по числу". Если STAGE пойдёт в дело, РАЗДЕЛИТЬ вклад строки и вклад знания будет НЕЧЕМ; честный вывод тогда - "одно из двух подействовало", а не "строка работает". Чистое сравнение потребовало бы ключа --stage-hint и пары плеч на одном мосту, это 8 партий вместо 4. МЕРЫ, названные ДО прогона (в скобках base21, 4 партии): (1) ГЛАВНАЯ - сколько раз отдан STAGE за партию, было 0 из 4 партий; (2) если отдан: где стоит клетка сбора, сколько бойцов там копится, сократился ли наш_eta до клеток врага; (3) доля кулака в миг удара и доля волн, дошедших до цели; (4) волн на партию (4,75) и потери на волну; (5) просадка армии врага (44/112/31/81, сумма 268) и вехи с целью (0 из 4); (6) контроль: армия к пику (294/267/200/223), конюшня построена (4 из 4), конницы (52), апгрейдов (56). ПРИЗНАК ВРЕДА: армия уходит из дома и крестьян бьют - наши крестьяне к концу ниже 39..104, потери при обороне растут, просадка армии врага падает ниже 268
