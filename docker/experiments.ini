[soldiers20]
что = ДВАДЦАТЬ БОЙЦОВ БЕЗ МОДЕЛИ, вторая узкая задача игрока 20.09 (первая - первый боец - решена: все на каждую стройку, 50 с). Тут уже экономика: 20 пикинёров стоят 500 еды, 60 золота и 400 железа, а после честной цепочки железа 360, дерева РОВНО 0, найм ниже 500 еды встаёт. Крутится (opening.py, --opening-goal 20): когда заложить железную шахту (полная даёт ~500 в минуту; 0 никогда, 1 при готовой ратуше в параллель с кузницей - в её котлован влезает 14, четверо свободны, 2 после кузницы, 3 после казармы), потолок строителей на ней, сколько людей на дерево после ратуши, кусок заказа в казарму (20 разом, по пять, бесконечно). Потолки на цепочке - все (решено первой задачей). МЕРА ОДНА - игровая секунда, когда бойцов стало 20; рядом 1-й и 10-й, вехи зданий, снимки ресурсов раз в 10 с, очередь казармы и отказы. Один сид 12345, первое сочетание дважды. Горизонт 420 с - вариант без шахты обязан встать на железе, и это видно по снимкам
