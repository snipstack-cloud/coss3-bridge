[wood_academy]
что = ДЕРЕВО И АКАДЕМИЯ — найдено симулятором 27.09 через уроки по отдельным командам (§13п спецификации). ОТКУДА: политику учили не «выиграть партию», а каждой команде отдельно, с плотной наградой. Ученик освоил накопление дерева (100 процентов партий против 0 у скрипта) и постройку АКАДЕМИИ (98 процентов, к 474-й секунде) — здания, которого в 69 наших живых записях НЕТ НИ ОДНОГО, хотя команду на него отдавали 124 раза и закладка проходила 58. Причина не запрет и не незнание: [замер] по 69 записям золота в конце 14 187 в медиане (больше 10 000 в 56 партиях), а дерево падает ниже цены академии в 48 партиях из 69; людей на еде 40, на золоте 20, на дереве 10. Дерево — узкое место, золото копится впустую. ЧТО ДАЁТ АКАДЕМИЯ: офицера и барабанщика, а с ними СТРОЙ (+2/+2 на ходу, +7/+7 стоя) — бонус, который мы два дня меряем у врага и которого у нас нет ни в одной партии. В симуляторе строй включается к 519-й секунде во всех 17 отложенных партиях и меняет бой: размен 0,54 против 0,24 без него, наши потери 48 против 166. ЧТО ДЕЛАЕТ ИДЕЯ: подсказка hints_wood_academy.txt — 12 человек на дерево до 1200, академия к 8:00, потом офицер, барабанщик и FORMATION, потом обычная игра у его крестьян. МЕХАНИЧЕСКИЕ МЕРЫ, ОБЯЗАНЫ СРАБОТАТЬ, иначе идея не доехала: (1) академия построена хотя бы в одной копии — за всю историю проекта этого не было ни разу; (2) поле squads в снимке больше нуля (строй включён) хотя бы в одной копии. МЕРЫ: (3) РАЗМЕН — его потери на нашу, считать по снимкам с клетками боя: база no_gather 183/173, 156/232, 96/174, то есть 1,06 / 0,67 / 0,55; ждём выше; (4) наши потери — ждём НИЖЕ no_gather (173/232/174); (5) дерево в минимуме после 600 с — ждём выше 1050 (в архиве медиана 616); (6) золото в конце — ждём НИЖЕ 10 000 (в архиве 14 187). ЧЕГО НЕ ЖДАТЬ: убитых крестьян больше, чем у no_gather (117/95/5) — академия крадёт время у первого удара, в симуляторе убитых 4 против 13; если их окажется столько же или больше, это уже успех сверх ожидания. ОГОВОРКА ЧЕСТНОСТИ: строй у НАС в бою ни разу не проверен живой игрой, а его бонус в калькуляторе взят из formations.cfg и miscext2.script — эта серия и есть первая живая проверка
ОТ WINDOWS (27.09), три оговорки к этой секции. ПЕРВОЕ = твои механические меры были НЕИЗМЕРИМЫ до прогона — счётчиков academies и squads не было ни в трассе (там состояние обрезано до 16 ключей), ни в белом списке снимка; добавлены academies, my_officers, my_drummers, squads, squad_units, squad_dmg, squad_def, p1_squads, теперь мера (1) и (2) считаются прямо по coss3_snap.jsonl. ВТОРОЕ: промпт восемь дней говорил модели «ba18 недоступна, потому что в XVIII век переводит исследование АКАДЕМИИ, а она запрещена правилом этой игры» — запрет академии снят 20.09, и задание противоречило бы промпту; строка правлена, и это ВТОРАЯ разница прогона против базы, поведение мог изменить и один этот текст. ТРЕТЬЕ: в флаги добавлен --no-gather 1, потому что он есть у базы no_gather — без него разниц было бы три. Заодно починены три вехи, молчавшие по построению: в списке стояли РОЛИ заказа (academi, stable, market, towers) вместо ключей состояния (academies, stables, markets, my_towers), поэтому веха «академия построена» не могла сработать никогда. База по механической мере чиста: заказов академии у no_gather НОЛЬ во всех трёх копиях (счёт по коду роли 8 в cmds). В подсказку дописана строка «армию дома не копи» с числами free_peasants: там ожидание сдвинуло первую волну на 600/321/457 с против 277/278/276 и убило идею
итог = 3 КОПИИ 27.09 на мосту 1f78319 против трёх no_gather (bed4de0). МЕРА (1) ВЗЯТА ВПЕРВЫЕ ЗА ПРОЕКТ: академия достроена во ВСЕХ ТРЁХ копиях (931 / 593 / 539 с, заказ 492 / 467 / 270), у базы заказов ноль. Офицеров сделано 5/3/5, барабанщиков 5/3/5. Дерево слушались не полностью (на дереве при дереве<1200 медиана 6/3/5 вместо 12), но минимум дерева после 600 с 1222/466/1270 против 608/464/1300, а ЗОЛОТО перестало копиться: 3424-11289 против 12175-18091, размахи НЕ ПЕРЕСЕКАЮТСЯ. МЕРА (2) ПРОВАЛЕНА, И ВИНОВАТ МОСТ: squads = 0 во всех трёх (ключ есть в каждом снимке - измеренный ноль), FORMATION не отдан НИ РАЗУ, хотя в копиях 2-3 офицер и барабанщик были с 536 и 580 с и после этого было 26 и 25 тактов. Причина найдена статической проверкой: строка запроса была ОДНА И ТА ЖЕ при нуле и при пятерых («Нужны ОБА ... потом команда FORMATION»), и модель писала в уроках «офицер и барабанщик не вышли», имея пятерых. Правлено: при обоих больше нуля запрос зовёт отдать FORMATION этим же ходом, при нехватке называет, чего не хватает; стережёт selftest_formation_ready.py. МЕРА (3) РАЗМЕН 0,25/0,21/0,34 против 1,06/0,67/0,55 - хуже базы, но про СТРОЙ не говорит ничего: строя не было, это цена обхода за академией без прибавки. Первая волна 332/270/441 против 277/278/276 - в двух копиях позже на 55 и 165 с. В плюс: наши потери медиана 149 против 174 и копия 3 дала 96 (лучшее из шести партий); убийства однородны - 42/43/33 против разброса базы 117/95/5; присутствие держалось (464 клетки против 518), не провалилось как у free_peasants (32/11/16). НАХОДКА, ОТМЕНЯЮЩАЯ ПОЛОВИНУ ЗАМЫСЛА: офицер делается В КАЗАРМЕ, а не только в академии - копия 2 отдала TRAIN officer17 на 508 с, офицер появился на 531 с, а академия встала лишь на 593 с. Значит строй был достижим всё время и академия за 1050 дерева и 1230 камня на пути к нему не нужна. СЛЕДУЮЩИЙ ШАГ: проверять СТРОЙ, а не академию - офицер и барабанщик из казармы к 300 с, FORMATION, без академии. Разбор - разборы/WOOD_ACADEMY_ПРОТИВ_NO_GATHER.md
