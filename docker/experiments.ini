что = РАННЯЯ КАЗАРМА ПЛЮС РАННИЙ РЕЙД В ОДНОМ ПЛЕЧЕ — решение игрока 27.09 («прогнать вместе на новой базе»). ЭТО ДВЕ РАЗНИЦЫ ПРОТИВ БАЗЫ, И ЭТО НАРОЧНО: порознь обе идеи не доехали, и они дополняют друг друга — рейд до шестой минуты требует армии к 300-й секунде, а её даёт ранняя казарма. Меры подобраны так, чтобы РАЗЛИЧИТЬ части: у каждой своя механическая проверка, и по разбору будет видно, доехала одна, обе или ни одна. ОТКУДА КАЖДАЯ ЧАСТЬ: (а) ранняя казарма — лучевой поиск порядков дал ратуша, мельница, кузница, КАЗАРМА, шахты: казарма к 84-й секунде и 33 бойца к 300-й, а в живых партиях железная шахта строится раньше казармы и отодвигает её на 80 секунд; стартовых ресурсов по 1000 каждого, то есть 500 золота на казарму есть сразу, а 1000 железа это 50 пикинёров по 20, и ранняя шахта добывает то, что уже в казне; ключ --barracks-first 1 отвергает BUILD шахты до казармы ВСЛУХ с этими числами. (б) ранний рейд — его запас еды до шестой минуты кормит лишь 5-31 бойца, а после восьмой 400+ и больше, чем он способен выставить, поэтому резня крестьян рушит его производство только РАНО; симулятор согласен по убитым: удар с 240 с даёт 75, с 300 — 70, с 420 — 33, с 600 — 22, с 780 — 18 при одинаковых потерях. ОГОВОРКА О КАРТЕ: перекрёст на карте 256 говорит, что там спешка наказывается — лучшее время удара сдвинулось с 300-й секунды на 600-ю, размен упал с 0,56 до 0,26, и живая база это подтвердила (размен 0,48/0,49/0,73 против 1,06/0,67/0,55 на 320). Поэтому плечо проверяет ИМЕННО ЭТО противоречие: ранний выход выгоден по голоду и невыгоден по размену, и что перевесит на маленькой карте — неизвестно. МЕРЫ, все на базе no_gather256 (карта 256, мост d04a8a8): МЕХАНИЧЕСКАЯ А (ранняя казарма доехала) — железная шахта ПОСЛЕ казармы во всех трёх копиях, база 89/138/438 против казармы 225/179/272, то есть раньше в двух из трёх; и казарма не позже 120 с. МЕХАНИЧЕСКАЯ Б (рейд доехал) — первый удар не позже 360 с и убито его крестьян до 6:00 больше 15, база 8/7/4. ЦЕЛЕВЫЕ: бойцов к 300 с — 20 и больше, база 11/16/1; ГОЛОД (его еда падает 5 окон по минуте подряд после 7:00 И его крестьян меньше 30) хотя бы в одной копии, у базы НИ В ОДНОЙ; его крестьян к концу ниже 60, база 129/34/50; его армия к концу ниже 89, база 144/118/89. КОНТРОЛЬНЫЕ: наши потери, база 221/245/164 — роста НЕ ждём, а если вырастут вдвое, ранний выход себя не оправдал; размен, база 0,48/0,49/0,73 — роста не ждём, ранний бой идёт малыми силами. ЧЕГО НЕ ЖДАТЬ: хорошего размена и большой армии к концу — плечо про ГОЛОД врага, а не про бой
итог = 3 КОПИИ 27.09 на карте 256 (мост b99aecc): ЦЕЛЬ ВЗЯТА В КОПИИ 2 — finish win на 543-й игровой секунде, его крестьян к концу 1, его армия 0, наши потери 22. МЕХАНИЧЕСКАЯ МЕРА РАННЕЙ КАЗАРМЫ ВЗЯТА: казарма 159 / 132 / 154 с против 225 / 179 / 272 у базы, железная шахта ПОСЛЕ казармы во всех трёх (у базы раньше в двух из трёх); порог 120 с не взят ни одной, но направление однозначное. Первый удар тоже раньше базы во всех трёх: 317 / 204 / 333 против 382 / 315 / 540, порог 360 взят везде. МЕХАНИЧЕСКАЯ МЕРА РЕЙДА НЕ ВЗЯТА: убито до 6:00 — 5 / 8 / 9 при пороге больше 15 (у базы 8 / 7 / 4). ЧТО РЕШИЛО — ДВАДЦАТЬ БОЙЦОВ К 300 С: у копии 2 их 25 и победа при размене 0,45, у копий 1 и 3 12 и 13 — потери 262 и 196 при размене 0,11 и 0,24, то есть ХУЖЕ базы (0,48 / 0,49 / 0,73). Значит ранний выход помогает только с армией: ниже двадцати он наказывается вдвое большими потерями, с двадцатью пятью кончает партию за девять минут. Это и есть ответ на противоречие, названное маком до серии. ГОЛОД мерой не различается: его еда на 8-й минуте 6554 / 6813 / 3277 против 4685 / 6842 / 8951, размахи перекрываются, а «череда падений еды» одинакова у всех шести партий (44-53 снимка) — мера негодна. ЧТО ДАЛЬШЕ: (1) «бойцов к 300 с» становится главной мерой, и её надо держать КЛЮЧОМ, а не подсказкой — ключ казармы поднял её с 11 / 16 / 1 до 12 / 25 / 13, но не дотянул; (2) порог «убито до 6:00 больше 15» пересмотреть: победа пришла при 8 убитых; (3) одна победа на три копии — наблюдение, нужен повтор. Разбор - разборы/EARLY_PUSH_ПРОТИВ_NO_GATHER256.md МАК ДОБАВИЛ 27.09, ПОЧЕМУ МЕРА ГОЛОДА НЕГОДНА ПО ПОСТРОЕНИЮ: в победной копии его еда при гибели крестьян РОСЛА — крестьян 23->14->7->1, еда 0 (240 с) -> 5953 (420 с) -> 7347 (542 с). Еду едят крестьяне и бойцы, и резня снимает расход раньше добычи; голода от неё не бывает никогда. Ломается у него не еда, а АРМИЯ: в победной копии она не поднялась выше 8 (к 400 с семь), в пяти остальных к 600 с стояло 13-39. Значит мера «его производство сломано» — его армия на 400-600 с. ВТОРОЕ ЧИСЛО, ГЛАВНОЕ ДЛЯ ТУРНИРА: в победной копии ВСЕ 22 наших потери до 600 с и ни одной после, а в пяти остальных после 600 с потеряно 164-224 против 0-38 до. То есть партия решается до десятой минуты, а дальше идёт мясорубка у его базы, которая при 15-минутном пределе и счёте по очкам экономики вычитает у нас очки и ничего не добавляет. Отсюда правило для подсказки: выходить с двадцатью к 300 с и кончать партию до 600 с, а если к 600 с его армия жива и растёт — прекращать подачу и держать своё.
