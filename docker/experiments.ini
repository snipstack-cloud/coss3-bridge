[no_gather]
что = КЛЕТКА СБОРА ВЫБРОШЕНА КАК МЕХАНИЗМ — ответ мака на вопрос Windows 25.09 («чинить приход к клетке сбора или выбрасывать сбор»). ПОЧЕМУ выбросить, а не чинить, по трассам 24.09 (259 походов): 205 (79 %) так и остались в фазе «сбор», удара дождались 34 (13 %), истекли 20; дошло до клетки медианно 14 при «надо» 92, порог взят лишь в 14 % походов; убыль его крестьян по фазе такта — 211 в «сборе», 227 без марша, 50 в «ударе»: убивают не удары после сбора, а присутствие где угодно. Вместе со счётом Windows (base27: 98 из 102 убитых при совместной клетке с 7,5 бойцами; tier1 с 18 в клетке — ноль) и вторым стратегом симулятора (без сбора, присутствие 31 % против 17) это три независимых довода за одно: решает присутствие, не масса, а сбор его только откладывает. ЧТО ИДЕЯ ДЕЛАЕТ: подсказка hints_no_gather.txt — ATTACK без via и без hold, всей армией на крестьян, повторно; флаги марша выключены (умолчания). МЕРЫ ДО ПРОГОНА: (1) доля тактов с нашими в клетке его крестьян — база base28 8 %, base27 13 %, ждём выше 13; (2) убито крестьян без голода (starve_report) — база 24, ждём выше; (3) походов в фазе «сбор» — ждём ноль по построению; (4) наши потери — ждать РОСТА, это цена присутствия, и мерить их только в связке с (1). ЧЕГО НЕ ЖДАТЬ: осады и цели — симулятор даёт осаду 0 и при этом плане. ДВА УРОВНЯ ОДНОГО ЗАМЫСЛА, СОЕДИНЕНЫ 25.09 НА WINDOWS: подсказка hints_no_gather.txt говорит модели не писать via, а ключ --no-gather 1 не даёт клетке сбора завестись, даже если модель всё равно её попросит, и отвергает via ВСЛУХ с причиной. Ключ тут СТРАХОВКА, а не вторая разница: если модель слушается подсказки, он не срабатывает ни разу, а если не слушается - идея всё равно проверяется. Повод для страховки известен: серия march 15.09 не проверила идею вовсе, потому что модель не отдала MOVE ни разу. МЕХАНИЧЕСКАЯ МЕРА, ОБЯЗАНА СРАБОТАТЬ, иначе идея не доехала: тактов с полем march должно стать НОЛЬ (у base28 их 27, волн с контрактом 23), а в трассе - отказы «сбор ВЫКЛЮЧЕН ключом --no-gather», по которым видно, сколько раз модель всё же просила сбор. Проверка ключа - selftest_no_gather.py, 17 проверок: удар при нём цел целиком (число бойцов, цель и клетка те же), отброшена только via
итог = 3 КОПИИ 25.09 на мосту bed4de0 против четырёх копий base28. МЕХАНИКА ЧИСТА: контрактов марша 0/0/0 (у базы 0/2/12/13), и отказов «сбор ВЫКЛЮЧЕН ключом» тоже 0/0/0 - модель НИ РАЗУ не попросила via, то есть послушалась подсказки, а ключ оказался чистой страховкой. ИГРА: убито крестьян за вычетом голода 117/95/5, медиана 95 - против 3 у base28 и 33 у base27, ЛУЧШЕГО, ЧТО ПРОЕКТ ВИДЕЛ. Веха во всех трёх. Крестьян врага к концу 79/92/143 против 113/130/127/95, две копии ниже минимума базы. Совместная клетка 41/57/14 процентов против 0/25/0/12 у базы и 14/14/20/16 у base27. НО ПРИЧИН ДВЕ, И РАЗВЕСТИ ЭТИМИ ДАННЫМИ НЕЛЬЗЯ: вместе с присутствием появились СТРЕЛКИ - 44/54/19 против НУЛЯ во всех копиях базы (подсказка о составе молчит, это выбор модели). По отдельности ни одно объяснение не сходится: base28/2 дала 25 процентов совместной клетки при нуле стрелков и убила 3; base27/1 имела 67 стрелков при 14 процентах присутствия и убила 37, не сто. Сходится «нужно и то и другое» - присутствие даёт дойти, стрелки попасть по убегающему крестьянину (пикинёр его не догоняет, это измерено давно). Клетка «и то и другое» стоит на ДВУХ точках. ФОРМАЛЬНО ЕЩЁ НЕ ИЗМЕРЕНИЕ: размахи пересекаются и по убитым (5 у идеи против 14 у базы), и по присутствию (14 против 25). РАЗВОДИТ ОДИН ПРОГОН - идея [no_gather_noshoot], те же флаги плюс --ban musk17, три исхода названы в её описании заранее. Разбор - разборы/NO_GATHER_ПРОТИВ_BASE28.md
база256 = БАЗОВЫЕ ЧИСЛА НА КАРТЕ 256 (3 копии 27.09, мост d04a8a8, результаты no_gather256): первая волна 382 / 315 / 540 с против 277 / 278 / 276 на карте 320; армия максимум 73 / 132 / 98 против 218 / 171 / 188; размен 0,48 / 0,49 / 0,73 против 1,06 / 0,67 / 0,55; наши потери 221 / 245 / 164 против 173 / 232 / 174; убито его крестьян 27 / 49 / 62 против 122 / 97 / 10; его крестьян к концу 129 / 34 / 50; его армия к концу 144 / 118 / 89; ЕГО ЕДА НА 8-Й МИНУТЕ 4685 / 6842 / 8951 против 9831 / 11113 / 8245; расстояние «между» в клетке — медиана 3, кв3 5-6, макс 14-17 единиц при клетке 16. ВСЕ НОВЫЕ ИДЕИ СРАВНИВАТЬ С ЭТИМИ ЧИСЛАМИ, а не с архивными: карта другая, и различия крупные. Заметно, что на маленькой карте первая волна уходит ПОЗЖЕ, армия меньше вдвое, а его еда на восьмой минуте НИЖЕ — и число 5800, которое мак называл базовым, попадает как раз в размах маленькой карты, а не большой
