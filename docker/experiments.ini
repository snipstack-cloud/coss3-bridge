[food_early]
что = ДВЕ ТРЕТИ КРЕСТЬЯН НА ЕДЕ ДО 300-Й СЕКУНДЫ — разгадка первой победы (§16). ОТКУДА: в серии early_push копия 2 взяла цель на 542-й секунде (его крестьян 1, армия 0, наши потери 22), а две другие дошли до горизонта с потерями 262 и 196 — при ОДИНАКОВЫХ подсказках и ключе. Разница одна: бойцов к 300 с было 25 против 11 и 13. А бойцов решила еда: в окне 130-310 с у победителя на еде 16 крестьян из 25 (64 процента) и еда ниже порога 500 лишь в 29 процентах тактов, у проигравших 12 из 22 и 7 из 22 при еде под порогом в 74 процентах. Порог 500 глушит найм целиком, поэтому ранняя казарма стояла готовой и не производила. Арифметика сходится: при населении 50 расход 5 в секунду, 16 человек на еде дают 17,6, семеро — 7,7, а пикинёр стоит 25 еды сразу и крестьянин 100. ЧТО ДЕЛАЕТ: подсказка hints_food_early.txt — до 300-й секунды две трети крестьян на еде, остальных на дерево и камень, шахты не строить (ключ и так не даст), заказ пехоты бесконечным сразу после казармы. ЭТО ЦЕЛЬ-СОСТОЯНИЕ, А НЕ ПРОЦЕДУРА, поэтому должно переноситься подсказкой. МЕРЫ на базе no_gather256: (1) МЕХАНИЧЕСКАЯ — доля крестьян на еде в окне 130-310 с, база 55/32 процента у проигравших и 64 у победителя, ждём не ниже 60 во всех трёх копиях; (2) МЕХАНИЧЕСКАЯ — доля тактов с едой ниже 500 в том же окне, ждём не выше 40 процентов (у проигравших 74); (3) ГЛАВНАЯ — бойцов к 300 с, база 11/16/1, ждём 20 и больше; (4) цель взята хотя бы в одной копии (finish win); (5) наши потери, база 221/245/164 — ждём НИЖЕ, у победителя было 22; (6) КОНТРОЛЬНАЯ — время казармы, ключ держит её к 132-159 с, не должно уехать. ЧЕГО НЕ ЖДАТЬ: убитых крестьян до 6:00 — победа пришла при восьми, и прежний порог 15 снят как выдуманный
