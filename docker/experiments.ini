[hire_channel]
что = ВОЕННЫХ ЗАКАЗЫВАЕТ ОТДЕЛЬНЫЙ КАНАЛ, и он спрашивается часто. Замысел игрока 21.09: здание достроилось, модель назвала вид - а через полминуты у врага другой состав, и нужен другой боец; обычный такт идёт раз в 20 с и занят всем сразу, а узкий вопрос «кого нанимать» стоит 2,0-2,2 с (замер 21.09 на 13 задачах, облако и llama3.1:8b) и его можно задавать хоть каждые десять секунд. Ключи: --hire-every 10-60 (спрашивать не только на достройке, срок СЛУЧАЙНЫЙ в этих границах: против другого бота одинаковый период опроса у обеих сторон сводит их в такт и раскачивает состав) и --hire-only 1 (мост НЕ ПРОПУСКАЕТ в игру военный TRAIN от обычного такта и говорит ей об этом; крестьяне остаются за ним; событийный канал из-под отбора изъят). ОТЛИЧИЙ ОТ БАЗЫ ДВА, и это осознанно: частота вызова и отбор у обычного такта - порознь они бессмысленны, отбор без частого вызова оставил бы армию вовсе без найма между достройками. МЕРЫ, названные ДО прогона: 1) состав армии к концу и ДОЛЯ СТРЕЛКОВ против состава врага - главное, ради этого всё; 2) сколько раз состав заказа СМЕНИЛСЯ за партию (было: смена вида в очереди почти не случается); 3) вызовов события за партию и их медиана по времени; 4) сколько военных TRAIN отобрано у обычного такта - если много, значит модель не прочитала правило; 5) контроль: цель, вехи, армия к концу, крестьяне; 6) качается ли состав впустую - смен вида за партию против числа вызовов. ПРИЗНАК ВРЕДА: событие зовётся часто, а состав не меняется - значит частота не нужна, хватает достройки. ДОБАВЛЕНО 21.09 ПОСЛЕ БАЗЫ, ГЛАВНАЯ МЕРА: ЗАКАЗАН ЛИ musk17 ХОТЬ РАЗ и сколько стрелков к концу. У base24 это ТВЁРДЫЙ НОЛЬ: за 9 партий infantry17 38 приказов, dragoon17 11, musk17 НИ ОДНОГО, mil_shooters 0 во всех девяти - при том что musk17 виден модели в каждом из 455 тактов со своей дальностью rmax1500 против 188 у пикинёра, и на gt=402 модель прямо написала «цель пикинёром недостижима, перевожу экономику на стрелков», но приказа не отдала. Узкий вопрос даёт те числа, которых нет в общем такте: фору по дальности (сколько залпов успеет до сближения), названную метрику размена и расход боеприпаса. Если после этого musk17 будет заказан - идея работает именно здесь. ОГОВОРКА К ОБЪЁМУ: 2 копии по 2 партии против 9 партий базы, это наблюдение, а не измерение
итог = ЗАКРЫВАЛАСЬ БАЗОЙ 21.09, ПЕРЕОТКРЫТА В ТОТ ЖЕ ДЕНЬ ПО ЗАМЕЧАНИЮ ИГРОКА. Закрытие было преждевременным: оно било по двум путям из трёх. ЗАКРЫТО НАДЁЖНО: (а) отзываться на состав врага не на что - за 9 партий базы у него ни разу не было конницы, стрелки в 3 партиях числом ОДИН на 3-7 тактов; (б) наполнять очередь незачем - приказ TRAIN бесконечный, очередь занята 92 процента тактов, а все 30 тактов с пустой очередью это ТОЛЬКО ЧТО ДОСТРОЕННОЕ здание, что уже закрывает событие по достройке. ОСТАЛСЯ ТРЕТИЙ ПУТЬ, его и проверяем: узкий вопрос со списком кандидатов может превратить намерение в приказ. Прежнее закрытие опиралось на мой же ошибочный счёт - я читал a1 в трассе как номер здания, тогда как ROLE это карта ЮНИТОВ (coss3_bridge.py:28): peasant 1, infantry17 23, musk17 25, dragoon17 49. Мера 3 базы («менял ли враг состав») была названа до прогона именно с этим расчётом и дала: за 9 партий у врага НИ РАЗУ не было конницы, стрелки в 3 партиях числом ОДИН на 3-7 тактов из полусотни. Замысел «у врага другой состав, нужен другой боец» в паре наций 13/13 не возникает, отзываться не на что, частый опрос не нужен. Закрыт ИМЕННО ЗАМЫСЕЛ частого опроса; механика --hire-only (мост не пропускает военный TRAIN обычного такта) проверена на живой игре 21.09 и остаётся: отобрано ноль раз, модель усвоила правило сама и записала его уроком. Живая партия там же подтвердила a33ce42 (падение на ba_queues=none-built) и событийный канал: 24 вызова, медиана 31 с против 380 с у базы
