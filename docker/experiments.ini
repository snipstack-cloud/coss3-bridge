[hunt_peasants]
что = ОХОТА ЗА КРЕСТЬЯНАМИ КЛЮЧОМ — узкое место переехало из дебюта в эндшпиль (Windows, 27.09 вечер). ОТКУДА: food_floor/3 уничтожила армию врага (его армия к концу 0, размен 1,44, убито 93 крестьянина) и НЕ взяла цель — осталось 18 разбежавшихся крестьян, а волна стояла там, где добила последнего; победы приходят только когда его крестьян остаётся 1. ПОЧЕМУ КЛЮЧОМ: за 27.09 подсказкой доехали ВСЕ задания про целевое состояние и НИ ОДНО про процедуру (окно 3х3 — 0 из 3, FORMATION по готовности — 0 из 6, мушкетёры в тыл — 0 MOVE из 6, двадцать бойцов к сроку — 0 из 3). ЧТО ДЕЛАЕТ КЛЮЧ --hunt-peasants 1: в такт без удара модели мост разворачивает уже идущих бойцов режимом engage на клетку с крестьянами, предпочитая ту, где нет его бойцов рядом (охрана дороже расстояния: 25.09 показано, что убивает присутствие, а не масса), и переставляет цель, когда клетка опустела, не чаще раза в 20 с; своя атака модели важнее, во время марша не вмешивается. МЕРЫ ДО ПРОГОНА, в скобках база food_floor: (1) МЕХАНИЧЕСКАЯ — снимков с полем «охота» больше нуля в каждой копии (у базы поля нет вовсе), иначе ключ не доехал; (2) ЕГО КРЕСТЬЯН К КОНЦУ — 65 / 1 / 18, ждём НИЖЕ: в этом весь смысл; (3) цель взята — у базы 1 из 3, ждём не меньше; (4) снимков, где наши бойцы в клетке с его крестьянами, — ждём выше базы; (5) КОНТРОЛЬ: наши потери (241 / 23 / 64) и размен (0,28 / 0,70 / 1,44) — ухудшения не ждём, охота не должна разменивать армию на беготню. ЗАОДНО ПРОВЕРЯЕТСЯ НОВОЕ ПОЛЕ «потери_клетки»: раскладка убыли по клеткам с признаком «точно» (клетка контакта одна либо суммы сошлись с картовыми счётчиками) — ждём, что поле появится в трассе и в снимках и что «точно» поднимается хотя бы в части тактов. Отличие от базы ровно одно: ключ охоты
итог = 3 КОПИИ 27.09 вечер (мост 4569491, карта 256): КЛЮЧ ДОЕХАЛ И СДЕЛАЛ ХУЖЕ. Механическая мера взята — снимков с полем «охота» 119 / 168 / 166 против нуля у базы. Целевая ПРОВАЛЕНА: его крестьян к концу 125 / 17 / 66 против 65 / 1 / 18 у food_floor, побед ноль против одной. ПРИЧИНА: присутствие УПАЛО — снимков, где наши в клетке с его крестьянами, 100 / 107 / 105 против 137 / 27 / 147 (медиана 105 против 137). Мост водил волну к крестьянам чаще, а стояла она с ними реже: цель переставляется, как только клетка опустела, а на маленькой карте это происходит постоянно — волна получает приказ каждые 20 с и половину времени идёт, а не бьёт. Это обратное измеренному 25.09: решает ПРИСУТСТВИЕ в клетке, а не число приказов. ПРО НОВОЕ ПОЛЕ потери_клетки: работает, раскладка есть в 106 / 121 / 119 снимках, «точно» поднялось в 31 / 36 / 38 — но во ВСЕХ точных тактах погибших НОЛЬ. Это следствие самого правила: «точно» бывает, когда клетка контакта одна, а одна клетка — это затишье; настоящий бой идёт в нескольких клетках, и правило честно отказывается приписывать потери. Значит правило верное, а раскладки потерь из него не получить: точность и настоящая гибель почти не совпадают во времени. ЧТО ДАЛЬШЕ: (1) ключ охоты переделать на УДЕРЖАНИЕ — стоять в клетке, пока в ней или в соседних есть крестьяне, а не переставлять; (2) раскладку потерь считать В БЛОКЕ (запоминать бойцов по клеткам и видеть на следующем такте, кого не стало) — правка .inc с живой проверкой, но иначе «кто где погиб» в настоящем бою не измерить. Разбор - разборы/HUNT_PEASANTS_ПРОТИВ_FOOD_FLOOR.md МАК ПОПРАВИЛ 27.09: ПЛЕЧО ИДЕЮ НЕ ПРОВЕРИЛО. Механическая мера была ложной — поле «охота» ставится один раз и дальше лежит в каждом снимке, поэтому 119/168/166 снимков не мерят действие ключа. Приказов охоты (смен целевой клетки) за партию 1/1/1, а своих ATTACK модель отдала 28/34/31; приказ модели важнее, а ключ второй раз не вмешивался, потому что переставляет цель только при опустевшей клетке. Значит разница по крестьянам (125/17/66 против 65/1/18) — разброс копий, а не следствие охоты, и вывод «охота убивает присутствие» снят. Мерить впредь ПРИКАЗЫ (разбор_охоты.py), а не наличие поля. Плюс на единственном приказе сработала мера мака: копия 3 повела 16 бойцов в клетку с девятью его бойцами рядом, копия 2 — при перевесе 0,33, то есть 1 из 2 приказов с контактом в полосу с разменом 0,13-0,26.
