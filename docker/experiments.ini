что = РЕЙД ПО КРЕСТЬЯНАМ ДО ШЕСТОЙ МИНУТЫ — задание мака и игрока 27.09 (§15е). ОТКУДА: его запас еды кормит 5 бойцов на 2-4-й минуте, 31 на 4-6-й, но уже 232 на 6-8-й и 935 к концу; после восьмой минуты запас больше, чем он способен выставить, и резня крестьян на производство не влияет вовсе. Симулятор согласен по убитым: удар с 240 с даёт 75, с 600 с — 22 при тех же потерях. ЭТО ЕДИНСТВЕННОЕ, ЧЕГО СИМУЛЯТОР ПРОВЕРИТЬ НЕ МОЖЕТ: наступает ли у врага голод на самом деле. ЧТО ДЕЛАЕТ: подсказка hints_early_raid.txt — дебют под раннюю армию (кузница и казарма раньше всего, двадцать пикинёров к 300 с), первый удар по крестьянам не позже 360 с, дальше как обычно. МЕРЫ ДО ПРОГОНА, в скобках база no_gather (bed4de0): (1) ГЛАВНАЯ — его еда на восьмой минуте, у базы около 5800, ждём НИЖЕ: это и есть голод; (2) МЕХАНИЧЕСКАЯ — время первого удара, у базы 277 / 278 / 276 с, ждём не позже 360 (у базы уже хорошо, проверяем, что не уехало); (3) наших бойцов к 300 с — ждём 20 и больше (в архиве так бывает в 18 процентах партий); (4) убито его крестьян до 6:00 — у базы почти ноль, ждём больше 15; (5) его крестьян к концу — у базы около 110, ждём ниже 60; (6) его армия к концу — около 150, ждём ниже. ЧЕГО НЕ ЖДАТЬ: размена. Ранний бой идёт малыми силами, и он будет хуже обороны дома — проверяется ГОЛОД, а не бой. ОТ WINDOWS: выбор клетки без его бойцов в подсказке оставлен, но названа и цена промедления — по счёту 27.09 процедурные указания подсказкой не переносятся (окно 3х3 не сработало ни в одной из трёх копий free_peasants), а «первый удар не позже 360 с» и «двадцать бойцов к 300 с» — это целевые состояния, они доезжали всегда. Отличие от базы ровно одно: подсказка; ключ --no-gather 1 у обеих сторон
итог = 3 КОПИИ 27.09 (мост f86b2ec): ИДЕЯ НЕ ДОЕХАЛА, а порог главной меры оказался неверным. МЕХАНИЧЕСКАЯ МЕРА ПРОВАЛЕНА: убито его крестьян до 6:00 — 7 / 3 / 6 при ожидании «больше 15», у базы в том же окне 6 / 2 / 5, то есть рейда раньше базы не случилось вовсе. Срок первого удара доехал (280 / 311 / 347 с), но дебют под раннюю армию сделал ХУЖЕ базы: наших к 300 с 11 / 17 / 7 против 18 / 16 / 14, при требовании двадцати. ПОРОГ МЕРЫ НЕВЕРЕН: «его еда на 8-й минуте ниже базовых 5800» — по снимкам самой базы там 9831 / 11113 / 8245, а у идеи 7092 / 9368 / 9834, то есть плечо лежит ВНУТРИ размаха базы; числа 5800 нет ни у одной копии базы. ГОЛОДА НЕТ НИ В ОДНОЙ ИЗ ШЕСТИ ПАРТИЙ: его еда к концу 14 902 / 28 046 / 42 556 у идеи и 12 836 / 49 396 / 83 812 у базы; прирост еды идёт вместе с числом крестьян (+34/с при 24 крестьянах, +64 при 51, +127 при 125), а крестьяне ВОССТАНАВЛИВАЮТСЯ — к концу 106 / 97 / 80 при 47 / 16 / 23 убитых. Апгрейд mil.1, удваивающий сбор еды, он взял во ВСЕХ ШЕСТИ партиях (видно по новому полю снимка). ЧТО ДАЛЬШЕ: (1) ранняя армия подсказкой не строится — третий случай подряд, нужен ключ моста, который держит бесконечный заказ пехоты и не пускает золото на мельницу до казармы; (2) порог 5800 заменить измеренным 8245-11113; (3) прежде чем тратить ещё серию, посчитать по архиву, бывало ли вообще, чтобы его еда падала два окна подряд. Разбор - разборы/EARLY_RAID_ПРОТИВ_NO_GATHER.md
меры_пересмотрены = МЕРЫ ПЕРЕПИСАНЫ 27.09 ПОД НОВУЮ БАЗУ. БАЗА ТЕПЕРЬ no_gather256 (карта 256, три копии, мост d04a8a8), и все пороги ниже — её: наши потери 221/245/164, его потери 105/119/119, размен 0,48/0,49/0,73, убито крестьян 27/49/62, убито до 6:00 — 8/7/4, бойцов к 300 с — 11/16/1, его еда на 8-й минуте 4502/7156/8552, казарма 225/179/272 с, железная шахта 89/138/438 с (то есть раньше казармы в ДВУХ копиях из трёх), его крестьян к концу 129/34/50, его армия к концу 144/118/89, наша армия к концу 38/69/85, голод НИ В ОДНОЙ. Архивные пороги (убито 117/95/5, потери 173/232/174, размен 1,06/0,67/0,55) — карта 320 и НЕДЕЙСТВИТЕЛЬНЫ. ЖДЁМ: убито до 6:00 больше 15 (база 8/7/4); бойцов к 300 с — 20 и больше (база 11/16/1); ГОЛОД хотя бы в одной копии (у базы ни в одной); его крестьян к концу ниже 60 (база 129/34/50); его армия к концу ниже 89 (база 144/118/89). ПРЕЖНИЙ ПОРОГ «еда ниже 5800» СНЯТ: это был размах самой маленькой карты, то есть число случайно совпало с новой базой (4502/7156/8552), но выведено было из корпуса карты 320.
