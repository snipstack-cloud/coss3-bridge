что = СВЯЗКА 4: СМЕНИ СОСТАВ, КОГДА ЕГО ЗАЩИТА УПЁРЛА НАШ УРОН В ПОЛ. Урон = атака минус защита цели ПО ТИПУ ОРУЖИЯ и не бывает меньше единицы (lib/miscext2.script:380), поэтому его вложения в защиту от ПИК не трогают ПУЛЮ: пуля идёт против dbullet, пика против dpike. Живая партия 19.09: его пикинёр atk13 dpike7 против нашего atk8 - наш урон ровно 1, размен 12,86, и никакой перевес этого не отыгрывает. Мост считает это сам и даёт готовый приказ TRAIN на тот вид, чьё здание УЖЕ стоит, с ценой и форой по дальности. ОТЛИЧИЕ ОТ base22 РОВНО ОДНО - ключ --switch-kind 1; мост, world.md, горизонт и все прочие флаги те же. Это первый случай за двое суток, когда отличие одно. МЕХАНИКА УЖЕ ПРОВЕРЕНА живой партией 20.09: 4 срабатывания, модель послушалась, 10 приказов на стрелков, состав к концу пехота 12 / стрелки 51. ЭФФЕКТ НЕ ИЗМЕРЕН, и та же партия НАСТОРАЖИВАЕТ: армия к концу 63 против 200-290 у base21, цель не взята. МЕРЫ, названные ДО прогона (в скобках base21/base22): (1) ГЛАВНАЯ - вехи и ЦЕЛЬ (0 из 4 у base21); (2) сколько тактов со строкой связки и сколько приказов TRAIN на названный вид - было 4 и 10 на живой партии; (3) состав армии к концу: пехота против стрелков и конницы (285/171/194/218 пехоты, конницы 52 всего); (4) просадка армии врага (268 за 4 партии) и потери на волну при вылазке; (5) волн на партию (4,75) и доля дошедших до удара. ПРИЗНАК ВРЕДА, названный ЗАРАНЕЕ и уже однажды виденный: армия к пику и к концу падает ниже base22 - модель распускает пикинёров и перекуёт состав в середине партии, теряя и старых, и новых; смотреть отдельно, не проседает ли армия сразу после первого срабатывания
