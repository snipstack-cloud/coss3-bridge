[gather]
что = ЧЕСТНАЯ ПЛАНКА СБОРА. Найдено счётом по base27 (23.09, 55 тактов марша за четыре партии): УДАР НЕ СЛУЧИЛСЯ НИ РАЗУ - 53 такта в фазе «сбор», 2 «истёк», ноль ударов. Причин две, обе измерены. ПЕРВАЯ: «послано» НАКАПЛИВАЕТ ОДНИХ И ТЕХ ЖЕ бойцов - каждый ATTACK во время сбора считается примыканием и прибавляет своё число заново; дошло до 2916 при живой армии 305, то есть планка 1944 при дошедших 108. ВТОРАЯ: две трети недостижимы и БЕЗ двойного счёта - у клетки сбора стоит медианно 41 процент войска, максимум 70 (счёт по сетке arow, той самой, по которой считает мост), остальные кучкой медианно 25 человек в шести клетках. Ключ --gather-share лечит оба разом: надо = ДОЛЯ от min(послано, живая армия). ПРЕДСКАЗАНИЕ, ПОСЧИТАННОЕ ПО ТЕМ ЖЕ 55 ТАКТАМ ДО ПРОГОНА: при 0.33 удар состоялся бы в 16 тактах, при 0.5 - в 2, при 2/3 (как сейчас) - в 0. Берём 0.33. ОГОВОРКА О РИСКЕ, названная заранее: проект уже находил, что МАЛЫЕ ВОЛНЫ ГИБНУТ (группа из 5 у базы врага не убила никого, 19.09), и снижение порога бьёт ровно туда. Разница в масштабе: треть от армии в 167-305 это 55-100 бойцов, а не пятеро. Если свои потери вырастут, а веха не сдвинется - идея отрицательная, и это тоже результат. МЕРЫ, НАЗВАННЫЕ ДО ПРОГОНА. (1) ГЛАВНАЯ: ДОЛЯ ПОХОДОВ, ДОШЕДШИХ ДО УДАРА - у base27 НОЛЬ из всех маршей; ожидается заметно больше нуля, и если останется ноль, правка не работает вовсе. (2) фазы марша: тактов «сбор», «истёк», «удар» - у base27 53/2/0. (3) СВОИ ПОТЕРИ по полю потери и по падению mil_inf за такт - контроль риска малых волн. (4) веха и время её взятия (base27: цель 0 из 4, веха по отчётам) и ПОБЕДА отдельно. (5) волн на партию (base27: 101 на четыре партии) и крестьян врага к концу (51/94/115/55). (6) сколько раз сработал ПОТОЛОК по армии, то есть сколько раз двойной счёт был бы применён - по полю МАРШ.потолок; у base27 таких тактов 39 из 55. (7) игровые контрольные: TRAIN infantry17 (22), еда ниже 500 (медиана 21 процент), «УЖЕ ЗАЛОЖЕНО» (20 процентов), время событий (медиана 3,5 с, максимум 6,0). КОНТРОЛЬ: первый ход не позже 15 игровой секунды; условия по match.dat; события идут локальной qwen3 родным путём, как в базе. ЧЕГО ЖДАТЬ НЕ СЛЕДУЕТ: цель на четырёх партиях - шум; правка меняет не замысел модели, а то, когда мост считает войско собравшимся
итог = 4 партии 23.09 на мосту 19cef96, все до горизонта, 229 тактов. КОНТРОЛЬ: мост, идея и ключ gather-share 0.33 сверены во всех четырёх копиях. ГЛАВНАЯ МЕРА ВЗЯТА: походов, дошедших до удара, 3 ИЗ 3 против 0 ИЗ 2 у base27. Фазы марша: у плеча 6 тактов «сбор» и 3 «удар», у базы 53 «сбор» и 2 «истёк» - войско больше НЕ СТОИТ у клетки до истечения срока, а бьёт. Предсказание («при 0.33 удар состоялся бы в 16 тактах из 55») подтвердилось по смыслу: марши теперь короткие, и тактов сбора стало 9 вместо 55. ПОТОЛОК ПО АРМИИ НЕ СРАБОТАЛ НИ РАЗУ - и это объяснимо: марш кончается за два-три такта, «послано» не успевает накопиться. Значит из двух лечений работало ОДНО - доля; потолок остаётся страховкой от двойного счёта, а не действующей силой. НО ИГРУ ЭТО НЕ ДВИНУЛО, и причина видна: МАРШЕЙ ЗА СЕРИЮ ВСЕГО ТРИ. Инструмент печатает «волн 106», но считает он такты с непустым полем attack, а не походы; механика сбора включается, только когда модель даёт ATTACK с клеткой сбора, и за четыре партии это случилось трижды. Правка, касающаяся трёх событий на серию, не может сдвинуть ни веху, ни цель - ровно тот же урок, что с событийным каналом. ИГРОВЫЕ МЕРЫ: цель 0 из 4 у обоих; TRAIN infantry17 25 против 22; стрелков ноль во всех четырёх (у base27 было 67 в одной копии); КРЕСТЬЯН ВРАГА К КОНЦУ БОЛЬШЕ: 150/124/138/95 против 51/94/115/55 - то есть по главному направлению плечо выглядит ХУЖЕ базы, но на четырёх партиях это разброс, и механизма за ним не видно. МЕРА РИСКА ПОСЧИТАНА, И РИСК НЕ ПОДТВЕРДИЛСЯ. Поправка к первому разбору: я объявил поле потерь отсутствующим и сложил потери по тактам, получив 11432 при пике армии 191. Поле ЕСТЬ - в трассе оно лежит как потери.my_mil, и это НАКОПИТЕЛЬНЫЙ счётчик движка с начала партии, а не потери за такт; брать надо последнее значение. По нему, суммой за четыре партии: СВОИХ БОЙЦОВ потеряно 782 у плеча против 789 у базы - одинаково, то есть страх «малые волны гибнут» на этих числах не подтвердился. Бойцов врага убито 336 против 327 - тоже поровну. НО КРЕСТЬЯН ВРАГА УБИТО 48 ПРОТИВ 121, вдвое с половиной меньше, и это ГЛАВНОЕ НАПРАВЛЕНИЕ проекта. Сходится со вторым, независимым числом: крестьян у врага к концу 150/124/138/95 против 51/94/115/55. Два разных счёта говорят одно, и оба против плеча: похоже, ранний удар третью армии уводит бой на его войско, а не на крестьян. На четырёх партиях это наблюдение, а не приговор, но идею «бить раньше и меньшим кулаком» оно скорее закрывает, чем открывает. ЧТО ДЕЛАТЬ ДАЛЬШЕ: (1) починить счёт потерь - без него любое плечо про бой слепо; (2) выяснить, почему марш заводится лишь трижды за четыре партии, тогда как модель просит атаку в сотне тактов: это и есть настоящее узкое место, а не планка. ДЕНЬГИ: прогон стоил около 1,7 доллара
