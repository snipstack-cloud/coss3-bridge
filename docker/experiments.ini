[debut]
что = ДЕБЮТ: потолок строителей делится между закладками такта. Найдено 23.09 разбором дебюта base27, где простой съедает 44,5 процента труда за первые 200 секунд против 6-7 дальше. МЕХАНИЗМ, проверенный по коду блока и по трассам: block_hcmd.inc читает BUILDERS ОДНИМ предпроходом на такт и применяет его к КАЖДОЙ закладке, а людей с недостроя не снимает никогда (правило 16.09, куплено тем, что новая закладка обирала предыдущую). Значит при двух BUILD в одном такте первая забирает всех до потолка, а вторая получает от игры «BUILD eurmil: nobody to build it - no peasants at all». В base27 это случилось в обеих осмотренных копиях на 12-й секунде: заказаны ратуша и мельница при BUILDERS 18, ратуша встала сразу, мельница отложилась до 53 с в одной копии и до 82 в другой. Мельница ОТКРЫВАЕТ ЕДУ - пока её нет, BALANCE food не делает ничего, и в этом корень голода дебюта. ПРАВКА: ключ --split-builders (по умолчанию 1) опускает потолок до свободные/закладки и говорит об этом вслух. ВМЕСТЕ С НЕЙ В ПРОГОНЕ ИДЁТ вчерашняя правка вердикта (мост перестал говорить «отправлено» там, где игра отказала, и называет направление по имени) - она в master и отдельно не выключается, так что РАЗНИЦ ПРОТИВ base27 ДВЕ, и это сказано заранее. МЕРЫ, НАЗВАННЫЕ ДО ПРОГОНА. КОНТРОЛЬ ПРАВКИ: (1) сколько раз в трассе сказано «BUILDERS N -> M» - если ноль, правка не сработала ни разу и дальше смотреть нечего; (2) сколько раз игра ответила «nobody to build it» - у base27 это было в двух копиях из двух на 12-34 с. ГЛАВНЫЕ: (3) СЕКУНДА, НА КОТОРОЙ ПОЯВЛЯЕТСЯ МЕЛЬНИЦА (mills с 0 на 1) - у base27 копия 1 это 90 с, копия 2 позже; (4) секунда, на которой первый человек встаёт на еду - у копии 1 base27 158 с, у пробы verdict 176; (5) доля крестьяно-секунд простоя за первые 200 с - у base27 44,5 процента по четырём партиям, у пробы verdict 26,3 на одной. ПРОЧЕЕ: простой за партию целиком (база 14,3), веха и её время, события и их время. ЧЕГО ЖДАТЬ НЕ СЛЕДУЕТ: одна партия ничего не измеряет, разброс дебюта не мерен, и цель на ней бессмысленна. Смотреть надо на цепочку: поделился ли потолок, встала ли мельница раньше, пошли ли люди на еду раньше
итог = ОДНА ПАРТИЯ до горизонта, 59 тактов, мост dfa055e. ЦЕПОЧКА ДЕБЮТА ПОДТВЕРДИЛАСЬ ЦЕЛИКОМ. КОНТРОЛЬ: потолок поделён 1 раз; «nobody to build it» НИ РАЗУ, тогда как у base27 этот отказ был в трёх копиях из четырёх (1,1,2,0). МЕЛЬНИЦА НА 51 с - раньше всех у базы (90/57/78/90). Первый человек на еде на 147 с против 177/142/189/182. ПРОСТОЙ ПЕРВЫХ 200 с: 23,2 процента против 42,1/41,2/38,1/53,6 - ниже всех четырёх копий базы. То есть каждое звено цепочки сдвинулось в ту сторону, в какую и предсказано, и это на одной партии, где предсказание было названо заранее. ИГРА: веха на 246 с (45 тактов), УБИТО 48 КРЕСТЬЯН ВРАГА при наших потерях 5 бойцов и НОЛЬ крестьян; у врага к концу осталось 11 крестьян против 51/94/115/55 у base27. Это ЛУЧШАЯ партия проекта по главному направлению и ближе всего к цели (ноль крестьян) за всё время; но ОДНА ПАРТИЯ, и разброс тут огромен - как результат идеи это не засчитывается, только как повод повторить на четырёх копиях. ОТДЕЛЬНАЯ НАХОДКА, НЕ СВЯЗАННАЯ С ПРАВКОЙ: с 456-й секунды модель ПЕРЕСТАЛА поднимать итоговые числа на ресурсах - на еде 19, дереве 8, камне 3, золоте 10, железе 5 держались до конца, а крестьяне рождались, и к концу простаивала ПОЛОВИНА ДЕРЕВНИ (52 из 100). Простой за партию 36,4 процента против 6,6-10,2 у base27. Вердиктов «не изменилось» 16, из них 8 в поздней части; «игра отказала» ноль раз - вторая половина вчерашней правки так и не проверена. Похоже, модель ушла в войну (350 пехоты) и бросила хозяйство, но причина не доказана: это ОТКРЫТЫЙ ВОПРОС и первый кандидат на следующий разбор. ДЕНЬГИ: проба стоила около 0,45 доллара
