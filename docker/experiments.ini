[strike_late]
что = ОДИН ПОЗДНИЙ УДАР ПОСЛЕ АПГРЕЙДОВ АТАКИ — стратегия, которую нашёл стратег в симуляторе (sim/train.py --strat --ladder, 25.09): 80 поколений эволюции по лестнице целей выбрали «UPGRADE атака» 182 раза и «ATTACK all peasants» один раз на партию. На отложенных партиях в симуляторе: размен ≥ половины в 85 процентах против 15 у команд записи, доставка 54 против 54, удар 46 против 62, осада 0 против 15. Проверяется КАК ЗНАНИЕ модели — файлом подсказок hints_strike_late.txt, мост не подменяет команды. МЕРЫ ДО ПРОГОНА, ПЕРЕПИСАНЫ 25.09 ПО СЧЁТУ «ПОЧЕМУ НЕ БЬЁМ» (разборы/ПОЧЕМУ_НЕ_БЬЁМ.md): (1) ГЛАВНАЯ - ДОЛЯ ТАКТОВ, ГДЕ НАШИ БОЙЦЫ В ОДНОЙ КЛЕТКЕ С ЕГО КРЕСТЬЯНАМИ (сетки arow и prow, знак клетки по ЗНАКИ='.123456789a..z', '+' это 36+): у base27, которая бьёт, 13 процентов тактов, у base28 8, у tier1 4 - и убийства идут ровно там: 98 из 102 у base27, 17 из 24 у base28, 0 из 4 у tier1. ПОПРАВЛЕНО 25.09 вечером по возражению мака: прежняя формулировка этой меры была «доля времени за 280 по mil_far» и она НЕГОДНА - mil_far это максимум по армии, а не место боя, и в миг убийства он даёт 270,5 у base27, 156,5 у base28 и 10,5 у tier1. Это же мера симулятора мака (присутствие в клетке с крестьянами), то есть обе стороны мерят одним числом. Годная идея увеличивает эту долю; РЯДОМ ВАЖНОЕ: решает присутствие, а не масса - base27 убила 98 крестьян при медианно 7,5 бойцах в совместной клетке, tier1 с 18 не убил ни одного; (2) лестница целей по партии (sim/goals.py по трассе) — ждём ступень 4 (размен) выше базы; (3) момент первой волны (позже базы); (4) НАШИ ПОТЕРИ ТОЛЬКО В СВЯЗКЕ С (1), И САМИ ПО СЕБЕ НИ О ЧЁМ НЕ ГОВОРЯТ: прежняя формулировка «ждём ниже базы вдвое» смотрела В ПРОТИВОПОЛОЖНУЮ СТОРОНУ. Удачная очередь base27/1 стоила 45 бойцов за 52 секунды и дала 24 крестьянина - волна убивала, пока её не выбили; очередь base28/4 оборвалась при ЖИВОЙ армии (потери 2 -> 11, вдали осталось 55-58) и дала 13. Низкие потери при НЕ выросшей доле времени за 280 означают, что до крестьян не дошли, то есть провал, а не успех. Читать так: потери ниже базы + доля за 280 выше = взято; потери ниже + доля не выше = не дошли; (5) убито крестьян врага при наших рядом - ОСТОРОЖНО, планка против base28 берётся даром: у неё самой 0/3/0/14 настоящих убийств (starve_report), и любая идея её перебьёт. ЧЕГО НЕ СЧИТАТЬ ВООБЩЕ: «число волн за партию» против base28 НЕ СЧИТАЕТСЯ - в её трассах нет поля «поход» (0 из 62 записей), а счёт по t0 на одних данных давал 154 против 65, 10 против 14 и 21 против 37. Либо мерить волны только внутри идеи, либо брать бьющую базу. ЧЕГО НЕ ЖДАТЬ: симулятор щедрее к нам в бою у его базы, и «осада» в нём 0 — если и в игре удар не доходит до базы, идея хуже базы по цели, но лучше по размену; это тоже результат.
