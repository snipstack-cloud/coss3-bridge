[tier1]
что = ЯРУС 1: всё детерминированное одним ключом --tier1 — дебют скриптом (debut.py) до 20 бойцов, модель в это время молчит, дальше поддержание мостом (auto-seed, auto-train, auto-food). Стратегия (волны, апгрейды, вторая казарма) остаётся модели. ЗАЧЕМ: снять с облака решения, которые модель делает одинаково в каждой партии или хуже правила; в 52 трассах 22-24.09 первые пять минут одинаковы, TRAIN повторялся впустую в 89 процентах, BALANCE в 38 процентах не менял ничего. ПРОВЕРЕНО В СИМУЛЯТОРЕ (sim/tier1.py, 52 записанные партии, медианы ярус 1 / факт записи): первый боец 64 / 228 с, двадцатый на 264 с; на 600 с пехота 68 / 68, золото 5001 / 2536, еда 728 / 1626, крестьяне 39 / 51, дерево 43 / 764 (слабое место: правило раздаёт свободных на еду и золото, дерева не хватает); решений дебюта без облака 17 из 80 (21 процент). МЕРЫ, НАЗВАННЫЕ ДО ПРОГОНА: (1) вызовов облака за партию и стоимость партии — против ~60 и ~0,45 доллара у базы, ожидание 43-45 вызовов и ~0,32 доллара; (2) первый боец и двадцатый — против медиан базы 228 и 353 с; (3) простой первых 200 с — база 38-42 процента; (4) на 600 с: пехота, крестьяне, золото, дерево — не хуже базы, кроме дерева, за которым смотреть отдельно; ИГРОВЫЕ, для сверки: убито крестьян врага, три условия победы. ДЕНЬГИ 25.09: около $1,4; базу НЕ переснимать — четыре копии base28 от 24.09 лежат в результатах, все меры читаются по ним задним числом; три копии идеи ($1,35 по нынешней цене) влезают под любую цену, четыре — только если цена упадёт до $0,32. Три копии — наблюдение, не измерение, и это сказано заранее. ЧЕГО НЕ ЖДАТЬ: цели — стратегия та же, что у базы; ярус 1 про деньги и про дебют, не про удар.
итог = 3 КОПИИ 25.09 на мосту c365b83 против готовых четырёх копий base28 (24.09), условия совпали до числа, отличие флагов ровно одно. ВЗЯТО, размахи НЕ ПЕРЕСЕКАЮТСЯ: вызовов облака 42 (40/42/49) против 58 (54/58/58/59) при ожидании 43-45; первый боец 78 с (74/78/79) против 215 (180/188/242/243); двадцатый 164 с (162/164/170) против 326 (270/300/352/392) - вдвое быстрее и лучше обещанных симулятором 264. ЦЕНА: по вызовам 0,72, по токенам 0,73 - около 0,33 доллара за партию против 0,45, то есть предсказанные 0,32 с точностью до цента; три копии стоили около 1,0. ДВЕ МЕРЫ ОПРОВЕРГНУТЫ, И ОБЕ ПРО СИМУЛЯТОР: (1) планка простоя 38-42 процента НЕВЕРНА - это base27, посчитанный иначе, а у base28 простой первых 200 с равен 19,3; по настоящей базе ярус 1 простой не улучшает, а слегка ухудшает (22,7) при полном перекрытии размахов; (2) дерево названо слабым местом (43 против 764 в симуляторе), а в игре оно СИЛЬНОЕ - 1114 (656/1114/1540) против 590 (336/442/738/760), вдвое лучше базы, присмотра не требует. На 600 с пехота 83 против 78,5, крестьян 47 против 51,5, золото 2531 против 2385 - всё в разбросе. ИГРА: цель 0 из 3 против 0 из 4, настоящих убийств 0/0/1 против 0/3/0/14, волн 68 против 117 - на удар ярус 1 не влияет, и это обещано заранее. НАХОДКА ПРО МЕТОД, ДОРОЖЕ ДВУХ МЕР: меры дебюта у этой идеи НЕЛЬЗЯ считать по coss3_bot.jsonl - там только такты, где спрашивали облако, а ярус 1 в дебюте его не спрашивает; в отрезке 0-200 с у идеи два такта против семи у базы, первая запись стоит на gt 17 с уже готовыми 20 пехотинцами, и два такта подряд несут одно gt 168. Первый счёт дал «первый боец на 14 с, простой 0,0 процента» - числа, которых быть не может. Считать ТОЛЬКО по coss3_snap.jsonl, сетка 5 с. Разбор - разборы/ЯРУС1_ПРОТИВ_BASE28.md
