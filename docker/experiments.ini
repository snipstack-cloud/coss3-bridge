[base15]
что = первая точка отсчёта на НОВОЙ ЦЕЛИ: победа за 15 минут, у противника ноль крестьян (решение игрока 17.09, коммит 26a88bb). Убийство одного крестьянина стало ВЕХОЙ, партия на нём больше не обрывается - значит со всеми прежними сериями base9-base14 эта несравнима, они мерили другое число и обрывались на первой убыли. Мост с прошлой базы изменился четырежды: 1) голод ЗАЯВЛЕН словами движка (can_pea, can_inf, famine), но в живой игре 17.09 эти три поля в состояние НЕ ПОПАДАЮТ ни разу - код в установленном progress.inc стоит (строки 853-858), другие булевы поля тем же вызовом пишутся (human, map_open), а этих ключей в coss3_eco_P0.dat нет. Промпт при отсутствии поля молчит, так что модели не лжёт, но и голода словами движка она не увидит: считать эту правку работающей нельзя; 2) TRAIN больше не молчит - игра не берёт второй бесконечный заказ на того же юнита, и мост говорит ALREADY ORDERED (это чинит 89 процентов лишних заказов); 3) промпт сказал правду про цели ATTACK - к людям ведёт только peasants, а base и army одинаково идут к ЗДАНИЮ (block_hcmd.inc:970), из-за молчания модель отдала 1652 приказа по базе против 112 по крестьянам; 4) ИСПРАВЛЕН СТРАЖ ALREADY ORDERED, который глушил вторую казарму: он пропускал TRAIN без счёта, если бесконечный заказ стоял хоть в одном здании, а модель заказывает именно так - вторая казарма стояла пустой за 2500 золота. Замерено на живой игре 17.09: одна казарма даёт +21 бойца за 92 игровых секунды, две до правки +20, две после правки +42, то есть ровно вдвое. Это прямо бьёт в узкое место новой цели: армия врага к концу партии 159-252 против наших 43-88; 5) ОЧЕРЕДЬ КАЖДОЙ КАЗАРМЫ ВИДНА (поле ba_queues): раньше в состоянии стояло только их число, и пустая вторая казарма за 2500 золота была невидима. Проверено на живой игре 17.09: пока заказа нет - 1:none, после заказа 1:pikeman:inf, после постройки второй 1:pikeman:inf,2:none, а после повтора заказа 1:pikeman:inf,2:pikeman:inf. Промпт говорит прямо: пустая казарма никого не делает, отдай TRAIN ещё раз; 6) В ГОЛОД МОСТ НАЗЫВАЕТ РЫЧАГ, а не только беду: если еда ниже 500 и есть свободные крестьяне, он говорит «у тебя N свободных, а на еде M, BALANCE food N+M снимет порог быстрее всего». Повод: по 15 партиям прошлого захода в 70 процентах голодных тактов без дела стояли семеро крестьян по медиане; 7) ЕДА ИЩЕТСЯ ВОКРУГ МЕЛЬНИЦЫ, а не вокруг ратуши - как в самой игре (_ai_SendFreePeasantsToGainFood, радиус 30 от мельницы). До 17.09 мост искал в радиусе 40 от РАТУШИ, и если мельница стояла дальше, поле не попадало в список вовсе; 8) ПОЯВИЛСЯ БЛОК «ПОЛЕ ЕЩЁ ЗРЕЕТ»: поле после мельницы зреет около 105 секунд (замер по 15 партиям: мельница 64 с, первый человек на еде 170 с, разброс 83-127), и до этого BALANCE food не отправляет НИКОГО - незрелое поле не считается залежью, фильтр одинаков у моста и у игры. Мост теперь говорит, сколько ждать, и советует занять людей деревом и камнем. Повод: в окне 1:00-3:30 модель отдавала BALANCE food 94 раза за 100 тактов и получала ноль человек на еде; 9) появился блок «Удар идёт»: от момента подхода волны к базе считается гонка - крестьян у врага стало больше или меньше, его бойцов, наших в поле, и мост прямо говорит, что при растущей деревне врага такой волной до нуля не дойти. МЕРА, названа ДО прогона. Побед, скорее всего, будет ноль - планка поднята резко, поэтому мерим путь к ней, а не только исход: 1) МАКСИМАЛЬНАЯ ПРОСАДКА АРМИИ ВРАГА за партию, штук и процентов от его пика - главное число, потому что крестьян прикрывает армия и без её разгрома до нуля не дойти; 2) максимальная просадка его деревни (крестьян) за партию; 3) вех - партий, где убит хотя бы один крестьянин (у base14 это 16 из 47, но там партия на вехе кончалась, здесь продолжается); 4) тактов, когда волна стоит у базы врага, а его деревня РАСТЁТ - это прямой признак проигранной гонки, и блок «Удар идёт» должен его сократить; 5) доля приказов ATTACK с целью peasants (у base14 было 112 из 1764, то есть 6 процентов); 6) армия своя и вражеская на 10:00; 7) ПАРТИЙ СО ВТОРОЙ КАЗАРМОЙ и армия в них против партий с одной - теперь вторая казарма работает, и видно, догадается ли модель её поставить, увидев цену 2500 в build_cost. ПРЕЖНИЕ ТРИ ПАРТИИ base15/1 В СЧЁТ НЕ ИДУТ: они сыграны до правки стража, то есть в мире, где вторая казарма бесполезна. Счёт ведём с копии 13 (прежние заходы перечислены ниже): копия 1 сыграна до правки стража, копии 4-6 остановлены на девяти партиях ради правки очередей. Что показали те девять, чтобы не мерить заново: побед 0, просадка армии врага 0 во ВСЕХ партиях, наша армия 76 против 193 у врага, на 10:00 почти поровну (60 против 66), вторая казарма поставлена в 6 партиях из 9 и армии не прибавила, доля приказов ATTACK peasants те же 6 процентов. ЗАХОД НА КОПИЯХ 7-9 отыгран полностью, 15 партий: побед 0, ПРОСАДКА АРМИИ ВРАГА 0 ВО ВСЕХ ПЯТНАДЦАТИ, вехи в 4 партиях, наша армия 80 против 188 у врага, на 10:00 почти поровну (59 против 65), вторая казарма поставлена в 9 партиях из 15 и дала армию 81 против 73 - прибавка есть, но не удвоение, потому что еда под порогом одинаково часто (16 и 15 процентов тактов). Тактов с пустой казармой 4 по медиане - новая строка про очередь работает. Приказов ATTACK peasants 9 процентов против 6 у base14. Гипотеза: правда про цели и блок удара сократят бессмысленное стояние у базы, но просадки армии врага не дадут - для неё нужен кулак вчетверо больше нынешних 24 бойцов, и это уже следующая идея
