[auto_upgrade]
что = АПГРЕЙДЫ БЕРЁТ МОСТ — из отсечения обученной сети (мак, 27.09 вечер). ОТКУДА: четыре зерна обучения сошлись на двух решениях — присутствие в клетках с крестьянами без его бойцов и ПОКУПКА АПГРЕЙДОВ (45-168 раз за партию). Отсечение на 12 отложенных партиях разделило их: без присутствия убитых НОЛЬ (сеть без него падает до уровня скрипта, награда 1,75 против 6,07), а без апгрейдов убитых 60 вместо 79 при потерях 165 вместо 140. То есть апгрейды — вторая по величине прибавка, какую нашло обучение, и она не про бой, а про цену боя. ПОЧЕМУ КЛЮЧОМ, А НЕ ПОДСКАЗКОЙ: подсказкой это уже отыграно 15.09 (upgrades2) и ЗАПРЕЩЕНО к переносу — модель переключилась с набора армии на апгрейды, армия к 10:00 стала 14 против 44, найм мушкетёров 19 против 88, ATTACK 8 против 29. В симуляторе перекоса нет, потому что найм под сетью ведёт скрипт; в игре ту же роль должен играть мост. ЧТО ДЕЛАЕТ КЛЮЧ --auto-upgrade 500: в такт, где модель апгрейд не заказала, мост берёт САМЫЙ ВЫГОДНЫЙ военный апгрейд тем же счётом, которым эти ступени показываются модели (combat_math.окупаемость: прибавка, помноженная на число бойцов, кого она касается, делённая на цену), из тех, что показываются модели (апгрейды стоящих зданий для бойцов, кем воюем), если хватает по КАЖДОМУ ресурсу и золота остаётся не меньше 500 — цены казармы. ПОЧЕМУ НЕ «ПЕРВЫЙ ПО ПОРЯДКУ»: порог урона нелинейный (world.md, живая партия 19.09) — ступень атаки, не дотягивающая до его защиты, стоит тех же тысяч и даёт НОЛЬ, и линейка атаки по порядку могла бы покупать ноль. Счёт это видит сам: на стартовых числах (наш atk8 против его dpike3, 40 пикинёров) он берёт bar.pikeman.1.1 и размен по виду станет 0,83, а если враг возьмёт защиту (dpike7) — берёт ту же атаку, потому что там прибавка удваивает урон. Взятое и оплачиваемое не заказывается повторно (повторный заказ откатывает следующую ступень, замер 20.09), без цены в строке не покупается наугад. Ход модели этим не занят. Проверка selftest_auto_upgrade.py, 10 проверок, решение в чистой функции llm_policy.апгрейд_ключом. МЕХАНИЧЕСКАЯ МЕРА, ОБЯЗАНА СРАБОТАТЬ: в трассе вмешательства «UPGRADE ... ВЗЯТ МОСТОМ» больше нуля в каждой копии, и апгрейдов к концу партии больше, чем у базы. ГЛАВНЫЕ МЕРЫ (база food_floor): наши потери 241/23/64 — ждём НИЖЕ, это главное, что дают апгрейды по отсечению; убито крестьян 93/33/93 — ждём выше; размен 0,28/0,70/1,44 — ждём выше. КОНТРОЛЬНЫЕ, и они важнее целевых, потому что именно тут провалилась upgrades2: армия к 10:00 и бойцов к 300 с (база 18/18/25) — падения НЕ ждём, ключ не тратит ход модели и не должен мешать найму; золото к концу — ждём НИЖЕ базы, это признак, что деньги пошли в дело. ЧЕГО НЕ ЖДАТЬ: скачка по цели. Отсечение обещает четверть по убитым и шестую часть по потерям, а не победу.
итог = 3 КОПИИ 28.09 (мост f9308c3). МЕХАНИЧЕСКАЯ МЕРА ВЫПОЛНЕНА: вмешательств «UPGRADE ВЗЯТ МОСТОМ» 11 / 16 / 5, ключ покупает, а не молчит. НАЗВАННЫЕ ГЛАВНЫЕ МЕРЫ НЕ ВЫПОЛНЕНЫ: наши потери 103/50/4 против 241/23/64 у базы (медиана 50 против 64 — ниже, но размахи пересекаются, различения нет); убито его крестьян 56/49/30 против 93/33/93 — НИЖЕ, а ждали выше; размен 0,17/0,36/2,00 против 0,28/0,61/1,44 — по медиане НИЖЕ. Контрольные удержались: бойцов к 300 с 16/24/22 против 20/18/29, армия к 10:00 56/76/46 против 56/49/69 — найму ключ не помешал. Цель 1 из 3 в обоих плечах (победа на 7:56 у копии 3). ЗОЛОТО К КОНЦУ 11642/7140/1154 против 2020/1808/15808 — ждали НИЖЕ, вышло ВЫШЕ, и это объясняет остальное: узким местом была ЕДА (в двух копиях 0 при золоте 7-11 тысяч, в трассе «Еда на нуле, найм стоит»), а не золото, ради которого ключ и держит запас 500. СОСТАВ ПЕРЕВЕРНУЛСЯ: мушкетёров 0 и стрелков 0 во всех трёх против 13 и до 112 у базы, пехоты 271/160/45 против 38/49/158 — то есть случилось ровно то, чем провалилась подсказочная upgrades2, хотя ключ хода модели не занимает. НО ВЫВОД НЕЛЬЗЯ ЗАКРЫТЬ: сравнение СМЕШАННОЕ — база играла на мосту c677b26 (27.09), идея на f9308c3 (28.09), а между ними в строку `fighters`, которую ЧИТАЕТ МОДЕЛЬ, добавились члены dinit/dmgs/dmgp. Отличий два вместо одного. ЧТО ДЕЛАТЬ: переснять базу food_floor на f9308c3 тремя копиями и сравнить с этим плечом; до тех пор идея ни подтверждена, ни опровергнута. МАК 28.09, ПРИЧИНА НАЙДЕНА И ЭТО МОЯ ОШИБКА В КЛЮЧЕ: запас держался только по ЗОЛОТУ (500 на казарму), а военные апгрейды стоят И ЕДЫ — bar.pikeman.1.1 сто еды и сто пятьдесят золота, 2.1 двести и триста. За партию ключ купил 11/16/5 ступеней, то есть отвёл одну-три тысячи еды, и в двух копиях еда легла в ноль при 7-11 тысячах нетронутого золота — отсюда и «мушкетёров 0», и «еда на нуле, найм стоит». Добавлен запас еды 800 (у мака он звался иначе; Windows и мак нашли поломку в один час и починили порознь, при слиянии осталась одна реализация — с ключом --auto-upgrade-food, чтобы флаги идеи называли запас прямо) (500 порог остановки выпуска плюс 300 на шесть мушкетёров по 50), и отказ теперь называет оба запаса; три новые проверки в selftest_auto_upgrade.py, всего 14. Плечо надо переснять этим ключом ВМЕСТЕ с базой на одном мосту, как Windows и предложил.
