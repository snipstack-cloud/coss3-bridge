[home_defense]
что = ВСТРЕЧАТЬ ЕГО У СВОЕЙ БАЗЫ — задание симулятора (мак, 26.09), не идея для цели. ЗАЧЕМ: в архиве оборона у дома разменивает 0,63 его бойца за нашего против 0,41 у его базы, но записей обороны пять (Windows 26.09: debut4/2, smoke_local_schema/1, gather/2, base27/1, wave_march/3), и во всех к приходу его волны наша армия уже была потрачена у его базы — симулятор там разменивает хуже записи в четырёх из пяти и не может отличить, оборона ли это или остатки армии (§13д спецификации). Нужна партия, где армия СИДИТ ДОМА до его прихода: тогда оборона в записи и в симуляторе сравнима напрямую. ЧТО ДЕЛАЕТ: подсказка hints_home_defense.txt — до 10:00 ни ATTACK, ни MOVE; его бойцы в пяти клетках от ратуши — удар всей армией в их клетку; выбили — RETREAT и снова ждать; после 10:00 как обычно. МЕХАНИЧЕСКАЯ МЕРА, ОБЯЗАНА СРАБОТАТЬ: тактов с ATTACK/MOVE до 600 с — НОЛЬ (у base28 первая волна в 425–466 с), иначе идея не доехала. МЕРЫ ДО ПРОГОНА: (1) тактов с его бойцами в пяти клетках от нашей ратуши (frow) — у base28 по копиям посчитать тем же скриптом, ждём не меньше, а скорее больше: по no_gather видно, что чем сильнее давим, тем реже он ходит к нам; (2) РАЗМЕН ДОМА — его потери на нашу в снимках с клетками боя в пяти клетках от ратуши — архив 0,39–0,68, ждём около 0,6; (3) наших бойцов в клетках боя у дома — архив 30–38, ждём столько же или больше: армия цела; (4) пехота на 600 с — ждём выше base28 (там армия уже в поле). ЧЕГО НЕ ЖДАТЬ: убитых крестьян и цели — их здесь не мерим вовсе, это партия про размен, а не про цель. ЧТО СИМУЛЯТОРУ ДАСТ: калибровку боя у своей базы отдельно от боя у его базы и первую проверку, выходит ли праздная армия навстречу сама или только по приказу (по трассе: ATTACK cell перед боем или бой без приказа)
итог = 3 КОПИИ 25.09 на мосту 0f9b480 против четырёх копий base28. МЕХАНИЧЕСКАЯ МЕРА ПРОШЛА ИДЕАЛЬНО: ATTACK и MOVE до 600 с ноль во всех трёх, первый ATTACK на 605 / 604 / 607 с - модель выждала ровно до 10:00 с точностью в секунды (второе безупречное послушание подсказки подряд, после no_gather). НО ОБОРОНА НЕ СОСТОЯЛАСЬ ВОВСЕ, И ВИНОВАТО ОКНО, А НЕ МОДЕЛЬ. Тактов с его бойцами в пяти клетках от ратуши 4 / 0 / 0 против 9 / 1 / 0 / 0 у базы, то есть МЕНЬШЕ базы; и все четыре такта первой копии - на 1003, 1023, 1043, 1063 с, то есть ПОСЛЕ окна, в фазе обычной игры. В окне 0-600 с он не пришёл ни в одной копии. ПРИЧИНА НАЗВАНА ЧИСЛОМ: по 213 прогонам архива враг не доходил до пяти клеток от нашей ратуши раньше 637-й секунды НИ В ОДНОМ, медиана первого прихода 899 с. Окно до 600 с закрывалось за 37 секунд до самого раннего прихода за всю историю - замерить оборону им было нельзя по построению. Шанс хоть одной обороны на три копии: до 600 с 0 процентов, до 800 с 20, до 900 с 32, за всю партию 57. ПОБОЧНОЕ НАБЛЮДЕНИЕ, ОБРАТНОЕ ЗАМЫСЛУ: у base28, которая атакует нормально, он приходил в 2 копиях из 4 - вдвое чаще архивных 24 процентов, и в семи из девяти таких тактов в том же такте шёл НАШ УДАР. Похоже, его приводит наша агрессия, а не наше ожидание; связь не доказана. ДЕФЕКТ ДЕБЮТА, ЗАПИСАН ДО ИТОГОВ: в копии 1 казарма встала на 297 с - позже всех 13 сопоставимых копий архива (base28 максимум 187), из-за очерёдности траты золота, а не скудости; пехота на 600 с вышла 50 / 74 / 91 против 56 / 84 / 78 / 75 у базы, то есть НЕ выше, и у первой копии это про дебют. Размен дома посчитать нечем: 14 потерь на всё плечо. ПРОДОЛЖЕНИЕ - home_defense2. Разбор - разборы/HOME_DEFENSE.md
ref = master
флаги = --hints-extra hints_home_defense.txt --memo --world /io/world.md --critic /io/разбор.md --episodes 1
копий = 3
база = base28

[home_defense2]
что = ВТОРОЙ ЗАХОД ОБОРОНЫ, ЖДАТЬ БЕЗ СРОКА (решение игрока 26.09: «жди пока не придёт»). Замысел мака не тронут, убран только срок: не атаковать ВООБЩЕ, пока его бойцы не появятся в пяти клетках от ратуши, хоть всю партию; пришёл - бить ВСЕЙ армией в его клетку; выбили - RETREAT и снова ждать. ЗАЧЕМ УБРАН СРОК: в первом заходе окно было до 10:00, и оборона не состоялась ни разу - виновато окно, не модель. По 213 прогонам архива враг не доходил до пяти клеток от нашей ратуши раньше 637 с НИ В ОДНОМ, медиана первого прихода 899 с, окно до 600 с закрывалось за 37 секунд до самого раннего прихода за всю историю. Без срока работает вся партия: шанс прихода на копию 24,4 процента против 12,2 при окне до 900 с. ЧЕСТНОЕ ОЖИДАНИЕ, НАЗВАНО ДО ПРОГОНА: шанс хоть ОДНОЙ обороны на три копии 57 процентов, то есть успех чуть вероятнее провала, и партия без прихода - ЗАКОНОМЕРНЫЙ исход, а не брак; подсказка это модели прямо говорит, чтобы она не ударила от скуки. ЧЕМ ПЛАТИМ: фазы обычной игры нет вовсе, поэтому записей «выход волны из боя у его базы» это плечо маку НЕ даст - их даст no_gather или любое атакующее. В подсказку добавлена ОДНА строка против дефекта первого захода: казарму ставить первой. МЕРЫ: (1) механическая - ноль ATTACK и MOVE до первого его прихода, и ATTACK в том же такте или следующем ПОСЛЕ прихода; (2) тактов с его бойцами в пяти клетках от ратуши - в первом заходе 4/0/0 против 9/1/0/0 у базы; (3) размен дома, его потери на нашу в тех тактах: архив 0,39-0,68, ждём около 0,6, но считать ТОЛЬКО если потерь больше пятидесяти - в первом заходе их было 14 на всё плечо; (4) наших бойцов в тех клетках, архив 30-38, с оговоркой что сетка насыщается на 36 и это нижняя граница; (5) пехота к приходу рядом со временем казармы, иначе мера врёт про дебют. Убитых крестьян и цель НЕ мерим: партия про размен
итог = 3 КОПИИ 25.09 на мосту b685120 против архива обороны. ГЛАВНОЕ: РАЗМЕН ДОМА 2,93 (его потери 205 на наши 70) против архивных 0,39-0,68 и ожидания 0,6 - вчетверо-впятеро выгоднее, и РАЗМАХИ НЕ ПЕРЕСЕКАЮТСЯ (по копиям 4,04 и 2,31 против 0,39-0,68). ПРИЧИНА ВИДНА РЯДОМ И ПОДТВЕРЖДАЕТ ГИПОТЕЗУ МАКА: наших бойцов в клетке боя 92,5 / 109 / 97 против архивных 30-38, пехоты к приходу 145 / 156 / 269. То есть оборона не «стоит 0,6» - она стоит 0,6 ПОТРАЧЕННОЙ армией и 2,9 ЦЕЛОЙ, ровно как мак и предполагал («во всех записях к приходу его волны наша армия уже была потрачена у его базы»). ВРАГ ПРИШЁЛ ВО ВСЕХ ТРЁХ КОПИЯХ - на 1013 / 808 / 937 с, при предсказанных заранее 57 процентах на хотя бы одну; предсказание оказалось пессимистичным. Тактов с ним у нас 4 / 11 / 4 против 4 / 0 / 0 в первом заходе и 9 / 1 / 0 / 0 у base28. МЕХАНИЧЕСКАЯ МЕРА ПРОШЛА ТОЛЬКО В ОДНОЙ КОПИИ ИЗ ТРЁХ, и это надо знать: ATTACK до его прихода 2 / 0 / 4 (первый удар на 518 / 868 / 333 с). Послушалась целиком только копия 2 - она же дала 11 тактов обороны и чистый размен 2,31. Причина непослушания правдоподобна: у первых двух заходов был ПРОВЕРЯЕМЫЙ срок («до 10:00»), а «ждать, пока не придёт» срока не имеет, и держать это дольше десяти минут модель не смогла, хотя подсказка прямо велела не бить от скуки. ВАЖНО, ЧТО ЭТО НЕ ПОРТИТ ГЛАВНУЮ МЕРУ: условие, от которого она зависит, - ЦЕЛАЯ армия к приходу, - выполнилось во всех трёх (145 / 156 / 269 пехоты). Копия 3 пришедшего врага не била вовсе (потери 0/0 при четырёх тактах рядом), так что годных для размена копий две. ОГОВОРКА: сетка насыщается на 36, поэтому «пик 36» у копий 1 и 2 - нижняя граница, настоящий только 63 у копии 3. Разбор - разборы/HOME_DEFENSE.md
