[base14]
что = точка отсчёта на мосту 17.09. От base12 отличий ТРИ, поэтому сравнивать с ним нельзя и нужна своя база. 1) BALANCE перестал врать: единица — ЧЕЛОВЕК для еды, дерева и камня одинаково (промпт объявлял дерево и камень процентами с суммой 100, а блок читал то же число как людей); убрана фраза «берёт только простаивающих» (второй проход снимает с другого наземного ресурса с 12.09); убрано «повторять каждый такт» — у человеческого слота нет таблицы resbalance, возвращаться не к чему. Цена прежней лжи измерена на food_share: три команды BALANCE разом в 480 тактах из 614, и в 49 процентах тактов сумма запрошенного превышала всё население (108 человек при 19 крестьянах). 2) Плановая выполнимость: сколько бойцов оплачено сейчас и через 30, 60, 90 секунд, с вычетом порога еды 500, и какой ресурс держит. 3) Цена СЛЕДУЮЩЕЙ постройки полем build_cost: движок считает её с учётом costpercent=500, и вторая казарма приходит как 2500 золота против 500 за первую — подтверждено живой игрой 17.09. Контрольные числа: block_hstate 975, block_hcmd 995, progress.inc 2317, пульс снят 17.09. МЕРА, названа ДО прогона, в скобках base12 и food_share на 15 партиях каждая: 1) ДОЛЯ ТАКТОВ, ГДЕ СУММА BALANCE БОЛЬШЕ НАСЕЛЕНИЯ (49 процентов) — главное число, ради него вся правка, и оно должно рухнуть почти в ноль; 2) тактов с тремя командами BALANCE разом (480 из 614); 3) доля тактов с едой ниже 500 (38 процентов); 4) партий со второй казармой — теперь модель видит её цену числом; 5) первая волна (515 с у base12, 591 у food_share); 6) армия на 10:00 (48); 7) цель (5 из 15 у base12, 0 из 15 у food_share). Гипотеза: команды перестанут гонять крестьян между залежами, еда будет держаться, и казарма перестанет молчать — а вот дойдёт ли это до цели, прогон и покажет
