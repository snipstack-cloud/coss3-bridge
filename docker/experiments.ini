итог = 4 партии 22.09 ночью на мосту 49ae79f, фермой, все до горизонта, 206 тактов. КОНТРОЛЬ: мост и опыт сверены во всех копиях, условия balloon 2 cannons 1 capture 3, первый ход на 7-8 игровой секунде. ГЛАВНОЕ ЧИСЛО: тактов с ответом «УЖЕ ЗАЛОЖЕНО» 40 из 206 = 19 процентов против 31 у base25 и 23 у buy_wip (там работал один фильтр таблицы). Команд на повтор 44 из 612 = 7,2 процента против 10,7. Падение с 31 до 19 — это фильтр и сторож снимка вместе; на четырёх партиях оно уже вне шума (z=2,8, p около 0,006), но ТРЕТЬ тактов повтора осталась, и главная причина по-прежнему не найдена. СТОРОЖ УСТАРЕВШЕГО СНИМКА НЕ СРАБОТАЛ НИ РАЗУ за все четыре партии, как и за три прежние: за день семь контейнерных партий и ноль срабатываний, при том что в base25 откатов было девять на шесть партий. Отсюда два чтения, и выбрать между ними нечем: либо откаты редки и мы поймали полосу, либо сторож стоит не там. ПРОВЕРИТЬ ОТДЕЛЬНО. НОВЫЕ ВЕРДИКТЫ: ПОПРАВОК к «НИКТО НЕ ПОШЁЛ» вышло 9 на 206 тактов — ровно тот порядок, что предсказан по base25 (7 на 194), то есть каждый девятый вердикт ATTACK был ложным и теперь поправляется. «Ресурсов ХВАТАЕТ» вместо ложного «дело в ресурсах» — 7 раз. ЦЕНА АПГРЕЙДА НЕ БЫЛА НАЗВАНА НИ РАЗУ при 21 заказе — МОЙ ДЕФЕКТ: функция читала `upg_shown`, поля, которого в живом состоянии нет вовсе (его создаёт запись снимка в трассу). Починено в a83642d через combat_math.цены_апгрейдов по `upg_avail`; на снимках base26 цена нашлась бы в 20 случаях из 21. ЗНАЧИТ БАЗА СНЯТА С ДВУМЯ ДЕЙСТВУЮЩИМИ ПРАВКАМИ ИЗ ТРЁХ, и при сравнении это надо помнить. УРЕЗАНИЙ BALANCE 37 на 206 тактов = 18 процентов — впервые измерено вообще: в base25 счёт по трассе давал ложный ноль, потому что текст жил только в промпте. Каждый пятый такт модель просит больше людей, чем есть на земле. ПРОЧЕЕ ПРОТИВ base25: веха 3/4 против 4/4, но ВРЕМЕНА ЛУЧШЕ (271/305/337 против 329/333/442/584); волн [20,29,0,30] против [30,14,7,27]; еда ниже 500 медиана 18 процентов против 22; крестьян врага в конце [120,114,154,80] против [110,146,127,59]; стрелков своих ноль во всех восьми партиях обеих баз; конницы у врага 8 тактов против 0. Все эти сдвиги в пределах разброса четырёх партий и результатом не считаются — так и было сказано до прогона. КОПИЯ 3 ПРОВАЛЬНАЯ И ЗАКОННАЯ: казармы не было всю партию (ba17=0 до горизонта), ноль волн, ноль TRAIN, дерево в нуле, модель до конца сажала людей на дерево; шахту заказала на 824-й секунде против 79-171 у прочих. finish=горизонт, прогон честный — это разброс базы, а не сбой, и он показывает, чего стоит одна партия из четырёх. ДЕНЬГИ: прогон стоил около 1,7 доллара. ВНИМАНИЕ С 23.09: события УШЛИ ЛОКАЛЬНОЙ МОДЕЛИ НАВСЕГДА (COSS3_EVENT_MODEL и COSS3_EVENT_URL в ~/coss3.env, решение игрока). Эта база снята на ОБЛАЧНЫХ событиях, её флаги события не называют - значит перезапуск по тем же флагам сегодня дал бы ДРУГОЕ, а сравнивать с ней новые плечи НЕЛЬЗЯ: у них будет вторая разница. Базу снимать заново

[local_events]
что = СОБЫТИЯ УХОДЯТ В ЛОКАЛЬНУЮ МОДЕЛЬ на маке (qwen2.5:7b, 10.41.3.31), а не в облако. База base26, отличие ОДНО - адрес событийной модели. ВАЖНАЯ ОГОВОРКА О ЧЕСТНОСТИ СРАВНЕНИЯ: схема ответа на событийном вызове включается ровно тогда, когда событие уходит в локальную модель, поэтому «локальная модель» и «схема события» здесь НЕРАЗДЕЛИМЫ и составляют одну связку. Разделить их можно было бы только правкой моста, и тогда пришлось бы снимать базу заново; вместо этого связка названа целиком. Обычный такт идёт в облако, как и в базе. ЗАЧЕМ: события это 4,3 процента вызовов, и денег они почти не экономят - смысл во ВРЕМЕНИ. У облака по 13 событиям base25 и buy_wip медиана 1,5 с при хвосте 17,5, а событие думает ПАРАЛЛЕЛЬНО такту: двадцатисекундный хвост съедает такт целиком. Локальная по смоуку 22.09 (четыре события со схемой) дала медиану 2,2 с при максимуме 2,6. МЕРЫ, названные ДО прогона: (1) ГЛАВНАЯ - время событийного вызова: медиана и МАКСИМУМ, против облачных 1,5 и 17,5 по base25/buy_wip; выигрыш ожидается в хвосте, а не в медиане, и если максимум не упадёт - плечо не стоит ничего; (2) ГОДНОСТЬ - доля событий, чей ответ мост принял (rejected пусто и команда ушла): у облака 13 из 13, у локальной по смоуку 4 из 4; падение годности отменяет любой выигрыш во времени; (3) сколько событий на партию и их медианное время выпадения - контроль, что канал работает как в базе (у base26 2,2 события на партию, медиана 474 с); (4) КОНТРОЛЬ СВЯЗИ - сколько раз мост сказал «сервер не принял СХЕМУ СОБЫТИЯ» и сколько вызовов сорвалось вовсе: 22.09 ollama на маке дважды переставал слушать порт, и если это повторится, прогон надо считать негодным, а не медленным; (5) игровые меры как всегда, для контроля, что игра не изменилась: веха и времена (base26: 3/4, 271/305/337 с), волны на партию, TRAIN и UPGRADE, еда ниже 500 (медиана 18 процентов), тактов с «УЖЕ ЗАЛОЖЕНО» (19 процентов), урезаний BALANCE (18 процентов); (6) контроль партии: первый ход не позже 15 игровой секунды, условия по match.dat. ЧЕГО ЖДАТЬ НЕ СЛЕДУЕТ: событий на партию всего два-три, и по ним нельзя измерить ни цель, ни волны - любой сдвиг игровых мер на четырёх партиях это шум. Честный ожидаемый итог - «хвост срезан, годность та же, игра прежняя». МОДЕЛЬ ГРЕЮТ ДО СТАРТА (warm_local.py): первый вызов иначе платит загрузкой 4,7 ГБ, а keep_alive по умолчанию 5 минут при интервале между событиями около 5,3 минуты
