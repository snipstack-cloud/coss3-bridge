[wave_march]
что = «К ВОЛНЕ» БЕЗ МАРША ЗАВОДИТ МАРШ. Найдено 24.09 счётом по девяти партиям (base27, base28, debut4, gather, gather_resets и прочие 23-24.09), 1484 такта с атакой: марш заводится ТОЛЬКО от клетки сбора в контракте, а модель в 81 проценте приказов говорит target=wave, и в 971 случае из 1206 марша в этот миг НЕ БЫЛО. Мост находил своих в поле, брал их клетку и слал подкрепление туда простым движением - без сбора, порога, срока и удара. Войско текло струйкой, той самой цепочкой, из-за которой волны гибнут по одному; механика сбора включалась 0-1 раз за партию, и три плеча подряд (gather, gather_resets, планка) упёрлись в то, что мерить нечего. ПРАВКА (--wave-march 1): «к волне» без идущего марша получает клетку сбора = клетка волны и цель удара = ближайшая к ней клетка крестьян врага (если крестьян на карте не видно - клетка волны). Намерение модели не искажается: она просила идти к волне, туда люди и идут, только теперь сбором, а не струйкой. Отличие от base28 ровно одно - этот ключ; вмешательство пишется в трассу словами «заведён МАРШЕМ». ПРЕДСКАЗАНИЯ, НАЗВАННЫЕ ДО ПРОГОНА. (1) ГЛАВНАЯ МЕХАНИЧЕСКАЯ: МАРШЕЙ ЗА ПАРТИЮ - у base28 ноль в обеих копиях, у base27 два на четыре партии; здесь ожидается НЕСКОЛЬКО за партию, потому что первый же «к волне» без марша его заведёт, а следующие станут примыканием. Если маршей по-прежнему 0-1, ключ не сработал - смотреть число вмешательств «заведён МАРШЕМ». (2) СУДЬБА ПОХОДОВ: доля дошедших до удара, истёкших, зависших - впервые появится выборка, на которой это можно считать; предсказания по доле НЕТ, планка по умолчанию прежняя (2/3), а её дефект известен. (3) ГЛАВНАЯ ИГРОВАЯ: УБИТО КРЕСТЬЯН ВРАГА по счёту движка - у base28 6 и 7, у base27 42/37/7/35; и крестьян врага к концу (base28: 113 и 130). Сбор вместо струйки должен бить сильнее - но это гипотеза, и её проверяет прогон. (4) СВОИ ПОТЕРИ БОЙЦОВ по счёту движка (base28: 113 и 261) - собранный кулак должен терять меньше, чем струйка; если потери вырастут, сбор стоит у клетки и его там бьют. (5) веха и её время, цель. (6) контроль, что остальное не изменилось: простой по отрезкам (base28: 45,9/6,7/5,0 и 28,7/11,3/8,5), события и их время, первый ход не позже 15 с. ЧЕГО ЖДАТЬ НЕ СЛЕДУЕТ: две партии против двух - наблюдение; сдвиг вехи и цели на таком числе ничего не значит. Честный ожидаемый итог: «маршей стало много, походы кончаются хоть чем-то, а бьют ли они сильнее - решает следующая серия»
итог = 2 ПАРТИИ 24.09 на мосту aa0a1fd, обе до горизонта, 112 тактов. (1) МЕХАНИЧЕСКОЕ ПРЕДСКАЗАНИЕ ВЫПОЛНЕНО: вмешательство «заведён МАРШЕМ» сработало 9 и 3 раза, маршей за партию 5 и 3 против 0 и 0 у base28. Механика сбора впервые за проект включается несколько раз за партию - теперь планку и сбросы есть на чём мерить. (2) СУДЬБА ПОХОДОВ (8 маршей): до удара 3, истекло 0, ЗАВИСЛО 5. То есть больше половины походов не кончаются ничем - ровно та болезнь, которую нашёл мак (срок обнуляется подкреплением) и которую лечит --gather-resets; теперь её можно измерить, а раньше было не на чем. (3) ГЛАВНАЯ ИГРОВАЯ: УБИТО КРЕСТЬЯН ВРАГА 32 и 47 против 6 и 7 у base28 - в пять-семь раз; у base27 было 42/37/7/35, так что это возврат к лучшим партиям базы, а не прорыв за них. У врага к концу 64 и 115 против 113 и 130. (4) СВОИ ПОТЕРИ БОЙЦОВ 246 и 251 против 113 и 261 - не меньше, вопреки гипотезе «кулак теряет меньше струйки»: в первой копии вдвое больше. Похоже, сбор стоит у клетки волны и его там бьют, пока он не собрался; это согласуется с пятью зависшими походами. (5) веха в обеих. (6) КОНТРОЛЬ: события 3,6 и 4,9 с - здоровые; ПРОСТОЙ у первой копии вырос - 57,2 процента в дебюте и 16,6 за партию против 45,9/7,7 у base28, у второй 30,9/8,5 как у базы. Одна копия из двух - разброс, но записано. ВЫВОД: ключ делает ровно то, что обещал - походы есть, и есть первый серьёзный сдвиг по главному направлению, - но ДВЕ ПАРТИИ ПРОТИВ ДВУХ, и убитые крестьяне у base27 показывали такой же размах внутри одной базы (7 и 42). Как результат не засчитывать; как повод повторить четырьмя копиями - да, и это первое, на что стоит потратить остаток. И следом - gather_resets поверх этого ключа: теперь у него будет 8 походов на две партии вместо одного. ДЕНЬГИ: около 0,9 доллара
ДОПОЛНЕНО 24.09 ВЕЧЕРОМ, ЕЩЁ ТРИ КОПИИ (3-5), ИТОГО ПЯТЬ ПАРТИЙ на мосту f36534c. МЕХАНИКА ПОДТВЕРЖДЕНА НА ВСЕХ ПЯТИ = «заведён МАРШЕМ» 9/3/4/2/3 раза, маршей 5/3/2/3/2 (медиана 3) против 0 у base28 и 0-1 у base27. СУДЬБА 15 ПОХОДОВ: до удара 7, истекло 0, ЗАВИСЛО 8 - больше половины; истечений ноль потому, что срок обнуляется каждым подкреплением (находка мака), и это первая выборка, на которой gather_resets можно измерить по-настоящему. ИГРА - И ЗДЕСЬ ПОПРАВКА К ВЧЕРАШНЕМУ ВОСТОРГУ. Убито крестьян врага 32/47/14/19/21, медиана 21, за пять партий 133. Против base28 (6 и 7) это втрое, но base28 - две партии и слабая пара; против base27 (42/37/7/35, медиана 36, за четыре партии 121) - ТО ЖЕ САМОЕ или чуть хуже на партию (26,6 против 30). Крестьян врага к концу медиана 100 против 74 у base27 - хуже. Свои потери медиана 246 против 210 у base27 - не меньше. То есть «впятеро больше» вчера было сравнением с неудачной парой, а не сдвигом: ПО ИГРЕ ПЛЕЧО НА УРОВНЕ base27, НЕ ВЫШЕ. Что реально изменилось - походы теперь ЕСТЬ, и их можно лечить; что не изменилось - результат боя. ОТКРЫТЫЙ ВОПРОС ВАЖНЕЕ ПЛЕЧА: base28 (две копии, три правки промпта) убила 6 и 7 крестьян там, где base27 убивала 42/37/7/35. Либо это разброс двух партий, либо одна из трёх правок (вердикт, деление потолка, закрытие направления) ударила по бою. Пока это не разведено, любое плечо против base28 будет выглядеть лучше, чем оно есть. ПЕРВЫМ ДЕЛОМ - ДОСНЯТЬ base28 ДО ЧЕТЫРЁХ КОПИЙ (~0,9 доллара), и только потом мерить дальше. ДЕНЬГИ: три копии около 1,3 доллара, остаток около 4,5
ПОСЛЕ ДОСЪЁМКИ base28 (4 копии, медиана убитых 7) = против СВОЕЙ базы плечо втрое сильнее по убитым крестьянам (медиана 21 против 7) и это уже не «слабая пара», а четыре партии. Против base27 - по-прежнему на уровне. Значит ключ возвращает бой к уровню base27, который база base28 почему-то потеряла; что именно потеряно и вернул ли ключ то же самое - не ясно, пока не разведены три правки между base27 и base28
