итог = НЕ ЗАПУСКАТЬ, ОТМЕНЕНА 17.09 ДО ПРОГОНА. Проверка по 15 партиям base15 и трём партиям нового захода показала, что идея проверяла бы УЖЕ СДЕЛАННОЕ. Мельницу модель закладывает В ТОТ ЖЕ ТАКТ, когда достраивается ратуша (32/12/53 с при готовности ратуши 32/30/53), а однажды и раньше, параллельно. Ратушу закладывает на 5-й секунде (разброс 4-11) и отдаёт на неё ВСЕХ 18 крестьян; готова она на 27-й, сама стройка 21 с - это время игры, а не решение модели. Из цепочки ратуша -> мельница -> 40 с стройки -> 105 с созревания поля модель управляет ОДНИМ звеном и управляет им верно. Второе поле заранее посеять тоже нельзя: SEED засевает уже СОБРАННЫЙ участок (со слов игрока). Вывод: стартовый голод подсказкой не лечится, он структурный. Лечится он тем, что мост говорит, сколько ждать - тогда мёртвые команды BALANCE food (94 за 100 тактов) превращаются в работу по дереву и камню (стало 14-17 за партию)

[aim_peasants]
что = мост переводит ATTACK с base и army на peasants и говорит об этом вслух. ОТЛИЧИЕ ОТ base15 РОВНО ОДНО - ключ --aim-peasants. Зачем: победа считается по крестьянам врага, а base и army одинаково ведут волну к ЗДАНИЮ (block_hcmd.inc:970, `if (hatrg <> 'peasants') and (haeb)`), и даже цель по умолчанию в питоне - base. За 47 партий base14 модель отдала 1652 приказа по базе против 112 по крестьянам. 17.09 в промпт добавили прямую правду о том, куда ведёт каждая цель, - доля выросла лишь с 6 до 9 процентов за два прогона подряд. Значит словами это не чинится, и проверяем принуждением: мост правит цель и печатает «ATTACK N -> base ПЕРЕВЕДЁН МОСТОМ на peasants». МЕРА, названа ДО прогона, в скобках base15 на 15 партиях: 1) ПРОСАДКА ДЕРЕВНИ ВРАГА за партию, штук - главное число, потому что победа это ноль крестьян; 2) вех, то есть партий хотя бы с одним убитым крестьянином (4 из 15); 3) тактов, когда волна стоит у базы при РАСТУЩЕЙ деревне врага (4 по медиане, и все при растущей); 4) просадка армии врага (0 во всех 15) - не ждём сдвига, но следим; 5) наша армия максимум (80); 6) побед (0). Гипотеза: волна, приведённая к людям, начнёт убивать крестьян - вехи вырастут, просадка деревни станет ненулевой. Чего НЕ ждём: побед. Чтобы свести деревню к нулю, надо пережить армию в 188 бойцов, а это другой вопрос
