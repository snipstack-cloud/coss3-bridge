[verdict]
что = МОСТ ПЕРЕСТАЛ ГОВОРИТЬ «ОТПРАВЛЕНО» ТАМ, ГДЕ ИГРА ОТКАЗАЛА. Найдено 23.09 разбором дебюта base27, где простой съедает 44,5 процента труда за первые 200 секунд (дальше 6-7). Цепочка: на 90 с модель шлёт 16 человек на еду, игра отказывает словами GATHER res0 no deposit of this kind within 40 (поля не засеяны), а мост в итоге прошлого решения говорит «BALANCE  16: отправлено, проверить нечем» - и следующие четыре такта на еде стоит НОЛЬ при двенадцати свободных. Две правки в одном: (1) имя направления бралось из СЫРОГО поля ответа модели и выходило ПУСТЫМ, поэтому вердикт не попадал ни в одну проверку - ни «нет мельницы», ни счёт людей; теперь роль берётся из разбора, который сводит синонимы и числа; (2) если число людей не изменилось, а игра отказала, вердикт называет отказ словами игры. ЭТО ПРАВКА ПРОМПТА: она меняет то, что модель слышит каждый такт, поэтому сравнивать с base27 можно только с оговоркой. ОДНА ПАРТИЯ - ПРОБА, решение игрока: денег в обрез. МЕРЫ, НАЗВАННЫЕ ДО ПРОГОНА. КОНТРОЛЬ ПРАВКИ (он же первый вопрос): (1) есть ли в трассе строки «BALANCE food N» С ИМЕНЕМ - у base27 их не было вовсе, там стояло пустое место; (2) сколько раз сказано «НЕ СРАБОТАЛО, игра отказала». Если оба числа нули - правка не доехала, и дальше смотреть нечего. ГЛАВНАЯ: (3) доля крестьяно-секунд простоя за первые 200 с - у base27 44,5 процента по четырём партиям; (4) на какой секунде первый человек встаёт на еду - у копии 1 base27 это 158 с при мельнице, готовой на 90-й. ПРОЧЕЕ: (5) простой за партию целиком (base27: 14,3 процента); (6) веха и её время; (7) событий на партию и их время. ЧЕГО ЖДАТЬ НЕ СЛЕДУЕТ: одна партия ничего не доказывает, и разброс дебюта не мерен. Смотреть надо, СЛЫШИТ ЛИ модель отказ и меняет ли после него поведение - это видно и на одной
итог = ПРОБА, ОСТАНОВЛЕНА ИГРОКОМ на 381 игровой секунде (19 тактов), мост 334c5b7, одна копия. ПЕРВАЯ ПОЛОВИНА ПРАВКИ ПОДТВЕРЖДЕНА: вердиктов С ИМЕНЕМ направления 13 против НУЛЯ у base27 - роль доходит до разбора, и проверки, которые от неё зависят (нет мельницы, счёт людей), снова работают. ВТОРАЯ ПОЛОВИНА НЕ ПРОВЕРЕНА: «игра отказала» ноль раз - ветка срабатывает только при отказе GATHER, а его за эти 19 тактов не случилось. Это НЕ «работает» и не «не работает», это «случая не было»; чтобы проверить, нужен дебют, где модель шлёт людей на еду до засева - у base27 такое было на 90-104 с. ПРОСТОЙ: за первые 200 с 26,3 процента против 44,5 у base27 (четыре партии), за всё отыгранное 14,3 против 14,3 за партию у базы. То есть дебют выглядит вдвое чище, а дальше всё как было - но ОДНА ПАРТИЯ ПРОТИВ ЧЕТЫРЁХ, разброс дебюта не мерен вовсе, и сравнивать эти числа как результат НЕЛЬЗЯ. Первый человек на еде на 176 с против 158 у базы, то есть по этой мере ЧУТЬ ХУЖЕ. ЧЕСТНЫЙ ВЫВОД: правка доехала и делает то, что должна; польза не измерена. ДЕНЬГИ: проба стоила около 0,3 доллара, остаток около 9,5
