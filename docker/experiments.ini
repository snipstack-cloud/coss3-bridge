[hunt2]
что = ОХОТА, ПОЧИНЕННАЯ ДВАЖДЫ — возврат волны и порог перевеса (мак, 27.09 вечер). ОТКУДА: плечо hunt_peasants замысел НЕ ПРОВЕРИЛО. По снимкам ключ отдал ОДИН приказ за партию (разных клеток охоты 1/1/1, смен цели 0/0/0), а модель в тех же партиях отдала 28/34/31 своих ATTACK и увела волну. Приказ модели важнее, и это правильно, но мост ждал, пока КЛЕТКА ОПУСТЕЕТ, а крестьяне в ней были всю партию — условие не наступало никогда. Поэтому разница по крестьянам (125/17/66 против 65/1/18) была разбросом копий, а не следствием охоты, и механическая мера «поле охота в 119/168/166 снимках» была ЛОЖНОЙ: поле ставится раз и дальше лежит в каждом снимке. ЧТО ПОЧИНЕНО, две правки в одном ключе (обе про одно — чтобы охота действительно шла): (1) ВОЗВРАТ — приказ повторяется и когда волна не в клетке охоты, а не только когда клетка опустела; возвраты считаются отдельным счётчиком; (2) ПОРОГ ПЕРЕВЕСА 0,75 — клетка, где его бойцов рядом больше 0,75 от наших вдали, отбрасывается совсем, и отказ говорится вслух. Порог из замера по 81 записи: бой у его базы при перевесе в клетке меньше 0,75 даёт размен 0,13-0,26, в полосе 1,5-3 — 0,85-1,34. На единственном приказе прошлого плеча мера уже сработала: копия 3 повела 16 бойцов туда, где его бойцов рядом было девять. Проверки: selftest_hunt_return.py (9) плюс прежние 19 в selftest_hunt_peasants.py целы, всего 79 тестов. МЕХАНИЧЕСКАЯ МЕРА, ОБЯЗАНА СРАБОТАТЬ, и она НЕ «поле есть»: приказов охоты (смен целевой клетки) за партию БОЛЬШЕ ОДНОГО в каждой копии — считает разбор_охоты.py, у hunt_peasants там 1/1/1, у food_floor 0. ГЛАВНАЯ МЕРА: его крестьян к концу ниже 65/1/18 (база food_floor) и доля снимков, где наши в клетке с его крестьянами, выше 137/27/147. КОНТРОЛЬНЫЕ: наши потери 241/23/64 и размен 0,28/0,70/1,44 — ухудшения не ждём; приказов в клетку с перевесом меньше 0,75 ждём НОЛЬ (у hunt_peasants 1 из 2 с контактом). ЧЕГО НЕ ЖДАТЬ: что охота заменит дебют. Партию решают 20 бойцов к 300 с, а охота — только эндшпиль, добор последних 15-20 крестьян.
