рую разницу. Плечо против этой базы: --event-model qwen2.5:7b --event-base-url http://10.41.3.31:11434/v1, и мера у него не «цель», а ВРЕМЯ - события это 4,3 процента вызовов (9 из 207), денег они почти не экономят, зато у облака хвост до 20,3 с на событии, а событие идёт параллельно такту

