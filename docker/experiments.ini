итог = ОТЫГРАНА 19.09 вечером, 3 копии по 3 партии (в скобках base18, 6 партий). Цель 0 из 9 (0 из 6). Волн 2,9 на партию (6,5) - ВДВОЕ МЕНЬШЕ, но ПОТЕРИ НА ВОЛНУ 4,2 против 22,3, впятеро ниже. Волн при набеге 9 из 26, то есть 35 процентов (24 из 39, 62) - источник потерь сократился почти вдвое, но НЕ исчез: прежняя запись «0 из 26» была ошибкой чтения, строка инструмента относилась к семи волнам с перевесом, а не ко всем. РАЗДЕЛЬНО (поправка 19.09 вечером): вылазок 11, потерь 0,0 на волну, обе вехи; оборон 14, потерь 7,8 на волну, вех 0 - удары не дороги, их МАЛО. Вердикт есть у 7 вылазок из 11, а не у 7 из 26: у обороны вердикта нет и быть не может. За партию: наших гибнет 27 против 53, размен серии 0,17 против 0,08, армия к концу 132 против 108. Мера (1) отрицательна: ШАНС 0 за 1131 клетку и на новой формуле - окна нет из-за расстояния, а не из-за формулы. Мера (3): потолок перевеса 1,90 -> 3,00, медиана и доля клеток за порогом почти не изменились. ОГОВОРКА КОНТРОЛЯ: отличий от base18 два, а не одно - кроме формулы между мостами лежит 2e0b4a6 (вердикт волны по wave_sent), и «НИКТО НЕ ПОШЁЛ» звучал 7 раз в базе против 0 здесь. Полный разбор - WORKLOG, «разбор серии assess_local целиком». Волн с вердиктом 7: ВСЕ вердикт «можно», ВСЕ в режиме УДАР, потерь 0,0 на волну, вех 2. Вех всего 2 против 1, то есть 0,22 на партию против 0,17. МЕРЫ: (1) ШАНС не выпал НИ РАЗУ за 1131 клетку - ветка жива в тестах, но её окно (мы первые И подмога успевает за +30 с) в игре не встречается: наш подход медиана 102 с против его 20 с; (2) доля волн с вердиктом 7 из 26, исход - дошла 1, вех 2, потерь 0; (3) перевес медиана 0,67 максимум 3,00 (0,49 и 1,85 у старой формулы); (4) подмога успевает 100 процентов - «встретит = вся армия» осталось, но теперь это ПОСЧИТАННЫЙ факт, а не артефакт центра масс; (5) режимы почти не изменились: КОПИТЬ 72 (66), ОПАСНОСТЬ 21 (26), УДАР 5 (5), ПЕРЕХВАТ 2 (2). Итог: формула режимы не двигает, но модель СТАЛА ИХ СЛУШАТЬСЯ - в base18 волны шли и в КОПИТЬ/ОПАСНОСТЬ, здесь все оценённые волны в УДАР. 14 волн ушли в клетки ВНЕ оценённых мостом шести - это следующий вопрос. ОСТОРОЖНО: 9 против 6 партий, вехи 2 против 1 - наблюдение, не измерение

[via_rally]
что = клетка сбора (via) при каждом ударе по клетке, НА ПОЧИНЕННОМ УСЛОВИИ СБОРА. ВНИМАНИЕ, отличий от базы ТРИ, и это осознанно: (а) дописка hints_via.txt, (б) починка условия сбора 19.09 (коммит 27852f3) - дошедшие считаются приростом над теми, кто стоял у клетки изначально, сбор закрывается по доле 2/3 посланных или при иссякшем притоке с половиной; (в) сбор, назначенный В САМОЙ ЦЕЛИ, больше не принимается молча (коммит cdd84b6) - мост говорит вслух и идёт обычным ударом без сбора: в первом заходе via_rally такой марш из 59 бойцов дал «дошли 0 из 39» за 120 с при mil_hurt 41, а три марша со сбором в стороне собрались все. Разделять их незачем: на мосту базы via заказан лишь в 5 волнах из 26, и починку не на чем разглядеть - дописка даёт объём маршей, починка делает их осмысленными. Эффекты разделимы при разборе: доля волн со сбором - это дописка, доля маршей, дошедших до удара, и доля кулака в миг удара - это починка. Откуда взялось: в assess_local единственный собравшийся марш привёл кулак ЦЕЛИКОМ (21 из 21, удар через 96 с) и потерял ноль, второй ударил ЧЕТВЕРТЬЮ (40 из 154, сбор засчитан ложно при wave_n=1), два истекли. МЕРЫ, названные ДО прогона (в скобках assess_local, 9 партий): (1) доля волн с клеткой сбора - было 5 из 26; (2) доля маршей, дошедших до фазы «удар» - было 2 из 5, истекли 2; (3) доля кулака в миг удара - было 100 и 26 процентов, ложных сборов быть не должно ВОВСЕ; (4) дошедших волн (mil_far>=180) 1 из 26, вех 2, потерь на волну 4,2; (5) контроль: волн на партию 2,9, цель 0 из 9. ПРИЗНАК ВРЕДА: доля волн со сбором выросла, а доля дошедших до удара упала - значит сбор съедает волны, и порог 2/3 слишком строг
