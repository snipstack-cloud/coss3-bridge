что = BUILDERS N добирает до N с наземной добычи (ветка idea/builders-topup, block_hcmd.inc 1160): раньше второй проход шёл только при нуле свободных, и казарма строилась 2-4 из 20, конюшня 2-3 из 18 (серии barracks_now, dragoons). ОТЛИЧИЕ ОТ base17 РОВНО ОДНО - эта правка блока. МЕРА, названа ДО прогона, в скобках base17 (12 партий): 1) строителей на второй казарме и время от заказа до готовности (медиана 2 строителя, готова 10:35) - главное; 2) время первой казармы; 3) армия на 10:00 (76) и к концу (94); 4) падения крестьян врага (2,5), вех (0). Гипотеза: стройки встают в 2-3 раза быстрее, вторая казарма к 9-й минуте; на цель само по себе не повлияет
