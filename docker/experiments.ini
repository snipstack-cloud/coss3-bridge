[free_peasants]
что = ПРИСУТСТВИЕ У КРЕСТЬЯН В СТОРОНЕ ОТ ЕГО АРМИИ — найдено симулятором 27.09 (§13и спецификации). ОТКУДА: перебор 58 планов «сначала армия» (§13г) и два стратега (§13б, 13в) упёрлись в одно — его армия стоит у базы с крестьянами и связывает наших; закон убийств k·min(наших − его, крестьян) там даёт ноль. Стратег с целью «крестьяне без армии» (клетка с крестьянами, в окне которой нет его бойцов, и обход таких клеток при преследовании) на отложенных 16 партиях: убито медиана 52 против 20 у команд записи, потери 156 против 170, ступень 3 (10 убитых при наших рядом) 38 % против 21–26 у прежних стратегов, ступень 6 (осада) 21 % против 0, ступень 8 (два условия победы) 6 %; побед в симуляторе 5 из 48. Ступень 7 (его крестьян < 20) те же 25 % — он донанимает. Стратегия сети: 8 решений из 15 апгрейд атаки, 7 — присутствие у свободных крестьян. ЧТО ДЕЛАЕТ: подсказка hints_free_peasants.txt — апгрейды 1.1–1.2, потом постоянное присутствие в клетке с крестьянами без его бойцов, досылки в волну, без такой клетки ждать. МЕРЫ ДО ПРОГОНА: (1) доля тактов с нашими в клетке его крестьян (no_gather 41/57/14 %, base28 0–25) — ждём не ниже no_gather; (2) доля тактов боя, где в клетке нет его бойцов (по cells/бой) — механическая, должна вырасти против no_gather, иначе модель не выбирала клетки как велено; (3) убито крестьян без голода — база no_gather 117/95/5; (4) потери — ждём НИЖЕ no_gather при том же присутствии, это и есть смысл идеи; (5) осада (наших у его базы > 50 после 7:00) — симулятор обещает 21 %, в архиве 7–12. ЧЕГО НЕ ЖДАТЬ: его крестьян < 20 — симулятор этого не даёт, он донанимает. База — no_gather (ближайшая по замыслу), не base28
итог = 3 КОПИИ 26.09 на мосту e0ccd43 против трёх копий no_gather (bed4de0). ИДЕЯ НЕ ДОЕХАЛА: механическая мера (2) не выросла - клеток с нашими у его крестьян 32/11/16 против 174/213/34, из них БЕЗ его бойцов 38/0/0 % против 40/15/9. Значит плохие числа по остальным мерам план симулятора НЕ опровергают. Убито крестьян без голода 0/1/35 против 117/95/5; наши потери 220/247/227 против 173/232/174 (ждали НИЖЕ); осада 11/0/10 % против 29/29/9 при обещанных 21. ЧЕРЕЗ ЧТО НЕ ДОЕХАЛА, размахи НЕ ПЕРЕСЕКАЮТСЯ: первая волна 600/321/457 с против 277/278/276 у базы, и снимков после 200 с, где вдали НИКОГО, 44/17/29 % против 12/13/13. Армия ЖДАЛА: подсказка идеи «без такой клетки - жди» сложилась с подтверждённой hints_human.txt «бью только когда наберётся перевес». Когда выходила - встречала АРМИЮ: в клетке боя наших медиана 13 против его 38 (у базы 8 против 7), перевес 0,45 против 1,00, в меньшинстве 82 % боёв против 57, его бойцов убито 48/16/54 против 183/156/96. Второй провал - состав: стрелков 15/0/2 против 44/54/19, а 25.09 показано, что убийства требуют И присутствия, И стрелков. Клетку модель почти не называет: цели ATTACK - cell 1-2, wave (досылка) 10-23, peasants НИ РАЗУ (у базы cell 2-3 и peasants 3/2/3). ОГОВОРКА: мосты разные, и с 26.09 клетка показывает числа до 61 буквами, а строка промпта про потолок перестала врать («срезана на девяти» при срезе 36) - модель идеи видела более крупные числа врага. Развести мост и подсказку может только новый прогон no_gather на текущем мосту. Разбор - разборы/FREE_PEASANTS_ПРОТИВ_NO_GATHER.md ДОПОЛНЕНИЕ МАКА 27.09 (симулятор): вывод Windows принят — идея НЕ ОПРОВЕРГНУТА, а не доехала, и первая волна 600/321/457 с против 277/278/276 это доказывает. Но счёт по сеткам показал, куда вообще можно было идти: клетка с его крестьянами, в окне 3x3 которой НЕТ его бойцов, существует лишь в 3-9 процентах тактов (free_peasants 6, no_gather 3, home_defense2 9) и лежит в 12-14 клетках от нас, у его базы. То есть цель «крестьяне без его бойцов» редка и в живой игре, и правило окном 3x3 подсказкой не передаётся (это и Windows заметил по целям ATTACK) — проверять его надо ключом, как --no-gather. ЗАОДНО СЕРИЯ НАШЛА ОШИБКУ СИМУЛЯТОРА: в нём та же цель находила свободную клетку в 32 процентах тактов против 6 по записям — ложный ноль, на тактах БЕЗ сетки frow (27-29 процентов) отсутствие сетки читалось как отсутствие врага. Починено (§13н): стало 5 и 2 процента, и стратег, который «бил лучше записи», убивает 20 вместо 52 — его перевес держался на этой ошибке и на невосполняемом враге (§13м)
