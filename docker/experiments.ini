что = мельницу сразу после ратуши. Замер по 15 партиям base15: ратуша готова на 27-й секунде, мельница только на 64-й, поле после неё зреет ещё около 105 секунд (разброс 83-127), и первый крестьянин встаёт на еду на 170-й. Выход из голода - 207-я секунда. Всё это время еда ниже 500, а значит НЕ ИДЁТ НИКАКОЙ наём: ни крестьян, ни бойцов. Механика проверена и по коду, и живой игрой: незрелое поле не считается залежью, его отбрасывает и наш мост, и родной ИИ игры одинаковым фильтром, поэтому BALANCE food до созревания не отправляет никого - в окне 1:00-3:30 модель отдала эту команду 94 раза за 100 тактов и получила ноль человек на еде. ОТЛИЧИЕ ОТ base15 РОВНО ОДНО - дописка hints_mill_first.txt. МЕРА, названа ДО прогона, в скобках base15 на 15 партиях: 1) ВРЕМЯ ГОТОВНОСТИ МЕЛЬНИЦЫ (64 с) - главное число; 2) время, когда первый крестьянин встал на еду (170 с); 3) время выхода еды выше 500 (207 с); 4) доля тактов под порогом еды (16 процентов); 5) армия максимум (80); 6) просадка армии врага (0 во всех 15). Гипотеза: мельница встанет на 40-45-й секунде, выход из голода сдвинется на те же 20 секунд, и в освободившиеся такты пойдёт наём. Чего НЕ ждём: просадки армии врага - она упирается не в экономику, и если она сдвинется, значит мы чего-то не понимаем в связке
