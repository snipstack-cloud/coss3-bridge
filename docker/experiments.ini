[home_first]
что = до десятой минуты к врагу не ходить: копить кулак дома из мушкетёров и бить только того, кто пришёл, а после 10:00 идти маршем с клеткой сбора. ОТЛИЧИЕ ОТ base15 РОВНО ОДНО - дописка hints_home_first.txt. Основание: по 30 партиям все убитые враги убиты у нашей базы, размен дома 0,67 против 0,19 в походе; живая партия 17.09 - при 58 мушкетёрах дома размен 15 к 5; пять живых партий 18.09 - каждая волна к базе врага до 10:00 погибла целиком без единого убитого крестьянина. МЕРА, названа ДО прогона, в скобках base15: 1) волн к врагу до 10:00 - главное число (в base15 первая волна 5:30-8:00 всегда); 2) просадка армии врага суммой падений (0 во всех 15); 3) наши потери в первом набеге врага на базу; 4) армия на 10:00 (59) и состав - доля стрелков; 5) армия к концу; 6) вех и убитых крестьян. ОГОВОРКА О ЧИСТОТЕ: base15 играна на мосту 17.09 с порогом волны 20, а с 18.09 порог снят, добавлены блок набега, честная сетка, конюшня, RETREAT и марш - разниц не одна, и по числу волн сравнивать с base15 нельзя; нужна новая база на этом мосту, тогда сравнение станет чистым. Гипотеза: волн до 10:00 не будет, первый набег врага обойдётся дешевле, просадка армии врага впервые станет больше нуля, армия к концу вырастет
