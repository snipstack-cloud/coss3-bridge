что = МЕХАНИЧЕСКИЕ КОМАНДЫ СТАВИТ МОСТ, а не модель (ключи --auto-seed 1 --auto-builders 10 --auto-train 1, все три по умолчанию выключены). Повод - счёт по 734 тактам четырёх серий 20.09: из ответа модели BALANCE 49 процентов, TRAIN 17, BUILD 11, BUILDERS 8, UPGRADE 7, SEED 6, ATTACK 2, и три из них решения почти не несут. SEED: 188 приказов, 98 процентов отданы при УЖЕ созревших участках, 38 процентов повторены в пределах 25 с, каждое поле стоит 5 золота. BUILDERS: 26 приказов без BUILD в том же такте пропали впустую (блок читает потолок только вместе с закладкой), 54 закладки ушли с потолком по умолчанию 3, от которого котлован собирался из 2-5 человек при 20 свободных. TRAIN: 99 процентов это бесконечный заказ, и в 4 процентах тактов с едой выше порога крестьян не куёт никто. ВНИМАНИЕ, ОТЛИЧИЙ ОТ base21 ТРИ, и это осознанно - все три об одном (механическая команда без решения), а порознь каждая слишком мелка, чтобы разглядеть её на четырёх партиях; ключи раздельные, и если серия даст эффект, плечи разводятся следующим прогоном. МЕРЫ, названные ДО прогона, в скобках base21 (4 партии, мост 54dd7db - СТАРЕЕ базы, числа только как ориентир): 1) доля тактов, где мост вмешался, и чем именно - главное, это проверка что правила вообще срабатывают; 2) SEED: сколько их всего за партию (было 26 на партию) и сколько при нулевых готовых участках; 3) строителей на закладке, медиана (было 12) и время второй казармы; 4) тактов с едой выше 500 и пустой очередью крестьян (было 4 процента); 5) контроль: цель, вехи, волн за партию, армия к концу, просадка армии врага, конница. ПРИЗНАК ВРЕДА: строителей на закладке выросло, а время второй казармы не упало - значит потолок 10 срывает людей с добычи
