итог = ОТЫГРАНА 19.09 вечером, 3 копии по 3 партии (в скобках base18, 6 партий). Цель 0 из 9 (0 из 6). Волн 2,9 на партию (6,5) - ВДВОЕ МЕНЬШЕ, но ПОТЕРИ НА ВОЛНУ 4,2 против 22,3, впятеро ниже. Волн при набеге 0 из 26 (23 из 39) - исчез главный источник потерь, на который приходилось 79 процентов убыли. Волн с вердиктом 7: ВСЕ вердикт «можно», ВСЕ в режиме УДАР, потерь 0,0 на волну, вех 2. Вех всего 2 против 1, то есть 0,22 на партию против 0,17. МЕРЫ: (1) ШАНС не выпал НИ РАЗУ за 1131 клетку - ветка жива в тестах, но её окно (мы первые И подмога успевает за +30 с) в игре не встречается: наш подход медиана 102 с против его 20 с; (2) доля волн с вердиктом 7 из 26, исход - дошла 1, вех 2, потерь 0; (3) перевес медиана 0,67 максимум 3,00 (0,49 и 1,85 у старой формулы); (4) подмога успевает 100 процентов - «встретит = вся армия» осталось, но теперь это ПОСЧИТАННЫЙ факт, а не артефакт центра масс; (5) режимы почти не изменились: КОПИТЬ 72 (66), ОПАСНОСТЬ 21 (26), УДАР 5 (5), ПЕРЕХВАТ 2 (2). Итог: формула режимы не двигает, но модель СТАЛА ИХ СЛУШАТЬСЯ - в base18 волны шли и в КОПИТЬ/ОПАСНОСТЬ, здесь все оценённые волны в УДАР. 14 волн ушли в клетки ВНЕ оценённых мостом шести - это следующий вопрос. ОСТОРОЖНО: 9 против 6 партий, вехи 2 против 1 - наблюдение, не измерение
