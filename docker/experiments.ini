[formation]
что = ЗАКРЫТА ДО ПРОГОНА РЕШЕНИЕМ ИГРОКА 27.09, идея была ОБХОДОМ ПРАВИЛ. Замысел был: строй без академии, потому что живая игра (wood_academy) показала офицеров на 537-й и 584-й секунде при незаказанной академии, а в коде (country.script:3051) офицер и барабанщик производятся КАЗАРМОЙ и лишь требуют академию (req0 = aca) — требование проверяет _player_CheckAccessControlRequirements, мимо которой мост зовёт _unit_ProduceUnit напрямую. Игрок решил: «нельзя обходить правила, без академии барабанщика и офицера не построить». Человек за тем же экраном кнопку найма не видит, значит это обход, и правила запрещают ДЕЙСТВИЕ, а не только способ его отдать. ЧТО СДЕЛАНО ВМЕСТО ПРОГОНА: мост отвергает TRAIN officer17 и drummer17 без построенной академии ВСЛУХ, с причиной («сначала BUILD academi»), стережёт selftest_officer_needs_academy.py; строка промпта про строй теперь называет академию обязательной; симулятор вернул требование академии (sim/sim.py, НАЙМ_РОЛИ). ЧТО ЭТО СТОИТ: строй дорожает с 150 золота и 30 железа до 1050 дерева и 1230 камня плюс время, и включается не к 214-й секунде, а к 519-й; размен в симуляторе 0,54 против 0,63 у запрещённого пути — всё ещё вдвое лучше, чем без строя (0,24), так что ветка со строем остаётся живой, но идёт через академию (см. wood_academy)
