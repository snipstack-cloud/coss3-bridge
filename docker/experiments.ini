флаги = --opening-search 1 --opening-goal 1 --opening-scout 1 --opening-seed 12345 --opening-horizon 600 --opening-attempts 3 --opening-repeat 3 --opening-strict 1
копий = 1
база = нет, это разведка

[wave]
что = СТУПЕНЬ 1 ПРОВЕРКИ БЫСТРОГО СТАРТА - РАЗМЕР ВОЛНЫ ПРОТИВ ВРЕМЕНИ ПРИХОДА, без модели. Разведка (ступень 0, тот же сид) показала: у врага НЕТ НИ ОДНОГО бойца до 317 с, его крестьяне стоят без охраны в клетках (12,3)/(13,3)/(12,2), девять-десять клеток от нас, ход пехоты 90-100 с. Скриптовый дебют до N бойцов (N=20 на 138 с, 10 на 92), и как только N готовы - все уходят в лучшую клетку его крестьян без охраны (target=cell). Перебор: 20, 10, 15, 5 в клетку, потом 20 и 10 к ближайшему крестьянину (target=peasants), потом соседи лучшего по размеру. МЕРЫ как у проекта: веха (его крестьян меньше стартовых после волны), ПОБЕДА (ноль крестьян), плюс секунда прихода, его армия при приходе, оценка убитых по падениям счётчика, наши потери. ВНИМАНИЕ: сид блок NEW не читает, карта и базы в каждой партии свои (первая волна ушла в (2,1) за 156 с, разведка видела (12,3) за 90) - поэтому КАЖДОЕ сочетание играется трижды и ход до цели пишется в строку. Первый запуск 14:00 дал ложную победу на 148-й: недописанный файл состояния читался нулями; починено часовым victory. ВТОРОЙ ЗАПУСК 14:06, первая честная партия: волна дошла на 292-й (ход 10 клеток занял 150 с, а не 100), его армии там 0, снято 8 крестьян по падениям, но веха не взята (он нанимает быстрее) и к 250-й наши начали умирать от ГОЛОДА - еда 1000 кончается к 230-й при 20 пикинёрах. Поэтому --opening-eco 1: мельница в параллель с кузницей четырьмя свободными, после казармы четверо на дерево и трое на камень, шахта после казармы, на еду шестеро, как поле созрело. ПЕРВАЯ ПАРТИЯ СО СЧЁТОМ ДВИЖКА (ab8b9cb, 20.09 18:30 WSL): волна 20 ушла на 143-й, дошла на 353-й, к 479-й по gPlayer.stat.killed у него погибло 37 крестьян и 17 бойцов, у нас 5; его армия 13 -> 3, наши 20 живы, его крестьян 10 и падает - горизонт 480 оборвал партию на полпути к победе. Старый счётчик показывал «убито 29» и веху на 299-й вместо 236-й. Поэтому горизонт 900: победа = ноль его крестьян, и её надо увидеть
