что = ТОЧКА ОТСЧЁТА на мосту с ИСПРАВЛЕННЫМ world.md. Нужна потому, что base22 играла со СТАРЫМ описанием мира, а 20.09 в нём починено число, которое модель читала каждый такт: «враг восполняет 15,9 бойца в минуту против наших 4,4» (замер 17.09 по parallel_start, 15 партий) заменено на «12,3 против 13,1» (замер по 4 партиям base21) - темпы сравнялись, и прежнее число говорило модели, что копить заведомо проигрышно, когда это уже не так. Туда же добавлены две записи, которых не было: мы не успеваем НИ В ОДНУ его клетку (наш подход 100 с против 20 с у его подкрепления, медленнее в 4,5 раза, клетки где успеваем - 0 из 152 тактов) и что скоростью этот разрыв не закрыть (конница дала бы 1,75 по константам движка, и даже это догадка - присваивания objbase.speed закомментированы). world.md уходит модели через /io/world.md, значит ЛЮБОЕ сравнение со старой базой теперь незаконно - это ровно та вторая разница, что погубила stage_num. КОД МОСТА при этом не менялся: промпт отрисован на 209 состояниях base21 на прежней метке и на новой со всеми ключами по умолчанию и совпал ДОСЛОВНО. МЕРЫ (в скобках base22, 2 партии, тот же горизонт 1200): (1) вехи и ЦЕЛЬ (0 из 2) - главная; (2) волн на партию (8 и 4) и доля волн в клетку (все); (3) армия к пику (132 и 115) и к концу (пехота 118/26, стрелки 2/28), просадка армии врага (48 и 15); (4) режимы за такт, доля КОПИТЬ (в base21 было 152 из 198); (5) апгрейдов (19 и 20) и TRAIN (35 и 36); (6) STAGE по полям stage/stage_on (5 и 5); (7) конюшня и конница к концу (конюшня в обеих, конницы 0); (8) крестьяне свои и врага к концу. ОТДЕЛЬНО, не мера, а то, ради чего правка: изменится ли доля тактов КОПИТЬ и число волн теперь, когда модель больше не считает накопление заведомо проигрышным. ВНИМАНИЕ: base22 отыграна всего по одной партии на копию, поэтому её числа - слабая опора; при расхождении вдвое это ещё не эффект
