# Идеи для проверки на сервере. Одна секция — одна идея.
#
# Смысл фермы: мастер-мост живёт и правится на Windows, а сюда приезжает через
# git уже проверенная там версия. Идея = ветка/коммит моста плюс набор флагов.
# Десять копий дают десять партий одновременно, и мастер при этом не простаивает.
#
# Поля:
#   что     — человеческое описание, попадёт в отчёт
#   ref     — ветка, тег или SHA моста в git. master = то, что уже на мастере
#   флаги   — что дописать к llm_policy.py
#   копий   — сколько контейнеров поднять (можно перебить ключом --copies)
#   база    — id идеи, с которой сравнивать в отчёте (обычно baseline)

[baseline]
что = как на мастере сейчас: порог волны 20, такт 20 с
ref = master
флаги =
копий = 10

[wave40]
что = порог волны 40 вместо 20 — бить реже, но вдвое большей силой
ref = master
флаги = --wave-min 40
копий = 10
база = baseline

[wave0]
что = порога нет вовсе — проверить, что он вообще что-то даёт
ref = master
флаги = --wave-min 0
копий = 10
база = baseline

[tick10]
что = решение раз в 10 игровых секунд вместо 20 — вдвое больше ходов
ref = master
флаги = --every 10
копий = 10
база = baseline

# Пример идеи, которая живёт в ВЕТКЕ моста, а не во флаге: код правится на
# Windows, ветка пушится, здесь указывается её имя. Пересборка образа не нужна.
# [formations]
# что = построения через _player_SetSquadFormation
# ref = idea/formations
# флаги =
# копий = 10
# база = baseline


[builders_max]
что = пока ратуши нет — всех, кто влезет, на её стройку (идея игрока 13.09: партия начинается с centers=0, а бот ставил ратушу тремя строителями из восемнадцати при котловане на двенадцать)
ref = master
флаги = --builders-first 99
копий = 3
база = baseline

[builders_hint]
что = то же, что builders_max, но БЕЗ подмены команды: модели сказано, что в котлован ратуши влезает до двенадцати строителей, решает она сама
ref = master
флаги = --hints-extra hints_builders.txt
копий = 3
база = baseline

[history15]
что = окно истории 15 прошлых ходов вместо 5: переписки с моделью нет, память ей собирает мост, и пять тактов стояли с начала проекта никем не проверенные
ref = master
флаги = --history 15
копий = 3
база = baseline

[history0]
что = истории нет вовсе: проверить, даёт ли она хоть что-нибудь. Если разницы с базой нет, пять строк в каждом запросе тратятся впустую
ref = master
флаги = --history 0
копий = 3
база = baseline

[historyall]
что = вся история партии в контексте: все такты, а не последние пять. Замер 13.09: добавляет ~1900 токенов к запросу (обстановка 630 -> 2570)
ref = master
флаги = --history 999
копий = 3
база = baseline

[barracks2]
что = сказать модели, что казарма делает юнитов по одному и нужна вторая. За восемь прогонов она дошла до этого сама один раз, а в прогоне на Windows потратила на поиск причины десять тактов из сорока пяти
ref = master
флаги = --hints-extra hints_barracks.txt
копий = 3
база = baseline

[questions]
что = канал вопросов: модель может задать человеку ОДИН вопрос за партию, ответы копятся в world.md и уходят в промпт всем следующим партиям. Первая серия меряется не временем волны, а тем, О ЧЁМ она спрашивает: до сих пор описание мира на человеческом слоте не содержало ни карты, ни залежей, и сказать об этом модели было нечем
ref = master
флаги = --world /io/world.md
копий = 3
база = baseline

[questions5]
что = канал вопросов на коротких партиях: обрыв на 5:00 и сразу новая. За то же время партий втрое больше, а вопрос модель задаёт по одному на партию. Цель не меняется, модели про отрезок сказано прямо. Мера — не время волны, а список вопросов
ref = master
флаги = --world /io/world.md --stop-at 300 --episodes 4
копий = 3
база = baseline

[questions10]
что = канал вопросов на отрезке 10:00 вместо 5:00. Пять минут кончались до первой волны (она уходит 5:49-7:58), и спрашивать про бой было неоткуда; на десяти волна есть всегда, а цель берётся впритык — 5 из 8 прогонов брали её в 9:13-10:59. Знания о мире (порог еды 500, залежи) уже в world.md
ref = master
флаги = --world /io/world.md --stop-at 600 --episodes 3
копий = 3
база = baseline

[memo]
что = дневник партии вместо протокола ходов: вехи построек со временем, неудачи без повторов, исходы волн («ушло 22, наших 22 -> 9, крестьян врага 31 -> 31 — НИ ОДНОГО НЕ УБИЛИ»). Человек помнит структуру, а не сорок пять своих кликов; полная история ходов замером 13.09 оказалась вредна (первая волна 10:01 против 5:49-7:58)
ref = master
флаги = --memo
копий = 3
база = baseline

[fair]
что = честная игра: мост перестаёт подсказывать то, чего человек не видит — точное число крестьян и зданий противника каждый такт и расстояние до него он знает сквозь туман войны, а человек не знает никогда. В трассе и в проверке цели числа остаются, из запроса уходят. Правило игрока 13.09: не давать модели больше, чем есть у человека
ref = master
флаги = --fair
копий = 3
база = baseline

[base_open]
что = новая точка отсчёта: открытая карта (монгольфьер всем), полные 15 минут, без канала вопросов и без дневника. Все прежние прогоны шли с ТУМАНОМ и для сравнения с открытой картой негодны — это другая игра
ref = master
флаги =
копий = 3
база =

[questions12]
что = канал вопросов на отрезке 12:00. Десять минут обрезали цель: первая волна приходит в среднем на 7:22, а до убитого крестьянина от неё ещё около трёх минут — 9 партий из 9 кончились ничем. Двенадцать покрывают цель (у базы она бралась в 9:13-10:59)
ref = master
флаги = --world /io/world.md --stop-at 720 --episodes 3
копий = 3
база = base_open

[tempo]
что = сказать модели, что волна без убитых — потерянные бойцы, и перед новой смотреть итог прошлой. Замер 13.09 на шести копиях: цель взяла та, что послала 41 бойца двумя волнами, а пятеро слили по 200 бойцов шестью-семью и не убили никого. Подсказкой, не подменой команды — решает модель
ref = master
флаги = --hints-extra hints_tempo.txt
копий = 3
база = base_open
