[critic_forward]
что = замкнуть петлю критика: его гипотеза возвращается в СЛЕДУЮЩУЮ партию как задание на проверку, вместе с тем числом, которым он сам предложил её мерить. Спросил игрок 17.09: «если предлагаешь - почему не пробуешь?». До сих пор разбор уходил в файл, который читает только человек: за 16 партий base14 критик назвал 16 узких мест, семь раз подряд одно и то же (производство бойцов), и в игре от этого не менялось НИЧЕГО. Отличие от base14 РОВНО ОДНО - флаг --critic-forward. Подаётся как гипотеза, а не как правило: модель вправе не согласиться и сказать об этом в stuck. В трассе пишется поле critic_hyp, так что партии с гипотезой и без неё различимы. МЕРА, названа ДО прогона, в скобках base14 на 17 живых партиях: 1) доля партий, где модель ВЫПОЛНИЛА проверку критика (её число достигнуто) - главное, раньше это было неизмеримо; 2) повторяет ли критик одно узкое место подряд (в base14 семь раз производство бойцов); 3) цель (4 из 17); 4) армия максимум (71); 5) доля лишних TRAIN (89 процентов). Гипотеза: петля даст модели проверяемую задачу и снизит долю повторов у критика; на цель может не повлиять вовсе - это шестой подряд случай, когда механика двигается, а цель нет
