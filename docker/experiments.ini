[two_barracks]
что = ставить вторую казарму, когда накоплено 2500 золота. ОТЛИЧИЕ ОТ base15 РОВНО ОДНО - дописка hints_two_barracks.txt. Основание измерено дважды. Первое: замер на живой игре 17.09 - одна казарма даёт +21 бойца за 92 игровых секунды, две +42, ровно вдвое; до правки стража ALREADY ORDERED вторая казарма стояла пустой и давала +20, то есть ничего. Второе: живая партия того же дня, отыгранная целиком. На 10:00 наша армия 72 против 60 у врага - МЫ ВЕЛИ. Потом три волны (11, 34, 32 бойца) погибли, и к концу стало 22 против 148. В конце партии лежало 27 000 еды, 2 455 золота и 3 437 железа при армии 22, казарма была ОДНА, очередь всю партию 1:pikeman:inf, мушкетёров заказано ноль. То есть проигрыш идёт не от бедности, а от невозможности восполнить потери: казарма делает по одному за раз, а волна уносит тридцать. Цену второй казармы модель видит числом в build_cost с 17.09, очередь по казармам - тоже, но решения не принимает. МЕРА, названа ДО прогона, в скобках base15 на 15 партиях: 1) ПАРТИЙ СО ВТОРОЙ КАЗАРМОЙ - главное число (9 из 15, но там она ещё не работала из-за стража); 2) время постройки второй казармы; 3) армия на 10:00 (59); 4) армия к концу партии; 5) просадка армии врага (0 во всех 15); 6) вех (4 из 15). ОГОВОРКА О ЧИСТОТЕ: base15 отыграна на более раннем мосту, с тех пор добавлены поиск еды у мельницы, блок созревания, food_ready, пустые шахты и координатная цель. Значит в сравнении не одна разница, и по экономическим мерам судить нельзя - только по казарме и армии. Гипотеза: вторая казарма появится раньше и чаще, армия к концу вырастет, но просадки армии врага по-прежнему не будет - для неё нужен другой состав войска, а не их число
