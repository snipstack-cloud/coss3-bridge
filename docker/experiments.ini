[food_floor]
что = ПОРОГ ЕДЫ КЛЮЧОМ — ответ маку на просьбу Windows 27.09 «держать двадцать бойцов к 300 с ключом, а не подсказкой». ПОЧЕМУ ИМЕННО ЕДА, а не золото и не заказ: в серии early_push победу от двух худших копий того же плеча отделили 25 бойцов к 300 с против 12 и 13, и по трассам видно, что держал их НЕ заказ и НЕ казарма. Заказ TRAIN -1 стоял во всех трёх копиях (по 5-9 раз до 320 с), казарма встала на 132/159/164 с — а население стояло на 22 ровно те такты, когда еда была 219-291, и двинулось, лишь когда перевалило 500: победная копия имела еду 482 к 164 с, 797 к 194 с, 1226 к 240 с и 63 человека к 318 с; копии 1 и 3 — еду 227-285 до 209 с и 45-46 человек к 318 с. Порог 500 — механика движка (ниже него выпуск остановлен, а TRAIN -1 при этом цел, world.md), то есть срок, а сроки подсказкой не доезжают — четвёртый случай подряд. ЧТО ИДЕЯ ДЕЛАЕТ: ключ --food-floor 800 — до 300-й секунды, пока бойцов меньше двадцати и еда ниже 800, мост сам ставит две трети крестьян на еду и говорит об этом ВСЛУХ с числами (проверка selftest_food_floor.py, 10 проверок; чистая функция llm_policy.еда_порогом). Две трети — то же число, что у яруса 1 симулятора, где оно даёт 23 бойца к 300 с. Своя команда модели BALANCE food важнее: если модель отдала её сама, мост не спорит. ЭТО ОДНА РАЗНИЦА ПРОТИВ БАЗЫ early_push: те же подсказки и те же ключи плюс --food-floor 800. МЕХАНИЧЕСКАЯ МЕРА, ОБЯЗАНА СРАБОТАТЬ, иначе идея не доехала: в трассе есть «BALANCE food ... ПОСТАВЛЕН МОСТОМ» хотя бы раз до 300 с в каждой копии, и еда НИ В ОДНОМ такте до 300 с не ниже 500 (у базы 219-291 держались по 60-80 секунд). ГЛАВНАЯ МЕРА: бойцов к 300 с не меньше 20 во всех трёх копиях (база early_push 12/25/13, база no_gather256 11/16/1). ЦЕЛЕВАЯ: finish win хотя бы в одной копии (у early_push 1 из 3, и это наблюдение, а не измерение — плечо нужно и для повтора победы). КОНТРОЛЬНЫЕ: наши потери, база 262/22/196 — роста не ждём; размен, база 0,11/0,45/0,24; население к 318 с, база 45/63/46 — ждём выше 60 везде. ЧЕГО НЕ ЖДАТЬ: голода у врага. Он опровергнут механизмом на той же серии — при резне крестьян еда врага РАСТЁТ (в победной копии 0 на 240 с -> 5953 на 420 с -> 7347 на 542 с при крестьянах 23 -> 1), потому что еду едят крестьяне и бойцы. Ломается у него армия, а не еда: 8 в победной копии против 13-39 в остальных.
итог = 3 КОПИИ 27.09 на карте 256 (мост c677b26): ДЕБЮТ СТАЛ ПОВТОРЯЕМЫМ, ЦЕЛЬ ВЗЯТА ВТОРОЙ РАЗ ПОДРЯД. Ключ делает обещанное: на еде к 240 с 14-17 человек из 24-27 (две трети), еда к тому же мигу 853 / 1514 / 973 против 411 / 1226 / 531 у early_push. ПОЛ АРМИИ ПОДНЯЛСЯ: бойцов к 300 с 18 / 18 / 25 против 12 / 25 / 13 у early_push и 11 / 16 / 1 у базы — порог двадцать взяла одна копия, но худшая теперь 18, а не 11. ПЕРВАЯ ВОЛНА 243 / 263 / 240 с — раньше любого прежнего плеча и одинаково во всех трёх; этого срока четыре серии добивались подсказками и не добились. ИСХОДЫ: копия 2 — win на 575 с при потерях 23 против 16; копия 3 цель не взяла, но выглядит сильнее победной — размен 1,44 (лучшее число проекта на 256), его армия к концу 0, убито 93 крестьянина, наших потерь 64 при армии 269, не хватило добить последних 18 крестьян; копия 1 — единственная, где дебют доехал, а бой проигран (размен 0,28, его армия 181). УЗКОЕ МЕСТО ПЕРЕЕХАЛО В ЭНДШПИЛЬ: после разгрома его армии остаётся охота за рассыпанными крестьянами, и её никто не ведёт — волна стоит там, где добила последнего. ЧТО ДАЛЬШЕ: (1) поднять порог до 1000-1200 и посмотреть на 20 бойцов — самый дешёвый шаг; (2) эндшпиль делать КЛЮЧОМ (вести волну по клеткам с крестьянами, пока они есть), потому что процедуры подсказкой не переносятся; (3) две победы на шесть копий двух плеч — не случайность, но и не измерение, нужен повтор. Разбор - разборы/FOOD_FLOOR_ПРОТИВ_EARLY_PUSH.md
