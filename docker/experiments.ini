флаги = --memo --world /io/world.md --critic /io/разбор.md --episodes 8
копий = 2
база = base12

[one_barracks]
что = не строить вторую казарму, пока первая простаивает. Гипотезу подсказал критик 16.09 («узкое место золото»), но причину он назвал неверно - шахту. Разбор его же партии: золото 5000 -> 1458, из них первая казарма 500 на 141-й секунде и ВТОРАЯ 2500 на 189-й, а весь найм крестьян за партию - около 99. Цена из данных игры: costpercent = 500 (unit.script:2472), каждая следующая казарма впятеро дороже. При этом по base11 и base12 казарма простаивает две трети тактов из-за еды, то есть вторая не добавляет бойцов, а золото вынимает. ОТЛИЧИЕ ОТ base13 РОВНО ОДНО - дописка hints_one_barracks.txt. НЕ ПУТАТЬ с gold_first2 (отыграна 15.09, опровергнута): та двигала ДОБЫЧУ золота раньше, эта трогает РАСХОД. ДОПИСКА ИЗМЕНЕНА против варианта с мака от 16.09: убрана ссылка на строку «движок говорит: на пехотинца НЕ ХВАТАЕТ», потому что поля can_pea, can_inf и famine живут в коммите 6388e7c, который под метку не попал и в игре не собирался - на этом мосту модель искала бы строку, которой нет. Довод про цену казармы сохранён целиком. МЕРА, названа ДО прогона, в скобках base12 на 15 партиях: 1) партий со второй казармой - главное число, должно упасть; 2) минимум золота за партию; 3) доля тактов с заказом бойцов при готовой казарме (43 процента); 4) армия максимум (43); 5) цель (5 из 15). Гипотеза: вторая казарма не влияет на армию вовсе, а сэкономленные 2500 золота видны в апгрейдах и найме
