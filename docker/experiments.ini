[wood_academy2]
что = ПОВТОР wood_academy НА ПОЧИНЕННОМ МОСТУ — та же идея, исправлены ДВЕ лжи промпта, обе найдены первым прогоном. (1) Windows 27.09: строка про строй была одинаковой при нуле офицеров и при пятерых («нужны ОБА»), и модель с пятью офицерами и пятью барабанщиками писала в уроках «офицер и барабанщик не вышли» — FORMATION не отдан ни разу за три копии, хотя в копиях 2 и 3 оба стояли с 536-й и 580-й секунды, и тактов после этого было 26 и 25; теперь готовность называется готовностью, стережёт selftest_formation_ready.py. (2) Мак 27.09: та же строка звала нанимать офицера «в казарме и в академии», а по решению игрока офицер и барабанщик — ТОЛЬКО после академии (движок отдаёт их и без неё, но это обход правил, world.md [игрок]); мост теперь отвергает такой найм вслух, стережёт selftest_officer_needs_academy.py. ЧТО ПРОВЕРЯЕМ: ту же связку дерево -> академия -> офицер и барабанщик -> FORMATION, но теперь у модели есть правдивое описание мира. МЕХАНИЧЕСКАЯ МЕРА, РАДИ КОТОРОЙ ПОВТОР: squads в снимке больше нуля хотя бы в одной копии — в первом заходе ноль измеренный, и это была вина моста. МЕРЫ: (1) время включения строя — ждём раньше 700 с (в первом заходе офицеры были с 531-537 с, значит FORMATION мог уйти сразу); (2) РАЗМЕН, его потери на нашу: первый заход 0,25 / 0,21 / 0,34, база no_gather 1,06 / 0,67 / 0,55 — ждём выше первого захода; про базу судить нельзя, пока строя не было; (3) наши потери — первый заход 149 в медиане против 174 у базы, ждём не выше; (4) академия построена — в первом заходе взята во всех трёх (931 / 593 / 539 с), ждём того же или раньше. ЧЕГО НЕ ЖДАТЬ: убитых крестьян больше базы (первый заход 42/43/33 против 117/95/5) — академия крадёт время у первого удара, это цена, названная заранее. ЕСЛИ СТРОЙ СНОВА НЕ УЙДЁТ: вина не в замысле и не в промпте, а в самой команде FORMATION в блоке — тогда следующий шаг проверять её отдельно, ручной командой в живой партии
ОТ WINDOWS (27.09) = в флаги добавлен --no-gather 1 — он есть у базы wood_academy, без него разниц против неё было бы две вместо одной. ЧЕСТНО О РАЗНИЦАХ: против первого захода их всё равно ДВЕ, и обе смотрят в одну сторону — правдивая строка готовности строя в промпте и новый абзац подсказки («когда офицер и барабанщик уже есть, не заказывай их снова, отдай FORMATION тем же ходом»). Значит серия отвечает на вопрос «собирается ли строй вообще», а не «что именно помогло»: разводить их отдельным прогоном смысла нет, обе правки — исправление лжи, а не выбор поведения. Третья правка (найм офицера только после академии) делает мир СТРОЖЕ, чем в первом заходе, и может сдвинуть сроки: в первом заходе копия 2 получила офицера на 531-й секунде БЕЗ академии, теперь такой найм отвергается вслух — значит строй не может включиться раньше академии, и мера (1) «раньше 700 с» проверяется уже при этом ограничении
итог = ПРОГОН 27.09 ИЗМЕРИЛ ДЕФЕКТ, А НЕ ИДЕЮ — гнать заново. Ворота «офицер только после академии» читали st.get('academi'), то есть РОЛЬ заказа, а ключ состояния зовётся academies (block_hstate.inc:465, СЧЁТЧИК['academi']). Условие было истинным ВСЕГДА: найм отвергался и при стоящей академии — отказов «НЕЛЬЗЯ БЕЗ АКАДЕМИИ» 18 / 25 / 14 при академии с 597 / 610 / 872 с, TRAIN officer17 не дошёл до игры НИ РАЗУ, FORMATION не отдан, squads = 0. Модель делала всё правильно и говорила вслух «заказываю офицера и барабанщика (академия уже стоит) под строй». Второе место с тем же ключом: llm_policy.py:5038 — мост считал академию непостроенной и предлагал строить её снова (заказов BUILD academi после постройки 4 / 6 / 2). ПОЧЕМУ НЕ ПОЙМАЛ ТЕСТ: selftest_officer_needs_academy.py ставил в мок ту же роль academi, что читал код, — мок повторял ошибку кода и потому проходил. Правлено в обоих местах через СЧЁТЧИК, тест ставит ключ блока, добавлены проверка «роль вместо ключа академией не считается» и СТАТИЧЕСКАЯ страховка на весь класс: ни одна роль, чьё имя расходится с ключом состояния, не читается из st нигде в мосте. ЧТО ВИДНО ПОМИМО ДЕФЕКТА (не меры идеи): академия снова во всех трёх, итого 6 копий из 6; первая волна 299 / 298 / 307 с против 332 / 270 / 441 у первого захода — строка «армию дома не копи» выровняла дебют; убийства без голода просели до 1 / 10 / 1 против 42 / 43 / 33, но партия шла с воротами, отвергавшими найм по 14-25 раз. Разбор - разборы/WOOD_ACADEMY2_ДЕФЕКТ.md
