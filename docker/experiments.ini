[base24]
что = ТОЧКА ОТСЧЁТА на мосту 21.09 после слияния ветки hire-wait. Нужна потому, что base23 ТАК И НЕ ИГРАЛ, а условия с тех пор изменились трижды и все три меняют исход: рынок и XVIII век запрещены ОБЕИМ сторонам (враг больше не строит рынок к третьей минуте), академия разрешена и видна модели с ценой, и починен размен в смешанной паре - мушкетёр против пикинёра давал 1125 вместо 3,0, из-за чего любой стрелок выглядел безнадёжным навсегда. Плюс мост теперь будит модель по событию «здание достроено», SEED сеет несколькими полями, подкрепление волны идёт готовым приказом. Все прежние базы (base21, base22, base23) для сравнения НЕГОДНЫ. Флаги совпадают с hire_channel минус две проверяемые строки, поэтому сравнение будет законным. МЕРЫ, названные ДО прогона: (1) вехи и ЦЕЛЬ - главная; (2) состав армии к пику и к концу, ДОЛЯ СТРЕЛКОВ - на неё смотрит hire_channel; (3) МЕНЯЛ ЛИ ВРАГ СОСТАВ за партию - число тактов со стрелками и с конницей у врага: если враг всегда чистая пехота, замысел hire_channel («у врага другой состав, нужен другой боец») не возникает в принципе, и это решается ЗДЕСЬ, до плеча; (4) сколько раз сменился вид в очереди казармы по полю ba_queues - у базы канал выключен, это фон для сравнения; (5) событийных вызовов должно быть НОЛЬ (канал выключен) - контроль того, что база и правда база; (6) волн на партию и просадка армии врага; (7) TRAIN и апгрейдов за партию; (8) крестьяне свои и врага к концу; (9) контроль: первый ход не позже 15 игровой секунды, иначе копия негодна. ВНИМАНИЕ: мера 3 может закрыть идею hire_channel дешевле, чем сама идея
итог = 9 партий 21.09 на мосту bd8b25b. ВЕХА (убит крестьянин врага) 6/9 в пределах 15 минут и 7/9 за партию, времена 274/283/286/506/538/635/978 с; ПОБЕД (ноль крестьян у врага) 0/9. Волн медианно 25, TRAIN 12-28, UPGRADE 4-12, еда ниже 500 медианно 15 процентов тактов, армия к пику 128-301 и ВСЯ ПЕХОТА - стрелков не собрано НИ В ОДНОЙ партии. Враг: конницы 0/9, стрелки в 3/9 партий числом ОДИН на 3-7 тактов. ВНИМАНИЕ ЧИТАТЕЛЮ: веха и finish - РАЗНЫЕ рубежи, finish=горизонт значит «не добили до нуля», а НЕ «никого не убили»; 21.09 я спутал их при разборе. Мера 5 («событийных вызовов ноль») сформулирована неверно: вызов по достройке включён на master по умолчанию, вышло 28 с медианой 380 с. РАСХОЖДЕНИЕ, не разобрано: RESUME говорит «цель в одной партии из пяти-десяти», здесь 6 из 9. ВНИМАНИЕ 21.09 НОЧЬ: world.md ПОПРАВЛЕН (порог еды 500 действует В МОМЕНТ ЗАКАЗА, а не всё время выпуска; конечный заказ платит вперёд за всю пачку, бесконечный поштучно; голод это ОТДЕЛЬНЫЙ порог и он НОЛЬ). world.md уходит в промпт ЦЕЛИКОМ и КАЖДЫЙ ТАКТ, поэтому сравнение НОВЫХ прогонов с этой базой НЕЗАКОННО - это вторая разница, ровно та, что 20.09 погубила stage_num. Базу снимать заново на мосту с поправленным world.md
ref = master
флаги = --memo --world /io/world.md --critic /io/разбор.md --episodes 3
копий = 3
база = нет, это точка отсчёта

[free_hands]
что = ВТОРОЙ ПОВОД СОБЫТИЙНОГО КАНАЛА: стройка кончилась - куда людей. Замысел игрока 21.09: событийный вызов понравился на найме, развиваем тему. Событие было ровно одно (достроено кующее здание), и всё про него лежало врассыпную; теперь у моста РЕЕСТР ПОВОДОВ, где у повода три части: чем спрашивать, каким системным текстом и как перевести ответ в команды. Второй повод выбран по замеру 455 тактов base24, а не на вкус: свободные крестьяне есть в 44-49 тактах из 49-53, это 12,8 процента всего труда крестьян впустую (медиана по девяти партиям, разброс 9,0-20,3); переход on_build в ноль случается 5-6 раз за партию во ВСЕХ девяти партиях и освобождает медианно 5 человек при 33 крестьянах. Ловим именно ПЕРЕХОД, а не простой: порог по простою сработал бы 24 раза за партию и был бы вторым тактом, а не событием. Узкий вопрос дёшев - в base24 событийный такт стоил 1,9 с и 35 токенов против 6,8 с и 242 у обычного, а обычный такт идёт медианно раз в 21 игровую секунду, в десятой части случаев раз в 46 и дольше (максимум 107): столько эти люди и стоят. Вопрос даёт шесть направлений с числами и ПРАВДУ О НЕВОЗМОЖНОМ (нет мельницы - на еду не пойдёт никто; нет шахты или в ней нет мест; на земле все места заняты), чистый приход по каждому ресурсу, что кончится быстрее всего и через сколько секунд. Модель отвечает ПРИБАВКОЙ, мост сам складывает с теми, кто уже там, и урезает по свободным, говоря об этом вслух. Ключ --free-hands 3 (порог свободных), ОТЛИЧИЕ ОТ БАЗЫ РОВНО ОДНО. Стенд на настоящих состояниях base24 (21 задача, bench_hands.py): qwen2.5:14b 20 годных из 21 при медиане 3,6 с, llama3.1:8b 21 из 21 за 1,8 с, В ПУСТОТУ не послал НИ ОДИН из них ни разу - условие читается. МЕРЫ, названные ДО прогона (в скобках база24): 1) ГЛАВНАЯ - доля простоя крестьян, крестьяно-секунды простоя к крестьяно-секундам всего. Считать ТЕМ ЖЕ инструментом, каким снята база: python3 idle_report.py <идея> <база>. У base24 он даёт медиану 12,4 процента, разброс 9,3-21,2 по девяти партиям (ручной счёт до инструмента давал 12,8 - разница в том, как считается последний такт партии; сравнивать можно только одинаково посчитанное); 2) событий «руки» за партию и медиана промежутка (у базы НОЛЬ, канал выключен); 3) сколько BALANCE пришло от события и сколько от обычного такта, сколько раз мост урезал просьбу; 4) сколько раз модель ответила wait - если почти всегда, повод не нужен; 5) добыча: запасы к концу и тактов с едой ниже 500 (база 5-14 тактов за партию, 96-290 игровых секунд); 6) контроль: вехи и ЦЕЛЬ (база 6 из 9 в пределах 15 минут, 7 из 9 за партию - столько же даёт idle_report), армия к пику 128-301, первый ход не позже 15 игровой секунды. ПРИЗНАК ВРЕДА, названный заранее, ДВА: (а) людей гоняют между ресурсами - число смен направления BALANCE за партию выросло, а запасы и добыча не растут; (б) событие ВЫТЕСНЯЕТ обычный такт - в мосту событийный вызов сдвигает next_call, так что обычных тактов станет меньше на число событий (у базы их около 50 за партию); если вех станет меньше, а простой не упадёт, повод вреден. ОБЪЁМ: 3 копии по 3 партии - ДЕВЯТЬ партий против девяти у базы, то есть столько же; оговорка не в числе партий, а в разбросе - у базы простой гуляет 9,3-21,2 процента, и сдвиг меньше трёх пунктов на девяти партиях за находку не считать. ЗАКОННОСТЬ СРАВНЕНИЯ ПРОВЕРЕНА ДО ПРОГОНА: код моста между bd8b25b (мост базы) и 7ae68ad (точка ветвления) не менялся ни в одном .py и .inc, а при ВЫКЛЮЧЕННОМ ключе ветка даёт дословно тот же обычный запрос - 25 запросов на настоящих состояниях base24 сошлись хэш в хэш (check_same_as_base.py) ВАЖНО, ДОПИСАНО 21.09 ПРИ СЛИЯНИИ: названный выше ПРИЗНАК ВРЕДА «событийный вызов сдвигает next_call и вытесняет обычный такт» БОЛЬШЕ НЕ ДЕЙСТВУЕТ - в тот же день событие переехало в ПАРАЛЛЕЛЬНЫЙ слот и такт им не вытесняется (замер на моке: доля обычных тактов 29 против 56 процентов, полосы событий подряд 12 против 4). Поэтому мера «обычных тактов за партию» у базы base24 и у этого плеча сравнима напрямую, а просадку вычитать из результата не надо. ref сменён с idea/free-hands на master: ветка влита. ИТОГ 21.09 ВЕЧЕРОМ, НАЙДЕНО ГЛАЗАМИ ИГРОКА НА ЖИВОЙ ИГРЕ: ПОВОД НЕ ПОКРЫВАЕТ ТОТ ПРОСТОЙ, РАДИ КОТОРОГО ЗАВЕДЁН. Живая партия на 4e056d0: события «руки» на 34/108/150/299 с и следующее только на 903-й - провал 604 игровых секунды, свободных до 27. Покрытие: тактов со свободными от трёх 40 из 55, событие сработало в ШЕСТИ. Причина: повод ловит переход on_build в ноль (за партию их три), а крестьяне РОЖДАЮТСЯ В РАТУШЕ СРАЗУ СВОБОДНЫМИ и перехода не создают. СЛЕДСТВИЕ: все прежние замеры этой идеи (free_hands -1,6 пункта на дефектной версии, free_hands2 +3,1 после поправки на номер эпизода) мерили НЕПОКРЫТИЕ, а не слабость замысла - сравнивать их с базой как оценку идеи НЕЛЬЗЯ. Прогонять снова до того, как заведён второй способ срабатывания (по накопленному простою с паузой), бессмысленно.
ref = master
флаги = --memo --world /io/world.md --critic /io/разбор.md --episodes 3 --free-hands 3
копий = 3
база = base24

[need]
что = ЦЕНА ОДНОГО ЧЕЛОВЕКА: сколько даст крестьянин, поставленный сюда. Замысел игрока 21.09 по калькулятору производственных функций: в формуле моста нет члена расхода C_r, есть только порог еды 500, и потому нехватку ресурса не с чем сравнить - крестьяне стоят. Счёт по base24 (464 такта, 9 партий, idle_why.py) уточнил замысел: простой есть в 422 тактах из 464, это 12,5 процента всего труда крестьян, и в 100 процентах крестьяно-секунд простоя поставить их БЫЛО КУДА - дерево и камень открыты всегда, места не кончались НИ РАЗУ. При этом на дереве стоял НОЛЬ человек в 28,8 процента этого времени, на камне в 23,8, а 13,2 процента простоя пришлось на такты, где еда уже провалилась под 500 и наём стоял целиком. Значит дело не в местах и не в отказе модели (wait в живых прогонах - 1 ответ из 8): мост нигде не говорил, СКОЛЬКО ДАЁТ ОДИН человек, и нехватку было не в чем считать. Ключ --need 1 добавляет предельную отдачу труда: в обычном такте блок «Цена одного человека» (сколько дают нынешние, сколько даст один, и падение запаса, переведённое в ЛЮДЕЙ), в вопросе «куда людей» - колонка per_man. Числа замерены, а не взяты из головы: дерево 0,96 в секунду на человека и камень 1,07 - по 202 окнам base24, где wip пуст в обоих концах окна (половины набора 0,97/0,95 и 1,05/1,12); шахты 1,63-1,67 - пересчёт замера 18.09. ЕДА СТОИТ «?»: тем же счётом она не берётся (чистых окон 17, половины расходятся вдвое), и выдуманное число хуже честного незнания. КОЛОНКА РАСХОДА ОТМЕНЕНА ЗАМЕРОМ ДО ПРОГОНА: первая редакция считала расход как добыча минус чистое изменение, и по 414 тактам base24 он выходил ОТРИЦАТЕЛЬНЫМ у дерева в 39 процентах тактов, у камня в 43 (медиана расхода к добыче около нуля) - дерево и камень почти не тратятся, там меряется погрешность; у золота и железа расход настоящий, но сверх net не говорит ничего, потому что расход минус добыча это ровно минус net. СТЕНД на настоящих состояниях base24 (21 задача, bench_hands.py --need): qwen2.5:7b годных 21 из 21 и в пустоту ноль в обеих редакциях, qwen2.5:14b 20 из 21 против 21 из 21 (единственная потеря - выбрал закрытое направление, мост отказал вслух). Колонку ЧИТАЮТ: у 14b выбор сместился с еды на дерево (дерево 9 против 4, еда 11 против 15), то есть ровно туда, где в живых партиях стоял ноль человек. МЕРЫ, названные ДО прогона (в скобках base24): 1) ГЛАВНАЯ - доля простоя крестьян, python3 idle_report.py <идея> <база>; у базы медиана 12,4 процента, разброс 9,3-21,2, и сравнивать ТОЛЬКО по совпадающим эпизодам: первый эпизод у базы систематически хуже (15,1 против 11,2 и 13,1); 2) на что пришёлся простой, python3 idle_why.py <идея> <база>: доля простоя при пустом дереве (28,8), при пустом камне (23,8), при еде ниже порога (13,2) - падать должны именно они; 3) BALANCE за партию и доля тактов с простоем, где он отдан (68 процентов у базы); 4) добыча: запасы к концу и тактов с едой ниже 500 (5-14 за партию); 5) контроль: вехи (6 из 9 в пределах 15 минут, 7 из 9 за партию), армия к пику 128-301, первый ход не позже 15 игровой секунды. ПРИЗНАК ВРЕДА, названный заранее, ДВА: (а) людей ГОНЯЮТ - число BALANCE за партию выросло, а простой и запасы не сдвинулись; (б) модель стала ЖДАТЬ чаще: на стенде 7b ответов wait стало 4 из 21 против 2, и если в партии доля wait вырастет, а простой не упадёт, колонка мешает. ОБЪЁМ: 3 копии по 3 партии - девять против девяти у базы; сдвиг меньше трёх пунктов простоя за находку не считать. ЗАКОННОСТЬ ПРОВЕРЕНА ДО ПРОГОНА: при ВЫКЛЮЧЕННОМ ключе обычный запрос дословно тот же, что у моста базы bd8b25b - 25 запросов на настоящих состояниях base24, разошлось 0 (check_same_as_base.py); 37 самопроверок чисты.
