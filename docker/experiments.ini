итог = ЗАМЕР НЕ СОСТОЯЛСЯ, и это главный результат. 20.09 вечером, 2 копии по одной партии (серия остановлена после первых), мост 1ce25e4, обе до горизонта, ЦЕЛЬ 0 из 2. ПРИЧИНА: условие связки (наш урон упёрся в ПОЛ) возникло ТОЛЬКО В ОДНОЙ партии из двух — в w2 шесть тактов с 7:58 до 10:31, в w1 НИ РАЗУ за 55 тактов, то есть та партия по сути шла как base22. Пересчёт по состояниям: в base21 условие тоже возникало лишь в одной копии из двух (10 тактов из 104). ГДЕ СВЯЗКА ЗАГОВОРИЛА, МОДЕЛЬ ПОСЛУШАЛАСЬ: стрелки в w2 выросли 6 -> 51. НО база тоже уходит в стрелков без всякой связки (b2 дал 28 стрелков), значит мера «состав к концу» связку НЕ ВЫДЕЛЯЕТ. Числа: волн 3 и 21, пик армии 225 и 97, просадка врага 81 и 12, к концу 177/29 и 11/24. РАЗБРОС ВНУТРИ ПЛЕЧА БОЛЬШЕ РАЗНИЦЫ МЕЖДУ ПЛЕЧАМИ (225 против 97 внутри switch4 при 132/115 у base22) — различить эффект нечем. То же самостоятельно сказал критик в режиме --critic-series: «разброс: внутри switch4 разница 128, внутри base22 17, между плечами 20-110, порядок тот же; нужно 10-15 партий на плечо». ЧТО ДЕЛАТЬ: не повторять парой партий. Либо 10-15 партий на плечо, либо отбирать для счёта только те партии, где условие возникло, и мерить прирост армии за 5 минут после каждого срабатывания. ОТДЕЛЬНО, про w2: после первой же атаки на 12:17 модель ушла в непрерывный штурм (21 волна), армия срезалась 97 -> 35, его армия выросла 113 -> 247 — это поведение НЕ связкой вызвано, но именно оно определило исход партии

[base_hit]
что = СВЯЗКА 1: ГОТОВЫЙ ПРИКАЗ РЯДОМ СО СТРОКОЙ «ЕГО ОТРЯД В K КЛЕТКАХ». Строка говорится с 19.09 и называет число (сколько их, сколько остальных, перевес против ЭТОГО отряда), но приказа при ней нет. По правилу матрицы это то же, что молчание: замер 20.09 на 51 такте - MOVE упомянут в 75 процентах тактов и отдан НОЛЬ раз, UPGRADE назван в 2 процентах и отдан 56 раз, потому что рядом стоят цена и выигрыш. Связка ставит рядом готовый ATTACK count:"all" в клетку отряда, размен у базы (0,67 против 0,19 в поле, замер 30 партий) и ПЛАТУ (дом без прикрытия, остальные подходят). Ключ --base-hit, по умолчанию выключен. ЕСТЬ ЛИ ШАНС, посчитано ДО прогона пересчётом по 209 состояниям base21: строка «ЕГО ОТРЯД» выпадает в 76 тактах, из них 49 - в 3-5 клетках, где блок «ВРАГ У ТВОЕЙ БАЗЫ» (радиус 2) молчит; в этих 49 тактах модель посылала волну ДВАЖДЫ и лишь ОДИН раз в клетку этого отряда. То есть положение мост распознаёт, а модель его не отрабатывает. ОТСЕЧКА ПО СИЛЕ: приказ даётся только когда свободных хватает на кулак по размену (43 такта из 49); в остальных 6 мост говорит вслух «бить нечем, держи дома» - без неё связка звала бы бить отряд 8 последними десятью бойцами при 130 его рядом, такой такт в base21 есть. ОТЛИЧИЕ ОТ base22 РОВНО ОДНО, и это ДОКАЗАНО, а не заявлено: при выключенном ключе промпт совпал с прежним ДОСЛОВНО на всех 209 состояниях base21 (сверка рендера до и после правки). МЕРЫ, названные ДО прогона (в скобках база): (1) ГЛАВНАЯ - вехи и ЦЕЛЬ (0 из 4 у base21); (2) доля тактов с приказом связки, где модель ДЕЙСТВИТЕЛЬНО послала волну в клетку этого отряда - база 1 такт из 49, считается по полю aim трассы против клетки отряда, пересчитанной из состояния; (3) просадка армии врага (268 за 4 партии base21) и потери на волну ОТДЕЛЬНО при обороне и вылазке; (4) армия к пику и к концу (294/267/200/223 и пехота 285/171/194/218); (5) волн на партию (4,75). ПРИЗНАК ВРЕДА: модель начнёт дробить армию на мелкие вылазки к каждому отряду - волн станет больше, а потери на волну вырастут, армия к концу упадёт ниже base22; отдельно смотреть такты, где связка сказала «бить нечем», - не пошла ли волна вопреки. ОГОВОРКА: в 8 тактах из 43 рядом звучит строка про дотекание нашей волны в поле («либо копи новый кулак, либо посылай столько, чтобы хватило») - это про волну в ПОЛЕ, а не про отряд у дома, но читаться может как спор
