что = РАЗМЕН СЧИТАЕТ МОСТ: одиночный размен по формуле игры (урон = атака минус защита по типу оружия, не меньше 1; lib/miscext2.script:380), групповой по матрице видов, окупаемость следующей ступени с ценой из таблицы нации. Отличие от base19_again ровно одно: версия моста, в остальном флаги те же. Повод - провал attack_upg: подсказка «бери атаку раньше защиты» довела до пятой ступени за 16030 еды и армии на четверть меньше, тогда как счёт даёт РАЗНЫЙ ответ по положению (при равных бойцах защита 0,88 на тысячу еды против 0,19 у атаки, против накачанного врага наоборот 5,56 против 4,00). МЕРЫ, названные ДО прогона: (1) какие ступени берёт и в каком порядке - ждём отказа от дорогих верхних; (2) доля партий с атакой и с защитой по отдельности; (3) размен нашего пикинёра к концу партии против его - сейчас 8/3 против 13/7; (4) волн на партию и потери на волну, отдельно вылазки и оборона; (5) вехи и цель - главная мера. ПРИЗНАК ВРЕДА: если модель начнёт копить на апгрейды и перестанет слать волны (как в attack_upg), армия к концу окажется меньше, чем в плече без расчёта
