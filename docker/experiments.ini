[local_llama]
что = ПОВТОР ПЛЕЧА local_events НА МОДЕЛИ, КОТОРАЯ НЕ ЖДЁТ. Прошлое плечо взяло свою меру и провалило смысл: хвост срезан (максимум 2,7 с против 6,5 у base26 и 17,5 у buy_wip), отказов ноль, но qwen2.5:7b ответила ЖДУ в 5 событиях из 9, а облако - 0 из 20. КАНДИДАТ ВЫБРАН ЗАМЕРОМ, А НЕ ДОГАДКОЙ: девять событийных запросов взяты ИЗ ТРАСС local_events КАК ЕСТЬ (поле «запрос») и прогнаны путём моста через /v1 четырьмя локальными моделями - разница в ответах это разница модели, а не промпта. llama3.1:8b ЖДУ 0 из 9 при медиане 2,4 с; mistral тоже 0 из 9, но в 4 случаях из 9 зовёт мушкетёров (её известный порок - стрелки без угля); qwen2.5:14b ЖДУ 4 из 9, то есть ведёт себя как 7b и вдвое медленнее (медиана 4,3 с); qwen3:30b-a3b негодна вовсе, см. секцию local_qwen3. СВЯЗКА НАЗВАНА ЦЕЛИКОМ, как и в прошлый раз: локальная событийная модель + схема ответа (включается ровно тогда, когда событие уходит локальной). Обычный такт идёт в облако, как в базе. ГЛАВНОЕ, ЧТО ВЫЯСНИЛОСЬ ДО ПРОГОНА И МЕНЯЕТ МЕРУ: мера «доля ЖДУ» СПУТАНА С СОСТОЯНИЕМ ЕДЫ. Модель заказывает найм БЕЗ СЧЁТА (total=-1), а у бесконечного заказа в движке стоит проверка на 500 еды (building.inc/doprogressorders.inc:199; по живым замерам проекта при еде ниже 500 производство стоит). Из пяти ЖДУ у qwen2.5:7b ЧЕТЫРЕ пришлись на еду 256, 250, 370 и 373 - то есть на состояния, где найм и так не пошёл бы, и только одно на 518. Сравнивать плечи по голой доле ЖДУ поэтому НЕЛЬЗЯ. Но разница между «ЖДУ» и «заказать» остаётся настоящей и меряется: бесконечный заказ, отданный при низкой еде, ОСТАЁТСЯ СТОЯТЬ и пойдёт сам, когда еда вернётся выше порога, а после ЖДУ очереди нет вовсе и повод для ЭТОЙ казармы больше не сработает - он заведён на достройку. МЕРЫ, НАЗВАННЫЕ ДО ПРОГОНА. (1) ГЛАВНАЯ, и она новая: СУДЬБА ЗАКАЗА, ОТДАННОГО ПРИ ЕДЕ НИЖЕ 500 - пошло ли производство в этой казарме после того, как еда вернулась выше порога, и через сколько секунд. Считать по трассе: событие с едой ниже 500, затем первый такт с едой выше 500, затем прирост mil_inf. У base26 таких случаев нет вовсе (облако не ждёт и заказывает сразу), у local_events их четыре - и там очереди не было. (2) ДОЛЯ ЖДУ, но ОТДЕЛЬНО для еды выше и ниже 500: предсказание по повтору девяти запросов - 0 из 9 в обоих ящиках; у qwen2.5:7b было 1 из 5 выше порога и 4 из 4 ниже. Предсказание названо ДО прогона и проверяется им. (3) ВРЕМЯ события, медиана и МАКСИМУМ: на повторе 2,4 и 6,7 с (максимум - первый вызов, платил загрузкой), у облака в base26 1,5-1,7 при 6,5, у qwen2.5:7b 2,3 при 2,7. (4) ГОДНОСТЬ - доля событий, чей ответ мост принял (rejected пусто, команда ушла): у облака 20 из 20, у qwen2.5:7b 9 из 9. (5) ДОЛЯ КОНЕЧНЫХ ЗАКАЗОВ: llama на повторе трижды из девяти назвала число (90, 10, 90) вместо -1, а у конечного заказа в движке ДРУГАЯ проверка ресурсов, чем у бесконечного. Это не порок, это поведение, и его надо знать. (6) КОНТРОЛЬ СВЯЗИ: сколько раз «сервер не принял СХЕМУ СОБЫТИЯ», сколько вызовов сорвалось. АДРЕС МАКА 23.09 СМЕНИЛСЯ с 10.41.3.31 на 10.41.2.77 (DHCP), и это стоило получаса: ping отвечал «host unreachable» ОТ ШЛЮЗА, а Windows считает такой ответ полученным пакетом и пишет «0 процентов потерь» - проверять портом, а не пингом. Если ollama отвалится среди партии, прогон НЕГОДЕН, а не медленный. (7) ИГРОВЫЕ, для контроля, что игра не изменилась: веха и времена (base26: 3/4, 271/305/337 с), событий на партию (2,2, медиана 474 с), волн, TRAIN и UPGRADE, еда ниже 500 (медиана 18 процентов), «УЖЕ ЗАЛОЖЕНО» (19 процентов), урезаний BALANCE (18 процентов). (8) КОНТРОЛЬ ПАРТИИ: первый ход не позже 15 игровой секунды, условия по match.dat. ЧЕГО ЖДАТЬ НЕ СЛЕДУЕТ: событий 2-3 на партию, то есть 9-12 на четыре - повадку это покажет, числом не станет; игровые меры на четырёх партиях шум. Честный ожидаемый итог - «ЖДУ пропало, очередь стоит и сама пошла по еде, хвоста нет, игра прежняя». МОДЕЛЬ ГРЕЮТ ДО СТАРТА: python warm_local.py llama3.1:8b --host 10.41.2.77
итог = 4 партии 23.09 на мосту db1fae3, фермой, ВСЕ ДО ГОРИЗОНТА, 246 тактов, 11 событий. КОНТРОЛЬ: мост и флаги сверены во всех копиях, первый ход на 3-4 игровой секунде. (2) ЖДУ 0 ИЗ 11 - предсказание, названное до прогона по повтору девяти запросов (0 из 9), ВЫПОЛНЕНО; у qwen2.5:7b было 5 из 9. (3) ВРЕМЯ: медиана 2,2 с, МАКСИМУМ 2,6 с против облачных 1,7 и 6,5 у base26 - хвост срезан, медиана хуже на полсекунды. Это уже ВТОРОЕ подтверждение того же: у qwen2.5:7b было 2,3 при 2,7. (4) ГОДНОСТЬ 11 из 11, отказов моста ноль, жалоб на схему нет, связь не рвалась ни разу. (5) КОНЕЧНЫХ ЗАКАЗОВ 4 из 11 (предсказано 3 из 9): llama называет число (90, 53, 69) вместо -1; у облака 0 из 7, у qwen 1 из 9. РОЛИ: infantry17 девять раз, dragoon17 два раза; мушкетёров события не заказывали ни разу. (1) ГЛАВНАЯ МЕРА ВЗЯТА, НО САМ ВОПРОС ОКАЗАЛСЯ ПУСТЫМ. Судьба заказа при еде ниже 500: пять случаев, во всех производство пошло, когда еда вернулась выше порога (mil_inf 4->19, 10->20, 10->15, 33->62, 12->33); у base26 таких случаев три, и там то же самое. НО ВСТРЕЧНАЯ ПРОВЕРКА ОТМЕНИЛА ПОСТАНОВКУ ВОПРОСА: у local_events после КАЖДОГО «ЖДУ» армия росла ТАК ЖЕ (0->19, 0->15, 0->10, 58->103), потому что ОБЫЧНЫЙ ТАКТ ЗАКАЗЫВАЕТ НАЙМ САМ - в том же окне 3-6 команд TRAIN. Событие НЕ единственный путь к найму, и утверждение разбора «пока модель ждёт, новая казарма стоит пустой» неверно. Значит повод «найм по достройке» на игру не влияет вовсе, кем на него ни отвечай, и ЖДУ не стоило ничего. (7) ИГРОВЫЕ: цель 0 из 4 у обоих. Волн 101 против 79; TRAIN infantry17 19 против 12, musk17 7 против 1; СТРЕЛКОВ ДО 88 В ОДНОЙ ПАРТИИ, тогда как в восьми партиях base25/base26 их ноль во всех - НО стрелков заказал ОБЫЧНЫЙ ТАКТ (облако), а не события, так что к плечу это отношения не имеет и остаётся разбросом партии. Еда ниже 500 по копиям [15,19,46,10] против [12,28,9,22]; тактов «УЖЕ ЗАЛОЖЕНО» 27 процентов против 19 - отмечено наблюдением, событийный канал промпта такта не касается. Копия 3 бедная: 9 волн, пехоты 96. ВЫВОД: связка (локальная модель + схема на событии) берёт своё - хвост срезан, годность целая, связь надёжна; но ЦЕНА ЭТОГО ВЫИГРЫША БЛИЗКА К НУЛЮ, потому что повод, на котором канал держится, игру не двигает. Прежде чем возвращаться к локальным моделям, нужен повод, которого обычный такт НЕ дублирует. ДЕНЬГИ: прогон стоил около 1,7 доллара
