база = base28

[wave_resets]
что = ПРЕДЕЛ НА СБРОСЫ СРОКА ПОВЕРХ МАРШЕЙ «К ВОЛНЕ». База - wave_march (пять партий, мост aa0a1fd/f36534c, тот же промпт, что сейчас в master): там впервые появилась выборка походов - 15 на пять партий, и из них до удара дошли 7, истекли 0, ЗАВИСЛИ 8. Истечений ноль потому, что срок сбора обнуляется каждым подкреплением (находка мака 24.09): зависший поход нельзя ни довести до удара, ни отменить. Ключ --gather-resets 1 возвращает ВЫХОД: после одного сброса срок больше не обнуляется, и поход либо бьёт, либо истекает и освобождает войско. Отличие от базы ровно одно - этот ключ; --wave-march 1 в обоих. ПРЕДСКАЗАНИЯ, НАЗВАННЫЕ ДО ПРОГОНА. (1) ГЛАВНАЯ: доля походов, кончившихся ХОТЬ ЧЕМ-ТО (удар или истечение) - у базы 7 из 15 (47 процентов), ожидается близко к 100: зависших быть не должно. (2) КОНТРОЛЬ, что выход не куплен ценой удара: доля походов до удара - у базы 7 из 15; предсказание мака по двенадцати походам - число ударов НЕ ПАДАЕТ. Если ударов станет заметно меньше, предел режет живые походы, и тогда он вреден. (3) маршей за партию - у базы 5/3/2/3/2, ожидается столько же или больше (освобождённое войско может уйти в новый марш). (4) ИГРОВЫЕ, для сверки, не как результат: убито крестьян врага (база 32/47/14/19/21, медиана 21), свои потери (246/251/282/57/30), крестьян врага к концу (медиана 100), веха. (5) контроль: события и их время, простой в дебюте, первый ход не позже 15 с. ЧЕГО ЖДАТЬ НЕ СЛЕДУЕТ: две партии против пяти - наблюдение; походов будет 4-8, и доля по ним грубая. Честный ожидаемый итог: «зависших нет, ударов столько же, игра прежняя»
итог = 2 ПАРТИИ 24.09 на мосту 1b3d740, обе до горизонта, 90 тактов, 13 походов. (1) ГЛАВНОЕ ПРЕДСКАЗАНИЕ ВЫПОЛНЕНО ДОСЛОВНО: кончились хоть чем-то 13 из 13 (100 процентов) против 7 из 15 у wave_march; зависших НОЛЬ против 8; истечений 6 против 0. Сбросов срока у похода не больше ОДНОГО против 7-35 у базы - ключ делает ровно то, что заявлен. (2) КОНТРОЛЬ ВЫПОЛНЕН: до удара 7 из 13 (54 процента) против 7 из 15 (47) - предел не режет живые походы; на партию ударов 3,5 против 1,4. (3) Походов на партию 5 и 8 против медианы 3 у базы - освобождённое войско идёт в новый марш, как и ожидалось. (4) ИГРОВЫЕ, и тут снова оговорка про две партии: убито крестьян врага 25 и 79 (медиана 52, сумма 104 за две партии) против медианы 21 у wave_march; у врага к концу 111 и 12; свои потери 250 и 43. ВТОРАЯ КОПИЯ - ЛУЧШАЯ ПАРТИЯ ПРОЕКТА: 79 убитых при 43 своих, у врага осталось ДВЕНАДЦАТЬ крестьян, ближе к цели не подходила ни одна партия (прежний рекорд - 11 у пробы debut, но там 48 убитых при 5 своих). Первая копия - обычная партия уровня wave_march. Разброс между ними трёхкратный, и на двух партиях это наблюдение, не результат. (5) Контроль: события 5,1 и 5,2 с (грелка предупредила о 4,3 до старта - чуть медленнее обычного, в норме); простой в дебюте 43 и 38 процентов - как у баз; веха в обеих. ВЫВОД: ключ обязателен поверх --wave-march - без него больше половины походов виснет; вместе они впервые дают боевую машину, которая заводится, собирается и либо бьёт, либо отпускает. Сильнее ли она бьёт - две партии сказать не могут; чтобы сказать, нужны четыре, и это первое, на что стоит потратить деньги, когда они появятся. ДЕНЬГИ: около 0,9 доллара, остаток около 2,7. ДОСНЯТО ДО ШЕСТИ КОПИЙ 24.09 вечером (копии 3-6, мост 153cd18; копии 1-2 на 1b3d740 — разница между мостами только отчётная, правка про голод врага, игру нигде не гейтит, сверено git log). ГЛАВНАЯ МЕРА ОКАЗАЛАСЬ НЕ ОПРЕДЕЛЕНА, и это важнее самого плеча: число «походов» зависит от способа их резать, а способ возмущается проверяемым ключом. Три защитимые группировки на одних данных дали по t0 — база 154 похода (8 процентов дошли) против идеи 65 (22); по непрерывной череде тактов — 10 (70) против 14 (71); по падению «сбросов» в ноль — 21 (57) против 37 (86). Ни одна не воспроизводит прежние «13 из 13 против 7 из 15»: тот счёт не восстанавливается. Причина в t0 — он якорь СРОКА и уезжает при каждом сбросе, а сбросы режет ровно --gather-resets (разборы/ПОХОДЫ.md). С 24.09 мост пишет устойчивое поле «поход»; на трассах старше него доли перемерить НЕЛЬЗЯ. УСТОЙЧИВО ПРИ ЛЮБОЙ ГРУППИРОВКЕ, и только это можно брать на веру: истечений у базы НОЛЬ при всех трёх способах, у идеи 2-18 — выход у похода появляется только с ключом; и удары на копию РАВНЫ (2,4 против 2,3 по t0; 1,4 против 1,33 по череде), то есть предел не режет живые походы. ИГРОВОЙ ИТОГ ПО ШЕСТИ КОПИЯМ (голод вычтен, starve_report.py): убито 21/67/33/28/14/19, медиана 24,5 против 18 у базы (29/43/11/11/18); свои потери медиана 148 против 246; крестьян врага к концу 111/12/12/124/132/128, медиана 124 против 100 у базы — то есть по медиане ХУЖЕ, но ДВЕ партии из шести довели врага до 12, чего база не делала ни разу (её минимум 63). Размахи перекрываются почти целиком. ВЫВОД ПОСЛЕ ШЕСТИ КОПИЙ: механическое обещание ключа выполнено, игрового усиления не показано. Прежний вывод «впервые боевая машина» держится на механике, а не на игровом итоге. Двугорбость плеча разобрана отдельно — разборы/ЭНДШПИЛЬ.md
ref = master
флаги = --memo --world /io/world.md --critic /io/разбор.md --episodes 1 --wave-march 1 --gather-resets 1
копий = 2
база = wave_march

[gather_share]
что = ЧЕСТНАЯ ПЛАНКА СБОРА: удар, когда у клетки собралась ДОЛЯ 0.33 от min(послано, живая армия). База - wave_resets (шесть копий, мост 1b3d740/153cd18), то есть --wave-march 1 --gather-resets 1 в обоих; отличие ровно одно - эта планка. ОТКУДА ВЗЯЛОСЬ (разборы/ЭНДШПИЛЬ.md, счёт по 11 трассам с одинаковыми условиями). Крестьяне врага - процесс с накоплением: в 9 партиях из 11 счётчик врага с седьмой минуты растёт 23 -> 86..126, и сумма убитых исход не решает (wave_march/2 убила 43 и оставила 114; wave_resets/3 убила 33 и оставила 12). Решает, держим ли мы нажим до конца. В ПОСЛЕДНЕЙ ТРЕТИ (t > 800 с) мы не бьём НИ РАЗУ в семи партиях из одиннадцати, а господствующее состояние эндшпиля - «сбор», 6-19 тактов подряд; в wave_march/4 и /5 армия из 188-193 человек простояла в сборе 32 такта из 33 до конца партии. Ключ --gather-resets вечный поход разомкнул, но освободившееся войско уходит собираться заново, а не бить. Прежний замер планки: при пороге 2/3 от накопленного «послано» удар не случался НИ РАЗУ за 55 тактов марша, при 0.33 состоялся бы в 16 из 55. ПРЕДСКАЗАНИЯ, НАЗВАННЫЕ ДО ПРОГОНА. (1) ГЛАВНАЯ: тактов «удар» после 800 с - у базы 3/1/1/0/0/0 (ноль в четырёх копиях из шести), ожидается не ноль в обеих копиях. (2) КОНТРОЛЬ, что ранний удар не куплен разменом армии: свои потери - у базы 249/43/13/148/124/224, медиана 136; рост вдвое считать вредом. (3) крестьяне врага к концу - у базы 111/12/12/124/132/128, медиана 124; ожидается ниже, но ДВЕ копии этого не покажут - размах базы десятикратный. (4) контроль: убито крестьян врага ЗА ВЫЧЕТОМ ГОЛОДА (starve_report.py; у базы 21/67/33/28/14/19), походы считать по полю «поход», а не по t0 (разборы/ПОХОДЫ.md). (5) контроль: первый ход не позже 15 с, события родным путём. ЧЕГО ЖДАТЬ НЕ СЛЕДУЕТ: две копии - это проба механизма, а не измерение игры. Честный ожидаемый итог: «удары в эндшпиле появились, потери не выросли»
итог = 2 ПАРТИИ 24.09 на мосту 975d91d, обе до горизонта, трейсбеков ноль, первый ход на 5 с. ГЛАВНОЕ ПРЕДСКАЗАНИЕ НЕ ВЫПОЛНЕНО: тактов «удар» после 800 с - 1 и 0 при ожидании «не ноль в обеих». НО МЕХАНИЗМ СРАБОТАЛ, и это видно по новому полю «поход» (первые трассы, где оно есть): походов 4 и 6, из них до удара 3 и 4, зависших 0 и 2. Планка делает ровно то, что обещала - сбор завершается ударом в двух третях походов. ИГРА ОТ ЭТОГО СТАЛА ХУЖЕ, и резко. Убито крестьян врага ЗА ВЫЧЕТОМ ГОЛОДА: 2 и 0 против 21/67/33/28/14/19 у базы - НИЖЕ БАЗОВОГО МИНИМУМА, причём вторая копия не убила НИ ОДНОГО за всю партию. (Без правки меры 24.09 прогон прочитался бы как «12 и 6» - слабо, но живо; голодных там 10 и 6.) Крестьян врага к концу 145 и 118 против медианы 124 - улучшения нет. КОНТРОЛЬ ПО ПОТЕРЯМ ВЫПОЛНЕН: 147 и 221 против медианы 136 и размаха 13-249 у базы - вдвое не выросли, то есть удары куплены не разменом армии. МЕХАНИЗМ НЕУДАЧИ НАЗВАН ЧИСЛАМИ: планка 0.33 бьёт третью частью кулака - у копии 1 послано до 275, а у сбора в миг удара максимум 79. Удар третью силы не убивает крестьян: он доходит и ничего не делает. ВЫВОД: направление «опустить планку сбора» ЗАКРЫТО - не потому, что планка не работает, а потому, что работает и этим вредит. Узкое место эндшпиля (разборы/ЭНДШПИЛЬ.md) остаётся открытым, но лечить его надо не порогом: нужен способ собрать КУЛАК и ударить им, а не ударить тем, что успело прийти. ОГОВОРКА: две копии - проба механизма. Слабость вывода в том, что копий мало; сила - в том, что ноль убитых ниже всего размаха базы (14-67). Походы базы в этой строке сравнивать НЕЛЬЗЯ: там поля «поход» нет и счёт идёт по t0, который завышен (разборы/ПОХОДЫ.md). ДЕНЬГИ: около 0,9 доллара
